он тогда был рядом со мной. Только теперь мне хотелось дать ему нечто другое. Бесконечную ласку, терпение, заботу. Хотелось обращаться с ним так бережно, словно от одного неосторожного движения он мог исчезнуть, раствориться в воздухе, а я снова остался бы наедине с тем, что сам же и натворил.</p><p>В голове теснились слова. Целые предложения, признания, обещания, которые я перебирал про себя, менял местами, отбрасывал и начинал заново. Мне хотелось сказать ему, как сильно я хочу его присутствия в своей жизни. Как много для меня значат даже самые незначительные вещи, связанные с ним. Хотелось объяснить, что за моей неловкостью, молчанием и привычкой отступать скрывается не равнодушие, а нечто настолько огромное, что я сам не знал, куда это деть.</p><p>Но я бы никогда не смог произнести всё это вслух. Не потому, что не находил подходящих слов. Их было слишком много. Просто я не мог представить, что человек вроде меня вправе просить о такой близости, принимать её, отвечать на неё. Я слишком сильно ненавидел и презирал себя, чтобы поверить: кому-то действительно может быть хорошо рядом со мной. Даже если этот кто-то — он.</p><p>Хочу повернуться к нему. Всего лишь повернуть голову, встретиться с ним взглядом и хотя бы на этот раз не отвести глаза первым. Выдержать его внимание, не искать спасения в стенах, предметах, случайных деталях интерьера. Хочу, чтобы он посмотрел на меня и понял хоть что-нибудь из того, что я так старательно прячу за молчанием. Хочу, чтобы он сам сократил это расстояние между нами — сделал то, на что мне самому не хватает решимости.</p><p>И я понимаю, насколько это несправедливо. Ждать от другого человека смелости, которой у меня самого нет. Заставлять его угадывать мои желания, читать по едва заметным движениям, искать смысл в паузах, которые я оставляю вместо ответа. Я будто выставляю перед ним закрытую дверь, а потом обижаюсь на то, что он не входит. Хотя даже не знаю, сумел бы я открыть её, если бы он постучал.</p><p>Потому что я боюсь. Боюсь, что он действительно это сделает. Что расстояние, которое сейчас кажется таким незначительным и одновременно непреодолимым, наконец исчезнет. Что воздух между нами перестанет быть просто воздухом, а случайное прикосновение утратит своё удобное оправдание. Тогда мне придётся признать, что я хочу этого. Что всё это время ждал именно этого. И что за свечами, музыкой, приглушённым светом и прочими красивыми декорациями нет никакой особенной тайны — только я, который отчаянно хочет быть ближе и совершенно не представляет, что делать, когда такая возможность наконец появляется.</p><p>Я сглатываю, чуть сильнее сжимаю пальцы и продолжаю смотреть на стену. Будто там действительно есть что-то важное. Будто стоит задержать взгляд ещё на несколько секунд, и вечер снова станет просто вечером, а мне не придётся ничего решать.</p><p>— О чём ты думаешь сейчас? — тихо спрашивает он.</p><p>А я даже не знаю, что ответить. О многом. Обо всём сразу и ни о чём конкретном. Мысли цепляются одна за другую, сталкиваются, перебивают друг друга, и ни одна не задерживается достаточно долго, чтобы я мог ухватиться за неё и превратить в связное предложение.</p><p>Думаю о том, какой он красивый. О том, как странно видеть его здесь, в моей квартире, среди вещей, которые я привык считать продолжением самого себя. Думаю о собственной вине — старой, привычной, почти родной. О боли, которую так боюсь причинить другим, но почему-то без особых затруднений причиняю себе. О том, сколько всего во мне противоречит друг другу и как мало из этого я способен объяснить даже самому себе.</p><p>Думаю о нём. О себе. О нас, хотя не уверен, имею ли право так говорить. О том, что было, чего не было и что, возможно, никогда не произойдёт. И чем дольше я пытаюсь разобраться, тем бессмысленнее всё кажется. Не потому, что мне нечего сказать. Наоборот — внутри слишком много всего, но стоит представить, что я произнесу это вслух, как слова теряют значение. Становятся нелепыми, жалкими, недостаточными. Я не хочу отдавать ему что-то настолько искреннее, а потом обнаружить, что не сумел объяснить даже половины.</p><p>— О многом… Я не знаю, как тебе объяснить…</p><p>— Наверное, не… — он не успевает договорить.</p><p>— Нет, подожди. Я знаю, о чём думаю.</p><p>Слова вырываются прежде, чем я успеваю передумать. Я сам не понимаю, откуда они берутся и почему именно сейчас, когда ещё секунду назад не мог подобрать даже простого ответа. Но, кажется, всё это время они были где-то рядом, просто я не решался произнести их вслух.</p><p>— О том, что ты моя свобода.</p><p>Я замолкаю. Сказанное повисает между нами. Не объяснять, не уточнять, не искать более подходящих слов. Потому что любое продолжение сейчас только испортит то, что я едва сумел сказать.</p><p>Я не знаю, что именно подразумеваю под свободой. От собственной головы? От бесконечного суда, который устраиваю над собой? От необходимости каждую минуту доказывать, что имею право существовать? Возможно, от всего сразу. Рядом с ним мне иногда кажется, что я могу хотя бы ненадолго перестать быть собственным надзирателем. Не оправдываться. Не выносить себе приговор. Просто находиться рядом с другим человеком и не считать это очередным преступлением.</p><p>И всё же я не хочу делать из него спасение. Не хочу возлагать на него ответственность за то, что сам годами не мог исправить. Он не обязан освобождать меня от меня самого.</p><p>Но рядом с ним мне впервые хочется попробовать.</p><p>Я больше ничего не говорю. И он тоже молчит.</p><p>Его губы касаются моего виска, и меня пробивает током. Совсем короткое прикосновение, почти невесомое, но я чувствую его так остро, словно на мгновение перестаю принадлежать самому себе.</p><p>Заслужил ли?</p><p>Мысль возникает мгновенно, привычно, раньше, чем я успеваю осознать само прикосновение. Будто даже такую малость необходимо заслужить, будто нежность — не то, что можно просто получить, а нечто, на что требуется разрешение. Я почти жду, что за ней последует расплата. Что сейчас обнаружится какая-нибудь ошибка, что он передумает, отстранится, увидит во мне то, что я сам так старательно пытаюсь скрыть.</p><p>Но это ведь не поцелуй Иуды.</p><p>Это поцелуй ангела.</p><p>И от этой мысли становится ещё страшнее. Потому что я не знаю, что делать с такой нежностью. Не знаю, как принимать её, не пытаясь немедленно найти собственную вину. Не знаю, можно ли просто закрыть глаза и позволить кому-то быть рядом, не превращая его прикосновение в очередное испытание.</p><p>Я чувствую, как по щеке сползает слеза. Даже не сразу понимаю, что плачу. Он замечает её раньше меня и утирает рукавом. Так просто, без вопросов и попыток заставить меня что-нибудь объяснить.</p><p>И, кажется, именно это оказывается самым невыносимым.</p><p>Он смотрит на меня, и теперь мне уже некуда спрятать глаза. Я встречаю его взгляд, задерживаюсь на лице, на едва заметном движении губ, на том, как он будто собирается что-то сказать, но передумывает. И вместо слов целует меня.</p><p>Не резко, не жадно. Медленно, осторожно, словно пробует на вкус то, чего прежде не знал, и хочет запомнить. Я отвечаю не сразу — на одно короткое мгновение будто забываю, что от меня вообще требуется. Вся моя прежняя решимость куда-то исчезает, оставляя после себя только растерянность и почти болезненное осознание происходящего. А потом я всё-таки подаюсь навстречу.</p><p>Поцелуй становится глубже. Его пальцы сжимают ткань моей толстовки, собирают её в кулак, и я чувствую, как материал натягивается у груди. Такое простое движение. Почти незаметное. Но почему-то именно оно окончательно убеждает меня, что всё это происходит на самом деле.</p><p>I grieve in stereo, the stereo sounds strange<br>I know that if you hide, it doesn't go away<br>If you get out of bed and find me standing<br>All alone, open-eyed, burn the page, my little dark age</p><p>Я мог бы взять его за запястье. Разжать пальцы, притянуть ближе, самому задать темп и больше не оставлять между нами места для этой мучительной неопределённости. Мог бы — и, наверное, ещё недавно именно так и поступил бы. Мне всегда было проще самому определять, что произойдёт дальше, чем оставаться в ожидании чужого решения. Контроль хотя бы создаёт иллюзию, что я понимаю происходящее. Что могу предугадать следующий шаг, подготовиться к нему, не оказаться застигнутым врасплох.</p><p>Но сейчас я не делаю этого.</p><p>Мне хочется узнать, что будет, если хотя бы ненадолго перестать направлять каждое движение. Не проверять, не предугадывать, не пытаться оказаться на шаг впереди. Не превращать происходящее в очередную систему, в которой у каждого жеста должно быть объяснение, а у каждого действия — заранее известный результат. Просто остаться здесь. Не торопить его, не подталкивать к тому, чего он, возможно, сам ещё не решил. Позволить ему самому определить, насколько близко он хочет быть.</p><p>И это оказывается гораздо труднее, чем я думал. Потому что вместе с контролем мне приходится отказаться и от привычной возможности объяснить всё происходящее собственными действиями. Если я сам притяну его к себе, если сам сокращу расстояние, то всегда смогу сказать, что именно этого и хотел. Но если он сделает следующий шаг самостоятельно, мне уже некуда будет спрятаться за собственными решениями.</p><p>Я просто хочу знать, что он действительно этого хочет. Что дело не в моей настойчивости, не в удачно выбранном моменте, не в том, что я сумел направить всё именно туда, куда мне хотелось. Что у него есть собственное желание быть рядом со мной, не выдуманное мной и не извлечённое из случайных жестов.</p><p>Я просто хочу знать, что Ангел действительно выбрал меня сам.</p><p>Его губы касаются моей шеи, и я невольно запрокидываю голову, освобождая ему место. Прикосновение оказывается настолько естественным, что на мгновение я забываю обо всём остальном. О комнате, о музыке, о собственных мыслях, которые ещё совсем недавно не давали мне покоя. Я чувствую тепло его дыхания, движение руки, лёгкое давление пальцев. И впервые за долгое время мне не хочется искать в происходящем какой-то дополнительный смысл. Ничего больше не нужно придумывать. Ничего не нужно объяснять.</p><p>Я закрываю глаза.</p><p>Вечер продолжает угасать за окном. Последние полосы закатного света постепенно теряют насыщенность, растворяясь в наступающих сумерках. Музыка звучит негромко, почти незаметно, и всё, что ещё недавно казалось таким важным, отступает куда-то на периферию моего сознания. Мне больше не нужно следить за каждым движением, пытаться угадать его намерения или заранее готовиться к тому, что произойдёт дальше.</p><p>Я больше не считаю расстояние между нами. Не измеряю его ладонью, не пытаюсь удержать, не ищу способ сократить ещё сильнее. Он сам оказался рядом. Сам захотел быть здесь.</p><p>И сейчас этого достаточно.</p><p>Он отстраняется ровно настолько, чтобы посмотреть на меня, а затем толкает в плечо — мягко, ладонью, без особого усилия. Я теряю равновесие скорее потому, что сам позволяю себе поддаться этому движению, чем потому, что он действительно пытается меня уложить. Спина касается покрывала. Матрас прогибается подо мной, и прежде чем я успеваю что-нибудь сказать, он оказывается сверху, опираясь коленями по обе стороны от моих бёдер.</p><p>Смотрит на меня сверху вниз.</p><p>Ангел.</p><p>Мысль приходит сама собой, без всякого усилия, будто мне даже не приходится её формулировать. Я давно уже не пытаюсь отделить то, каким вижу его, от того, кем он является на самом деле. Возможно, это несправедливо по отношению к нему. Возможно, я вообще не имею права возлагать на другого человека столько собственных представлений. Но сейчас мне трудно думать об этом.</p><p>Он находится совсем близко, и свет свечей ложится на его лицо иначе, чем прежде: подчёркивает скулы, оставляет тени под глазами, цепляется за отдельные пряди волос. Если смотреть внимательно, в нём нет ничего неземного. Обычный живой человек. Тёплый, настоящий, со своими сомнениями, слабостями и несовершенствами. Но мне достаточно одного взгляда, чтобы снова увидеть то, что я уже однажды увидел на своей картине. Тот самый образ, который существовал задолго до того, как я узнал его имя, услышал голос и смог прикоснуться к нему.</p><p>Ангел.</p><p>И в этом взгляде нет ни капли сомнения. Он не отводит глаза, не пытается угадать, правильно ли поступает, не прячет собственное желание за осторожной улыбкой. Просто смотрит на меня. И я вдруг понимаю, что вот оно — то, чего я так долго хотел и чего одновременно боялся. Быть под ним. Быть тем, на кого смотрят сверху вниз. Не тем, кто преклоняется, не тем, кто выбирает высоту и решает, кому позволено приблизиться. На этот раз я сам оказываюсь внизу.</p><p>В этом есть какая-то непривычная правильность. Не та, которую я пытался вывести из собственных правил и бесконечных рассуждений о контроле. Никакой системы, никакого заранее подготовленного сценария. Просто мы вдвоём, и мне больше не нужно притворяться, будто я знаю, что должен делать дальше.</p><p>Я поднимаю руки, чтобы коснуться его лица, провести пальцами по волосам, убедиться, что он действительно здесь. Но он перехватывает мои запястья и осторожно опускает их на покрывало над моей головой. Не больно. Не резко. Его ладони просто накрывают мои, удерживая на месте, и я смотрю на наши руки, а потом снова на него.</p><p>И впервые за весь вечер мне даже не хочется высвобождаться.</p><p>Он наклоняется, и я снова чувствую его дыхание у шеи. Закрываю глаза. Его губы касаются кожи, задерживаются там, и я невольно поворачиваю голову, позволяя ему продолжить. Когда он касается кожи зубами, я вздрагиваю от неожиданности. Слышу его тихий выдох. Он на мгновение замирает, словно пытается понять, как я отреагировал, и я чуть поворачиваюсь к нему навстречу.</p><p>Никаких слов. Только это короткое движение, которого достаточно, чтобы он понял.</p><p>Я чувствую, как он снова касается того же места губами — теперь осторожнее. И почему-то именно эта небольшая перемена заставляет меня сильнее сжать пальцы. В его движениях есть внимание, которого я не ожидал. Он не просто следует собственному желанию — он замечает меня. Замечает, как я реагирую, когда задерживаю дыхание, когда пытаюсь скрыть улыбку, когда сам едва заметно подаюсь ближе.</p><p>Я открываю глаза.</p><p>Он всё ещё надо мной.</p><p>Ангел. </p><p>И на этот раз в этом слове появляется что-то почти торжественное. Не спаситель. Не безупречное небесное создание, которому неведома человеческая слабость. Просто человек, которому я сейчас позволил увидеть себя снизу вверх. Тот, перед кем мне не нужно изображать собственную непобедимость.</p><p>И, наверное, именно поэтому мне так трудно отвести взгляд.</p><p>Дальше — Sorrow от IAMX. Она такая тягучая, что движения замедляются вместе с ней, словно музыка постепенно забирает у времени способность идти вперёд.</p><p>Он касается каждого миллиметра моего тела, а я лежу под ним, полуголый, в дрожащем свете заката, и позволяю ему смотреть, трогать, рассматривать меня столько, сколько ему захочется.</p><p>Он смотрит. И трогает. Долго.</p><p>Я чувствую этот взгляд кожей, каждой её точкой. Он будто становится ещё одним прикосновением — невидимым, но от этого не менее ощутимым. Мне хочется прикрыться. Отвернуться, натянуть на себя одеяло, спрятать хотя бы часть тела, оставить между нами что-нибудь, за чем можно было бы укрыться.</p><p>Но я не делаю этого.</p><p>Остаюсь лежать перед ним, позволяя ему видеть то, что обычно стараюсь скрыть даже от самого себя.</p><p>Мои руки над головой. Его пальцы на моих запястьях — уже совсем не нежно, крепко, так, что я чувствую костяшки. Его глаза сверху, тёмные. В них нет ни капли сомнения, только голод. Он смотрит на меня так, как смотрят на то, что собираются взять. Я чувствую, как во мне поднимается что-то, чему я не хочу мешать.</p><p>Он входит быстро. Без подготовки, без предупреждения. Это больно. Это правильно. Я выгибаюсь под ним. Слышу собственный выдох, который больше похож на стон. Он держит меня за бёдра, впивается пальцами так, что останутся следы. Пусть останутся. Он движется резко, жадно, без той медлительности, которой я его боготворил. Это другое. Совсем другое. Сейчас я отдал всё, что мог. Контроль. Ритм. Право решать. Он берёт меня так, как хочет, и я принимаю это. В этом принятии есть что-то, чего я не могу назвать. Не унижение. Не покорность. Что-то ближе к облегчению. К тому, чтобы наконец перестать держать.</p><p>Я смотрю на него снизу вверх. Ангел. Мой ангел. Он надо мной. Он внутри меня. Он держит меня за бёдра и вбивается так, что кровать скрипит. Никогда ещё я не был так близко к тому, чтобы исчезнуть. И это не страшно. Это почти желанно. Это и есть то, о чём поёт голос: уйти от себя. Перестать быть тем, кто держит. Тем, кто решает. Тем, кто наблюдает за собой со стороны. Стать тем, кого берут.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Он поворачивается ко мне и кладёт голову на плечо. Я чувствую его дыхание на коже: сначала ещё неровное, сбивчивое, потом постепенно становящееся спокойнее. Несколько прядей щекочут мне шею. Я осторожно поправляю их, стараясь не потревожить его, и задерживаю ладонь у него на затылке.</p><p>Такое простое движение. Почти ничего.</p><p>Но почему-то именно в нём оказывается больше нежности, чем я вообще умею выразить словами. Мне не нужно ничего говорить, ничего обещать или объяснять. Достаточно просто оставить руку на его затылке и чувствовать, что он лежит рядом, доверяя мне эту короткую передышку.</p><p>Закат давно погас, и комната постепенно теряет очертания. Где-то между песнями начинает звучать Red Sex — тягучая, тёмная, красивая. Она заполняет оставшееся пространство, медленно растекается по стенам, простыням, по моей голове. Я слушаю и думаю, что не хочу, чтобы она заканчивалась. Не хочу, чтобы заканчивался этот вечер. Даже тишина после него кажется чем-то нежелательным.</p><p>Я не помню, в какой момент мы засыпаем. Память оставляет мне только отдельные ощущения: тепло его тела, тяжесть руки, случайное прикосновение пальцев, дыхание у самого плеча. Никаких больших откровений. Никаких обещаний. Только он рядом, и мне почему-то достаточно этого.</p><p>Впервые за долгое время мне не нужно ничего решать. Ни где я нахожусь, ни кто я такой, ни что со мной будет завтра. Не нужно искать в себе очередную ошибку, проверять собственные чувства на подлинность, подбирать им правильное название. Не нужно становиться лучше, чище, достойнее. Не нужно даже спрашивать себя, заслужил ли я эту минуту.</p><p>Всё уже решено. Всё уже на своих местах.</p><p>Я засыпаю, не зная, что будет, когда проснусь. Не знаю, каким окажется следующий день, сколько продлится это спокойствие и что от него останется, когда комната снова наполнится дневным светом. Но сейчас эти вопросы кажутся такими далёкими, будто принадлежат кому-то другому.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Утро само вторглось в наше пространство, но, кажется, помешало оно только мне. Первые золотые лучи пробрались сквозь занавески, легли на смятую постель, на пол, на его лицо. Я проснулся от света и ещё несколько секунд просто лежал, пытаясь понять, где нахожусь. Потом почувствовал его рядом.</p><p>Он мирно спал. В тишине комнаты раздавалось тихое, почти неслышное сопение. Он прижимался ко мне так, словно искал во мне защиту. Искал то, чего я не мог ему дать. Я мог бы подарить ему что угодно другое: подарки, цветы, красивые слова, признания — сколько бы он ни захотел. Мог бы заполнить комнату музыкой, расписать стены, придумать для нас целый мир, в котором всё было бы устроено по моим правилам.</p><p>Но защита…</p><p>Защита — совсем другое.</p><p>Я смотрел на него и не знал, что делать с этим доверием. Оно лежало на мне вместе с его головой, его рукой, его тяжестью. Такое простое и такое огромное, что мне становилось почти страшно. Он ведь ничего не просил. Даже сейчас, во сне, ничего от меня не требовал. Просто спал, прижавшись ближе, будто это было самым естественным местом на свете.</p><p>Мне было трудно даже дышать. Я боялся пошевелиться, боялся нарушить этот покой, разбудить его. Сейчас он казался таким хрупким, таким нежным. Без привычного выражения лица, без слов, без той небольшой дистанции, которую человек невольно сохраняет даже с теми, кого подпускает близко. Во сне он ничего не скрывал. И я вдруг понял, насколько сильно мне хочется уберечь именно эту его беззащитность.</p><p>Я чуть крепче обнял его, осторожно, почти невесомо, и провёл ладонью по растрепавшимся мягким волосам. Они спутались после сна, несколько прядей упали ему на лоб. Я убрал их пальцами и задержал руку, перебирая волосы снова и снова.</p><p>Мне хотелось верить, что этого достаточно. Что иногда защита — не обещание никогда не причинить боль и не способность остановить всё плохое, что может случиться. Может быть, это просто возможность проснуться рядом и обнаружить, что тебя всё ещё держат. Что кто-то остаётся. Что тебе не нужно немедленно открывать глаза и возвращаться в мир, где от тебя чего-то ждут.</p><p>Я не знал, умею ли быть таким человеком.</p><p>Но пока он спал у меня на плече, я хотя бы мог попробовать.</p><p>Он просыпается не сразу. Сначала я замечаю, как меняется его дыхание, потом — едва заметное движение пальцев на моей футболке. За окном уже совсем светло. Никакого вчерашнего полумрака, свечей, дрожащих теней на стенах. Только обычное утро, немного пыльное, слишком честное.</p><p>Он приоткрывает глаза и несколько секунд смотрит на меня так, будто пытается вспомнить, где находится. Потом, кажется, вспоминает. Улыбается едва заметно и снова устраивается удобнее, утыкаясь лицом мне в плечо.</p><p>Я опускаю взгляд на его волосы. Они всё ещё растрёпаны, одна прядь снова падает ему на лоб. Мне хочется убрать её, но я не тороплюсь. Вчера я так много думал о том, что значит быть рядом с ним, что значит заслужить его доверие, что значит стать для него кем-то важным. А сейчас он просто лежит рядом. Сонный, тёплый, немного помятый после ночи.</p><p>И почему-то этого оказывается достаточно.</p><p>Вчерашний вечер не исчез вместе с темнотой. Он не стал менее настоящим оттого, что свечи погасли, музыка закончилась, а на смену красному свету пришло обычное утро. Он всё ещё здесь.</p><p>Я осторожно провожу пальцами по его волосам.</p><p>Наверное, с этого и можно начать.</p>"},{"n":4,"title":"CHAPTER IV — GODS & MONSTERS","epi":"Доброго, которого хочу, не делаю, а злое, которого не хочу, делаю.","epiBy":"— К Римлянам 7:19","html":"<p class=\"first\">Где-то за спиной слышится шелест страниц. Он устроился неподалёку с книгой, и я уже давно перестал обращать внимание на то, как он время от времени меняет положение, перелистывает страницы или откладывает телефон на стол. Его присутствие стало частью привычного фона. Не отвлекающим шумом, не чем-то, к чему нужно постоянно прислушиваться, а скорее одним из тех звуков, которые замечаешь только тогда, когда они исчезают.</p><p>— Ты давно над этим работаешь?</p><p>Я оборачиваюсь не сразу. Сначала ещё раз смотрю на холст, словно вопрос застал меня за чем-то настолько важным, что мне необходимо закончить хотя бы одну мысль.</p><p>Вечер постепенно забирает квартиру себе. За окном темнеет, стекло понемногу превращается в чёрное зеркало, отражающее комнату, настольную лампу и беспорядок на моём рабочем столе. Света от неё недостаточно, чтобы осветить всё помещение, но мне этого вполне хватает. Я давно привык работать в полумраке. Иногда даже кажется, что так проще сосредоточиться: окружающий мир теряет чёткость, перестаёт требовать внимания, оставляя меня наедине с тем, что происходит перед глазами.</p><p>На холсте всё ещё слишком много пустого пространства. Я несколько раз возвращался к одному и тому же участку, менял расположение деталей, добавлял новые элементы, а потом закрашивал их, потому что они начинали мешать остальному. В какой-то момент я перестал понимать, пытаюсь ли закончить картину или просто ищу причину не считать её законченной. Разница, впрочем, не такая уж существенная. Иногда процесс оказывается интереснее результата. Особенно если результат предполагает необходимость признать, что ты больше ничего не можешь с ним сделать.</p><p>Я отодвигаю кисть, смотрю на холст, затем снова беру её в руку. Несколько секунд держу над поверхностью, не решаясь коснуться краски.</p><p>— Над этой конкретной картиной или вообще?</p><p>— Над этой.</p><p>— Несколько дней. Хотя идея появилась гораздо раньше.</p><p>Он откладывает книгу и подходит ближе. Я немного отодвигаюсь на стуле, освобождая ему место. Он останавливается рядом, рассматривает изображение, переводя взгляд с одной детали на другую. Я наблюдаю за ним краем глаза, пытаясь угадать, что именно он увидит первым. Это всегда немного странное ощущение — смотреть, как другой человек изучает то, что ты сделал. Ты уже знаешь каждую линию, каждую ошибку, каждое решение, которое успел принять и о котором успел пожалеть. Для тебя изображение давно перестало быть просто изображением. В нём слишком много времени, мыслей и состояний, которые невозможно рассмотреть со стороны.</p><p>— И что это должно быть?</p><p>Я тихо усмехаюсь.</p><p>— Хороший вопрос. Если бы я знал, наверное, уже закончил бы.</p><p>— То есть ты рисуешь, пока сам не поймёшь, что нарисовал?</p><p>— Примерно. Хотя иногда я понимаю это ещё до того, как начинаю. Просто потом оказывается, что первоначальная идея не совсем соответствует тому, что получается в итоге.</p><p>Я поворачиваюсь к холсту и провожу пальцем по краю палитры, разглядывая оставшиеся на ней пятна засохшей краски.</p><p>— Мне вообще нравится, когда у изображения нет единственного значения. Когда человек может посмотреть на него и увидеть что-то своё. Необязательно то, что я туда вкладывал. Даже лучше, если не то.</p><p>— Тогда зачем ты вообще вкладываешь туда какой-то смысл?</p><p>Я задумываюсь. Вопрос кажется простым, но ответ почему-то не приходит сразу.</p><p>— Потому что мне самому он нужен.</p><p>Произношу это почти автоматически. Некоторое время мы оба молчим. Я смотрю на собственные пальцы, испачканные краской, и пытаюсь понять, почему именно этот ответ показался мне настолько очевидным.</p><p>— Наверное, дело не совсем в том, чтобы что-то объяснить, — продолжаю я. — Скорее, в том, чтобы придать этому какую-то форму. Когда у тебя в голове одновременно существует слишком много всего, довольно трудно понять, что с этим делать. А если ты можешь хотя бы увидеть это перед собой, становится немного проще. Не обязательно лучше. Просто понятнее.</p><p>— И тебе становится понятнее?</p><p>— Иногда.</p><p>— А иногда?</p><p>— Иногда я создаю себе ещё одну проблему, которую потом приходится решать.</p><p>Он улыбается. Я тоже, хотя и не уверен, что действительно пошутил.</p><p>— Получается, ты сам себе усложняешь жизнь?</p><p>— Это вообще мой основной талант.</p><p>Он снова смотрит на холст. Я замечаю, что он задерживается на одном участке дольше остальных.</p><p>— А здесь что?</p><p>Я прослеживаю направление его взгляда.</p><p>— Пока не знаю.</p><p>— Совсем?</p><p>— У меня есть несколько вариантов. Но ни один не кажется достаточно убедительным.</p><p>— Может, не обязательно выбирать?</p><p>Я поворачиваюсь к нему.</p><p>— В смысле?</p><p>— Ну, если ты хочешь оставить это так, почему бы просто не оставить?</p><p>Я смотрю на него несколько секунд. Ответ напрашивается сам собой, но я не произношу его сразу. В какой-то степени он прав. Не каждую деталь нужно объяснять, не каждую незавершённость исправлять. Иногда достаточно признать, что она существует. Удивительно, насколько легко подобные вещи звучат, когда их произносит кто-то другой.</p><p>— Ты сейчас предлагаешь мне смириться с неопределённостью?</p><p>— Я предлагаю тебе не мучить картину, если она тебе уже нравится.</p><p>— Звучит подозрительно разумно.</p><p>— Могу попробовать сказать что-нибудь менее разумное, если тебе так привычнее.</p><p>Я смеюсь и наконец откладываю кисть.</p><p>— Не надо. У меня и без того достаточно сомнительных идей.</p><p>Он возвращается к книге, но я ещё некоторое время смотрю на холст. Его слова продолжают крутиться в голове, цепляясь за что-то гораздо большее, чем очередной участок незаконченной работы. Не мучить картину. Не пытаться заставить её стать чем-то определённым только потому, что мне трудно оставить её такой, какая она есть.</p><p>Забавно. Я способен часами рассуждать о свободе интерпретации, о праве на собственное восприятие, о том, что смысл не всегда должен быть единственным и окончательным. Но стоит дело коснуться чего-то, что принадлежит мне, как все эти прекрасные принципы куда-то исчезают. Мне непременно нужно найти правильный ответ. Правильное объяснение. Правильную форму.</p><p>Наверное, я просто не очень хорошо умею оставлять вещи в покое.</p><p>Хотя, если я почти всё время стремлюсь стать богом — или даже кем-то, кто сумел бы его превзойти, — возможно, мне стоило бы хотя бы иногда присматриваться к тому, как он сам распоряжается своим всемогуществом. Взять хотя бы самое начало. Бытие, первая глава, третий и четвёртый стихи. Бог сказал: «Да будет свет», — и появился свет. Он посмотрел на него и увидел, что он хорош. Не стал искать изъяны, не принялся исправлять то, что можно было бы сделать немного ярче, чище или совершеннее. Не стал возвращаться к уже созданному, потому что вдруг придумал, как сделать его лучше. Он просто признал результат хорошим. И пошёл дальше.</p><p>Наверное, именно этого я никогда не умел. Мне всегда казалось, что если у меня есть возможность что-то изменить, значит, я обязан ею воспользоваться. Если можно сделать лучше — значит, нынешнее недостаточно хорошо. Если я вижу недостаток, то уже не имею права его игнорировать. Даже когда речь идёт о чём-то, что ещё минуту назад мне нравилось. Я мог часами возвращаться к одной и той же детали, переделывать её, сомневаться, снова переделывать, пока первоначальная мысль не терялась где-то под слоями моих исправлений. И всё равно находил, к чему придраться.</p><p>Забавно выходит. Я столько времени пытаюсь стать выше Бога, а он, оказывается, в одном отношении куда свободнее меня. Он способен создать что-то, посмотреть на это и сказать: «Хорошо». А я даже собственному творению не могу позволить просто существовать. Мне обязательно нужно доказать, что оно могло бы быть лучше. Будто признать его достаточным — значит расписаться в собственном несовершенстве.</p><p>Может, мне действительно есть чему у него поучиться.</p><p>— Ладно. Я оставлю картину. Хоть раз стоит попробовать. Может, всё не так страшно.</p><p>— Вот и хорошо, — сказал он.</p><p>Он произнёс это так просто, словно речь шла о чём-то совершенно обыденном. Никаких поздравлений, никаких попыток придать моему решению особенное значение. Он не стал говорить, что я молодец, что это правильно или что давно пора было остановиться. Просто вернулся к книге, оставив меня наедине с картиной и непривычным ощущением, будто я только что нарушил какое-то негласное правило.</p><p>Я ещё некоторое время смотрел на холст. Рука по привычке искала кисть, взгляд цеплялся за знакомые участки, и в голове уже появлялись варианты того, что можно было бы исправить. Вот здесь добавить цвета. Там смягчить переход. А эту линию, пожалуй, стоило бы провести иначе. Мысли возникали одна за другой, настойчивые, почти автоматические. Я знал, что могу им поддаться. Более того, часть меня уже хотела это сделать.</p><p>Но я положил кисть.</p><p>Странное чувство — оставить что-то незавершённым не потому, что у тебя закончились силы или время, а потому, что ты сам решил больше ничего не менять. Я не был уверен, что мне нравится результат. Не был уверен даже в том, что завтра не передумаю. Но, наверное, впервые за долгое время мне захотелось проверить, смогу ли я проснуться утром и не броситься исправлять вчерашнее решение.</p><p>— Ты всё ещё думаешь о ней? — спросил он, не отрываясь от книги.</p><p>— О картине?</p><p>— Угу.</p><p>— Нет. То есть да. Наверное. Я не знаю.</p><p>— Звучит убедительно.</p><p>Я усмехнулся. В его голосе не было насмешки, скорее привычная мягкость, с которой он иногда относился к моим попыткам объяснить то, что я сам толком не понимал.</p><p>— Просто непривычно, — сказал я после паузы. — Когда долго работаешь над чем-то, начинаешь воспринимать каждую мелочь как обязательство. Будто если заметил, что можно сделать иначе, то уже не имеешь права оставить всё как есть.</p><p>— Но ты ведь можешь.</p><p>— Могу, — согласился я. — Только почему-то не всегда получается.</p><p>Я снова посмотрел на холст. В полумраке некоторые цвета казались темнее, чем днём, а отдельные детали почти растворялись в общей массе. Картина выглядела иначе, чем несколько минут назад. Или это я наконец перестал смотреть на неё как на перечень собственных ошибок.</p><p>— Знаешь, — произнёс я, — мне иногда кажется, что я вообще не умею заканчивать вещи. Не только картины. Я могу придумать что-нибудь, загореться, потратить на это кучу времени, а потом начать сомневаться. И чем дольше сомневаюсь, тем сложнее остановиться. В какой-то момент уже не понимаю, пытаюсь ли я сделать что-то лучше или просто боюсь признать, что лучше не получится.</p><p>Он отложил книгу и посмотрел на меня.</p><p>— А обязательно должно получиться лучше?</p><p>Я хотел ответить сразу. Даже нашёл подходящую фразу — что-то привычное, уверенное, почти назидательное. Но она почему-то не прозвучала. Наверное, потому, что вопрос был слишком простым, чтобы спрятаться за сложным ответом.</p><p>— Нет, — сказал я наконец. — Наверное, нет.</p><p>И впервые за вечер не стал ничего добавлять.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>— А с собой у тебя так же? — спросил он.</p><p>Я повернулся к нему.</p><p>— В каком смысле?</p><p>— Ты говорил, что не всегда можешь остановиться. Что начинаешь сомневаться, пытаешься что-то исправить, а потом уже не понимаешь, зачем. С собой тоже так?</p><p>Я не сразу ответил. Вопрос оказался неприятно точным. Не потому, что Он задел что-то болезненное намеренно, а потому, что я сам никогда не проводил между этими вещами такой очевидной границы. Картина, работа, собственные мысли — всё это существовало в одной и той же системе, где любое несовпадение с придуманным идеалом требовало немедленного вмешательства.</p><p>— Наверное, даже сильнее, — сказал я. — С картиной хотя бы понятно, что именно мне не нравится. Можно указать на конкретное место, конкретный цвет, линию. А с собой… Иногда я просто чувствую, что что-то не так, и начинаю искать причину. Только причин обычно оказывается слишком много.</p><p>— И находишь?</p><p>— Иногда. Но это не всегда помогает.</p><p>Я замолчал, подбирая слова. Мне хотелось объяснить ему, но сама попытка объяснения уже заставляла меня сомневаться в каждом предложении. Я привык рассказывать о себе так, будто составлял заключение по чужому делу: перечислять факты, искать закономерности, отделять достоверное от предположений. Только обвиняемый и следователь в этот раз были одним человеком, а доказательства постоянно менялись в зависимости от того, в каком состоянии я находился.</p><p>— У меня есть определённые проблемы с психикой, — продолжил я. — Не знаю, как лучше это назвать. Болезнь, расстройство, особенности работы головы. Врачи используют свои слова, ставят диагнозы, пытаются разложить всё по категориям. И я понимаю, зачем это нужно. Иногда название действительно помогает хотя бы немного разобраться в происходящем. Но оно не объясняет меня целиком.</p><p>— Ты не любишь говорить о диагнозах?</p><p>— Не совсем. Скорее, я не люблю, когда они становятся единственным способом говорить обо мне. Будто после того, как узнаёшь название, всё остальное уже не имеет значения. Любая моя реакция превращается в симптом, любое решение — в следствие болезни. И в какой-то момент я сам начинаю смотреть на себя так же.</p><p>Я провёл ладонью по лицу и снова посмотрел на картину. Она всё ещё стояла передо мной, оставленная в том виде, в каком я решил её оставить. Казалось бы, ничего особенного. Несколько часов работы, краска, холст. Но мне вдруг стало любопытно, почему я так легко допускаю несовершенство в собственном творении и так редко — в себе.</p><p>— Самое странное, — продолжил я, — что я не всегда понимаю, где заканчиваюсь я и начинается болезнь. Не в буквальном смысле. Я знаю, что это всё ещё моя жизнь, мои мысли, мои поступки. Но иногда собственное состояние меняется настолько, что я начинаю иначе воспринимать вообще всё. То, что вчера казалось важным, сегодня может вызывать равнодушие. То, что казалось невозможным, вдруг становится единственным, чем хочется заниматься. И каждый раз я пытаюсь решить, какая из этих версий меня настоящая.</p><p>— А какая из них настоящая?</p><p>Я невольно усмехнулся.</p><p>— Вот если бы я знал.</p><p>Он ничего не ответил, и я продолжил, пока не успел передумать.</p><p>— Иногда мне кажется, что я должен выбрать какую-то одну. Найти себя в одном состоянии, определить, каким человеком я являюсь на самом деле, а всё остальное списать на сбой. Но я ведь помню себя разным. И все эти воспоминания принадлежат мне. Даже если мне не нравится человек, которым я был в какой-то момент. Даже если я не понимаю, почему он так думал или чего хотел.</p><p>— Может, тебе не обязательно выбирать?</p><p>Я посмотрел на него. Он не произнёс это как готовое решение. Скорее, действительно пытался понять, почему я вообще поставил перед собой такую задачу.</p><p>— Ты так говоришь, будто это просто.</p><p>— Я не говорил, что просто.</p><p>И мне нечего было на это возразить.</p><p>— Дело даже не в том, чтобы выбрать одну версию себя, — я опустил взгляд на собственные руки. — Я не уверен, что вообще знаю, кто я такой. Иногда мне кажется, что у меня просто нет никакой личности. Не в том смысле, что я ничего не чувствую или ничего не думаю. Наоборот, внутри постоянно что-то происходит. Просто я не могу понять, что из этого действительно моё.</p><p>Я попытался сформулировать мысль точнее, но она распадалась быстрее, чем я успевал подобрать слова.</p><p>— Я не знаю, что мне нравится. То есть могу увлечься чем-то настолько сильно, что на какое-то время это становится чуть ли не смыслом существования, а потом однажды проснуться и обнаружить, что мне совершенно всё равно. Не понимаю, какие чувства испытываю к людям. Иногда мне кажется, что я кого-то люблю, но я не могу отличить любовь от привязанности, потребности, страха остаться одному или желания быть кому-то нужным. Я даже собственные предпочтения постоянно ставлю под сомнение. Будто недостаточно просто чего-то хотеть. Мне обязательно нужно выяснить, почему я этого хочу, что это обо мне говорит и имею ли я вообще право так хотеть.</p><p>— Звучит утомительно.</p><p>— Ещё как. Особенно когда понимаешь, что занимаешься этим практически круглосуточно.</p><p>Я усмехнулся, но улыбка быстро исчезла. Мне было неловко говорить всё это вслух. Не потому, что я боялся, что Он не поймёт. Скорее, я боялся услышать собственные слова со стороны и обнаружить, насколько мало во мне того, что я сам мог бы назвать нормальной человеческой привязанностью к себе.</p><p>— Я не умею себя любить, — сказал я тише. — Даже не знаю, как это должно ощущаться. Иногда я пытаюсь относиться к себе терпимее, убеждаю себя, что не обязан постоянно соответствовать каким-то требованиям, что могу ошибаться, менять мнение, не знать ответов. Но это всё остаётся на уровне рассуждений. Я могу сколько угодно объяснять себе, что не заслуживаю ненависти, и всё равно продолжать себя ненавидеть.</p><p>Он молчал. Я не знал, что он думал, и впервые за весь разговор не особенно хотел угадывать.</p><p>— Мне кажется, я вообще не воспринимаю себя как человека, которому можно просто существовать, — продолжил я. — Мне всё время нужно оправдание. Какая-то причина, по которой моё присутствие здесь допустимо. Я должен быть полезным, интересным, умным, красивым, хорошим — неважно. Главное, чтобы было за что оставить меня в покое. И даже когда я чего-то достигаю, этого хватает ненадолго. Планка просто перемещается. Я сам её перемещаю.</p><p>Я замолчал, чувствуя, как разговор постепенно приближается к тому, о чём мне было труднее всего говорить.</p><p>— С телом ещё хуже. Я не знаю, как объяснить это так, чтобы не прозвучало нелепо, но иногда мне кажется, будто оно мне не принадлежит. Я понимаю, что это моё тело, что я не могу отделить себя от него, но эмоционально воспринимаю его совершенно иначе. Будто мне его выдали без моего согласия. И я должен с ним жить, заботиться о нём, мириться с его потребностями, ограничениями, самим фактом его существования.</p><p>Я провёл большим пальцем по костяшке другой руки.</p><p>— Иногда я думаю о нём как о наказании. Или испытании, которое почему-то выпало именно мне. Не знаю, за что. Может, я сам придумал себе эту связь, но избавиться от ощущения не получается. Я смотрю на себя и не вижу человека, с которым хотел бы быть. Вижу что-то, что постоянно напоминает мне о моей уязвимости, зависимости от других, о том, что я не могу контролировать даже самые простые вещи. Мне трудно принять, что это не отдельная оболочка, которую можно однажды снять, а часть меня.</p><p>— Ты правда так себя видишь? — спросил он.</p><p>— Не всегда одинаково. В этом и проблема. Бывают дни, когда я почти не думаю об этом. А бывают, когда мне сложно даже находиться наедине с собой. И я никогда не знаю, какая из этих версий меня встретит завтра.</p><p>Он немного помолчал.</p><p>— Мне жаль, что тебе приходится так себя воспринимать.</p><p>Я хотел ответить что-нибудь привычное — обесценить сказанное, пошутить, перевести разговор на другую тему. Но вместо этого просто кивнул.</p><p>— Я не очень понимаю, как с этим жить, — признался я. — И, наверное, ещё меньше понимаю, как позволить кому-то другому жить рядом со мной.</p><p>— Ты думаешь, мне нужно сначала разобраться, кто ты такой, чтобы находиться здесь?</p><p>Я поднял на него глаза.</p><p>— Разве это не было бы разумно?</p><p>— Не знаю. Мне кажется, ты пытаешься решить за меня, насколько сложно мне будет находиться рядом с тобой. Причём заранее, даже не спросив, что я об этом думаю.</p><p>— Я просто пытаюсь объяснить, с чем тебе приходится иметь дело.</p><p>— Я понимаю. Но ты говоришь так, будто сам являешься какой-то проблемой, которую мне придётся терпеть.</p><p>Я хотел возразить, но не нашёл подходящих слов. В его формулировке было что-то неприятное. Не потому, что она была несправедливой, а потому, что слишком точно отражала то, как я привык думать о себе. Я действительно воспринимал собственное существование как совокупность обстоятельств, которые кому-то другому рано или поздно придётся принять. Как длинный список условий мелким шрифтом, который никто не читает до конца, пока не становится слишком поздно отказаться.</p><p>— А разве это не так? — спросил я. — У меня ведь не самый простой характер. Я сам не всегда понимаю, что со мной происходит. Сегодня я могу быть совершенно увлечён чем-то, рассказывать тебе об этом часами, строить планы, а через какое-то время даже смотреть в ту сторону не захочу. Могу быть нежным, а потом закрыться от тебя без какой-то очевидной причины. И дело даже не в том, что я хочу так поступать. Я просто не всегда понимаю, откуда берутся эти изменения. Иногда мне кажется, что я живу не собственной жизнью, а пытаюсь всё время догнать человека, которым был ещё вчера.</p><p>— Но ты ведь не обязан каждый день быть одинаковым.</p><p>— Я знаю. Головой знаю. Только это ничего не меняет.</p><p>Мне хотелось, чтобы он понял разницу между знанием и ощущением. Между фразой, которую можно произнести, и убеждением, которое действительно определяет то, как ты живёшь. Я мог сколько угодно рассуждать о человеческой природе, свободе воли, праве на существование и прочей прекрасной хуйне, но стоило всему этому коснуться меня самого, как собственная философия превращалась в набор правил, по которым я неизменно оказывался виноват.</p><p>— Иногда я завидую людям, которые просто знают, что им нравится, — продолжил я. — Не потому, что у них обязательно есть какие-то выдающиеся интересы или невероятно интересная жизнь. Просто они могут сказать: «Я люблю это». И всё. Им не нужно каждый раз проверять, действительно ли им нравится эта музыка, этот цвет, эта книга, этот человек. Они не пытаются выяснить, не скопировали ли чужой вкус, не придумали ли себе увлечение, не перепутали ли интерес с очередной попыткой заполнить пустоту. А я могу настолько увлечься чем-то, что сам начинаю верить, будто наконец нашёл часть себя. И потом всё исчезает. Остаётся только вопрос, существовала ли эта часть вообще.</p><p>Он немного помолчал.</p><p>— А если тебе действительно нравилось это тогда? Почему обязательно должно нравиться сейчас?</p><p>Я задумался. Наверное, потому, что мне хотелось найти что-то постоянное. Не очередное увлечение, не временное состояние, не случайное желание, которое завтра потеряет всякий смысл. Мне хотелось обнаружить внутри себя хотя бы одну вещь, которая не менялась бы вместе со всем остальным. Что-то, на что можно было бы опереться и сказать: вот. Это моё. Это действительно принадлежит мне.</p><p>— Потому что тогда у меня хотя бы было бы доказательство, что я существую не только в данный момент, — ответил я. — Что я не собираюсь заново изобретать себя каждый раз, когда просыпаюсь.</p><p>— А тебе обязательно нужно доказательство?</p><p>Я усмехнулся.</p><p>— Ты задаёшь ужасно неудобные вопросы.</p><p>— Я заметил.</p><p>На какое-то время разговор затих. Я посмотрел на оставленную картину. Теперь она казалась мне почти чужой, хотя ещё недавно я был уверен, что каждая её деталь имеет ко мне непосредственное отношение. Может быть, завтра я действительно захочу всё переделать. Может быть, через неделю даже не вспомню, почему решил оставить её именно такой. Но она всё равно останется моей работой. Даже если моё отношение к ней изменится.</p><p>С людьми, наверное, всё было сложнее. Особенно с собой.</p><p>— Знаешь, что самое неприятное? — произнёс я. — Я могу относиться к другим людям с гораздо большим пониманием, чем к себе. Могу принять, что они меняются, ошибаются, не знают, чего хотят. Могу видеть в них противоречия и всё равно считать их замечательными. А потом возвращаюсь к себе — и почему-то все эти правила перестают действовать. Мне недостаточно просто быть человеком. Мне нужно быть каким-то особенным, правильным, достойным. И одновременно я уверен, что ничего из этого никогда не получится.</p><p>Я на секунду замолчал.</p><p>— Получается довольно идиотская конструкция. С одной стороны, я постоянно пытаюсь поставить себя выше остальных, а с другой — не могу вынести даже собственного присутствия. Будто мне разрешено быть богом, но запрещено быть человеком.</p><p>Он не стал перебивать.</p><p>— И я не знаю, что с этим делать, — добавил я. — Не знаю, как перестать искать в себе что-то неправильное. Не знаю, как перестать воспринимать собственное тело как очередное доказательство того, что я не такой, каким должен быть. И уж точно не знаю, как однажды проснуться и внезапно обнаружить, что мне нравится человек, которым я являюсь.</p><p>Последняя фраза прозвучала почти нелепо. Слишком просто для всего того, что я пытался объяснить. Но, кажется, именно в ней и заключалось то, до чего я никак не мог добраться.</p><p>Я не знал, кем хотел стать. Я даже не был уверен, что хочу оставаться собой. И всё же почему-то продолжал требовать от себя ответа, словно однажды он обязан был появиться.</p><p>— Я не прошу тебя ничего с этим делать, — сказал я. — Просто… мне хотелось, чтобы ты знал. Не только о том, что я рисую, что слушаю, что читаю и о чём могу говорить до четырёх утра. Есть ещё это. И я не очень умею объяснять. Прости…</p><p>— За что?</p><p>Я отвёл взгляд.</p><p>— Не знаю. За всё это. За то, что вывалил на тебя столько всего. Наверное, не самый приятный разговор для вечера.</p><p>— Тебе не нужно извиняться за то, что ты рассказываешь мне о себе.</p><p>— Я не хочу, чтобы ты чувствовал себя обязанным что-то отвечать.</p><p>— А я и не чувствую.</p><p>Я посмотрел на него, пытаясь понять, действительно ли он так думает или просто не хочет усложнять разговор. Мне хотелось поверить ему, но доверие вообще никогда не было моей сильной стороной. Я мог часами анализировать чужие слова, искать в них скрытые значения, замечать малейшие изменения интонации, но стоило человеку сказать что-то хорошее обо мне, как я начинал подозревать, что он просто недостаточно хорошо меня знает.</p><p>— Я не знаю, что ты хочешь от меня услышать, — продолжил он. — И не уверен, что у меня есть какой-то правильный ответ. Но мне не кажется, что ты должен был держать всё это при себе только потому, что не умеешь объяснить.</p><p>— А если я сам не понимаю, что именно пытаюсь объяснить?</p><p>— Тогда, наверное, можно не понимать вместе.</p><p>Я усмехнулся, но на этот раз не нашёл в его словах ничего, над чем хотелось бы пошутить. В них не было обещания разобраться во мне, исправить то, что я считал неправильным, или однажды показать мне человека, которого я якобы не замечал в зеркале. Он просто оставлял место для того, чего я сам пока не мог назвать.</p><p>И, пожалуй, это пугало меня не меньше, чем привычная необходимость всё контролировать.</p><p>— Я боюсь, что однажды ты узнаешь меня получше и пожалеешь, — сказал я.</p><p>Произнести это оказалось неожиданно легко. Возможно, потому, что к этому моменту я уже успел сказать гораздо больше, чем собирался. Некоторые слова, однажды сорвавшись с языка, словно открывали дорогу следующим. И остановить их становилось сложнее, чем продолжить.</p><p>— Ты говоришь так, будто я сейчас знакомлюсь с тобой впервые, — ответил он.</p><p>— В каком-то смысле так и есть.</p><p>— Тогда, может быть, не стоит заранее решать, что именно я должен о тебе подумать?</p><p>Я опустил глаза. Мне не понравилось, насколько разумно это звучало. Я вообще не любил, когда кто-то замечал мои попытки принять решение за другого человека, особенно если эти попытки были замаскированы под заботу.</p><p>— Я просто не хочу однажды оказаться причиной, по которой тебе станет плохо.</p><p>— А ты не думаешь, что я тоже могу сам решать, на что готов?</p><p>Я не ответил.</p><p>Возможно, именно этого мне и было труднее всего принять. Я мог сколько угодно рассуждать о свободе воли, самостоятельности и праве каждого человека распоряжаться собственной жизнью, но рядом с ним почему-то постоянно пытался стать единственным, кто принимает решения. Не потому, что считал его неспособным выбирать. Скорее, потому, что боялся последствий его выбора. Если он однажды решит остаться, мне придётся поверить, что это действительно его решение. А если уйдёт — признать, что я не мог предотвратить этого, как бы тщательно ни пытался всё предусмотреть.</p><p>— Я не умею быть с собой, — произнёс я после долгой паузы. — И иногда мне кажется несправедливым ожидать, что кто-то другой сможет.</p><p>— Я не ожидаю, что ты будешь каким-то определённым образом со мной.</p><p>— А чего ты ожидаешь?</p><p>Он задумался.</p><p>— Наверное, чтобы ты хотя бы иногда позволял мне самому решать, что я чувствую.</p><p>Я посмотрел на него. Впервые за весь вечер мне захотелось возразить не потому, что я не соглашался, а потому, что его слова слишком близко подошли к чему-то, чего я предпочитал не замечать.</p><p>Я всё ещё не знал, кто я такой. Не понимал, почему мои желания меняются, почему одни чувства кажутся настоящими только до тех пор, пока я их испытываю, а другие приходится разбирать на части, чтобы убедиться в их существовании. Я не стал внезапно относиться к себе лучше. Ненависть никуда не исчезла, как не исчезло и ощущение, что собственное тело — чужая территория, на которой мне почему-то приходится жить.</p><p>Но теперь об этом знал ещё один человек.</p><p>И мне предстояло как-то научиться существовать с этой мыслью.</p>"},{"n":5,"title":"CHAPTER V — THE DAY THE WORLD WENT AWAY","epi":"Мы отовсюду притесняемы, но не стеснены; мы в отчаянных обстоятельствах, но не отчаиваемся; мы гонимы, но не оставлены; низлагаемы, но не погибаем.","epiBy":"— 2-е послание к Коринфянам 4:8–9","html":"<p class=\"first\">И всё-таки я думаю о том, что мне досталось слишком много.</p><p>Слишком много любви. Слишком много терпения. Слишком много того, о чём я никогда не умел просить и до сих пор не понимаю, как принимать. Иногда мне кажется, что всё это по ошибке оказалось в моих руках. Будто кто-то перепутал адресата, оставил у моей двери чужую жизнь, а я, вместо того чтобы вернуть её обратно, сделал вид, что так и должно быть.</p><p>Наверное, я просто боюсь однажды обнаружить, что всё это было ошибкой. Что он посмотрит на меня чуть внимательнее, чем обычно, задержит взгляд на чём-нибудь, чего раньше не замечал, и наконец увидит то, что я сам в себе вижу. Не отдельные недостатки, не дурные привычки и не очередной приступ плохого настроения, а всю конструкцию целиком — со всеми её трещинами, пустотами и нелепыми попытками удержаться в человеческом облике. Что однажды ему станет понятно, насколько сильно он ошибся, выбрав меня.</p><p>Я тут же одёргиваю себя. Он ничего подобного не говорил. Не давал повода. Не заставлял меня сомневаться. Он по-прежнему рядом, по-прежнему смотрит на меня так, будто не обнаружил ничего, от чего стоило бы отступить.</p><p>Но мысль уже появилась.</p><p>И, кажется, ей понравилось оставаться.</p><p>Она всё чаще возникает в моей голове. Не приходит — именно возникает, словно всё это время находилась где-то поблизости и только ждала, когда я отвлекусь. Ловит меня в самые уязвимые моменты: в ночной тишине, когда квартира наконец затихает и даже музыка перестаёт справляться со своей единственной задачей — не оставлять меня наедине с собственными рассуждениями; в предрассветных лучах, которые просачиваются сквозь шторы и медленно ползут по комнате, пока он ещё спит рядом со мной; в пустоте после его ухода, когда вещи сохраняют привычное расположение, на подушке остаётся едва уловимый запах, а сама квартира почему-то кажется больше, чем была минуту назад.</p><p>В такие часы пространство начинает вести себя странно. Обычные предметы выглядят так, будто их оставили здесь после чьего-то исчезновения. Чашка на столе, смятая одежда, раскрытая книга — всё на своих местах, но в этом порядке есть что-то неприятное, почти подозрительное. Я знаю, что он просто вышел по делам и скоро вернётся. Знаю, что ничего не случилось. И всё равно иногда ловлю себя на ощущении, будто квартира уже начала привыкать к его отсутствию раньше меня.</p><p>Порой достаточно какой-нибудь мелочи. Его сонного голоса, случайного прикосновения, короткого сообщения посреди дня. Он может сказать что-то совершенно обыкновенное, улыбнуться мне через плечо, спросить, не нужно ли купить что-нибудь по дороге домой, — и я уже думаю о том, насколько сильно он заслуживает лучшей жизни. Не обязательно другой. Даже не обязательно более счастливой. Просто такой, в которой ему не придётся иметь дело со мной.</p><p>Я могу заниматься работой, отвечать на сообщения, разговаривать с ним, смеяться над какой-нибудь глупостью. Могу даже на несколько минут забыть о том, что происходит у меня в голове. Но мысль никуда не уходит. Она остаётся под всем этим, как неприятный шум в стенах, который невозможно найти, сколько бы раз ни проверял проводку. Иногда я почти перестаю его замечать, а потом он снова становится единственным, что слышно.</p><p>Что, если он однажды поймёт? Что, если однажды увидит меня не таким, каким привык видеть сейчас, а таким, каким я сам себя знаю? Без попыток понравиться, без удачных шуток, без разговоров о живописи, музыке и всём остальном, что я могу показать или спрятать по собственному желанию. Что останется, если убрать всё, что я научился использовать вместо себя? И захочет ли он тогда оставаться рядом?</p><p>Наверное, я всё же не особо его заслуживаю.</p><p>Его чистоты, его доверия, его любви. Иногда мне кажется почти кощунственным само то, что он отдаёт мне столько нежности, ничего не требуя взамен. В этом есть что-то неправильное, почти неприличное. Я смотрю на него и думаю, что он мог бы быть с кем-то другим. С человеком, который не заставлял бы его беспокоиться, который не приносил бы с собой столько противоречий и внутреннего шума. С кем-то, рядом с кем не нужно было бы постоянно угадывать, что происходит, ждать, успокаивать, терпеть. С кем-то, чьё присутствие не превращало бы обычную жизнь в бесконечную работу по разбору завалов.</p><p>Он мог бы просто жить.</p><p>Без необходимости оглядываться на моё настроение, подбирать слова, замечать перемены в голосе и гадать, что из сказанного сегодня останется правдой завтра. Без человека, который способен превратить даже самую простую нежность в очередное доказательство собственной неполноценности.</p><p>Я знаю, что он не обязан быть счастливым каждую минуту. Знаю, что отношения не должны состоять из одного только спокойствия, а любовь не предполагает отсутствия трудностей. Но почему-то, когда речь заходит обо мне, все эти разумные оговорки перестают работать. Я будто выношу собственное присутствие за скобки человеческих отношений и рассматриваю его как отдельную проблему, которую необходимо решить до того, как кому-нибудь станет слишком поздно.</p><p>И чем дольше я об этом думаю, тем убедительнее становится одна простая мысль: возможно, самое доброе, что я могу для него сделать, — не заставлять его однажды пожалеть о том, что он меня выбрал.</p><p>Наверное, именно поэтому я всё чаще думаю о том, что мог бы стать лучше. Не для кого-то другого, не ради абстрактного исправления себя, а ради него. Стать человеком, рядом с которым ему будет легче. Научиться не превращать каждую собственную тревогу в катастрофу, не искать скрытый смысл в каждом слове, не позволять своим внутренним противоречиям занимать всё пространство между нами. Перестать быть таким… собой.</p><p>Но где заканчивается желание измениться и начинается попытка уничтожить в себе всё, что кажется недостойным его любви? Я не знаю. Иногда мне хочется просто взять и разобрать себя на составляющие, найти причину каждой дурной мысли, каждого поступка, каждой особенности, которая, как мне кажется, делает меня неподходящим для него. Исправить. Заменить. Выбросить то, что не подлежит исправлению.</p><p>А если не получится?</p><p>Тогда остаётся другой вариант. Отпустить его. Не стараться удерживать около себя того, кому, как мне кажется, я могу причинить боль. Не делать его ответственным за то, что я сам не способен принять. Не ждать, пока он устанет, пока ему станет тесно в этой квартире, в этих отношениях, во мне.</p><p>Просто отпустить.</p><p>Звучит почти благородно, если не задумываться о том, что за этими словами скрывается. Я пытаюсь представить, каково это — проснуться однажды и больше не искать его рядом, не ждать возвращения, не прислушиваться к знакомым шагам. Представляю, как его вещи постепенно исчезают из квартиры, как на полках снова освобождается место, как привычные мелочи перестают иметь значение. И каждый раз останавливаюсь на середине этой картины.</p><p>Я не хочу этого.</p><p>Не хочу, чтобы он уходил. Не хочу, чтобы его кружка исчезла с кухни, чтобы книги перестали лежать рядом с моими, чтобы в квартире снова стало слишком много места для одного человека. Не хочу возвращаться к прежней тишине, в которой не было ничего, кроме меня самого.</p><p>Но разве желание оставить его рядом даёт мне право удерживать?</p><p>Я снова возвращаюсь к этим мыслям. К тонким ниткам, за которые так отчаянно цепляюсь, боясь, что любое неосторожное движение оборвёт их. И всё никак не могу решить, что будет правильнее: продолжать держаться, надеясь однажды стать достойным того, что мне дали, или самому разжать пальцы, пока он ещё не успел пострадать от моей неспособности быть для него хорошим. </p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Я долго не решаюсь заговорить.</p><p>Вроде бы ничего особенного не происходит. Обычный вечер, приглушённый свет, музыка играет где-то на фоне. Он сидит рядом со мной, занимается своими делами, иногда что-то показывает на экране телефона. Я даже отвечаю, задаю вопросы, усмехаюсь в нужных местах. Со стороны всё выглядит как обычно. Наверное, именно поэтому мне так сложно начать.</p><p>Я знаю, что стоит произнести первую фразу — и привычный вечер закончится. Не обязательно случится что-то страшное, никто не станет кричать или хлопать дверью. Но после этого разговора уже нельзя будет притворяться, что ничего не изменилось. Я слишком долго прокручивал его в голове, подбирал слова, отбрасывал их, снова возвращался к началу. И всё равно не нашёл ни одного способа сделать это так, чтобы не причинить ему боль.</p><p>— Нам нужно поговорить.</p><p>Он поднимает на меня глаза. Не сразу отвечает, только откладывает телефон и немного поворачивается в мою сторону.</p><p>— Хорошо. Что случилось?</p><p>Я отвожу взгляд. На столе лежит какая-то бумажка, которую я собирался выбросить ещё несколько дней назад. Разглядываю её, будто там можно найти подходящий ответ.</p><p>— Я в последнее время много думаю о нас.</p><p>— Я заметил.</p><p>В его голосе нет упрёка, но от этого становится только хуже. Он не перебивает, не торопит меня, оставляет возможность продолжить. А я всё никак не могу заставить себя произнести то, ради чего начал этот разговор.</p><p>— Дело не в тебе, — наконец говорю я. — Ты ничего не сделал. Правда. Я не хочу, чтобы ты подумал, будто между нами что-то произошло или ты каким-то образом меня разочаровал. Это вообще не про тебя.</p><p>— Тогда про что?</p><p>Я провожу ладонью по лицу. Как объяснить человеку, что проблема в том, что он слишком хорошо к тебе относится? Что его любовь не успокаивает, а заставляет всё настойчивее искать в себе причины, по которым ты её не заслуживаешь?</p><p>— Про меня. Про то, что я не могу разобраться с собственной головой. Я всё время думаю, что недостаточно хороший для тебя. И чем дольше мы вместе, тем сильнее это ощущение. Ты даёшь мне столько всего, а я даже не уверен, что способен дать тебе что-то равноценное. Не хочу, чтобы однажды ты оказался в отношениях, в которых тебе приходится постоянно учитывать мои проблемы, подстраиваться под меня или переживать из-за того, что я опять что-то себе придумал.</p><p>— Ты говоришь так, будто я несчастлив с тобой.</p><p>— Я не это имею в виду.</p><p>— Тогда что именно? — Он ненадолго замолкает, подбирая слова. — Я не понимаю, почему ты решил, что мне плохо. Я ведь не говорил тебе ничего подобного. Если меня что-то не устраивает, я могу об этом сказать. Если мне нужна помощь, я могу попросить. Но ты почему-то уже решил за меня, что я должен чувствовать.</p><p>Я знаю, что он прав. И ненавижу, что он прав именно сейчас.</p><p>— Я просто не хочу однажды стать причиной твоей боли.</p><p>— Но ты уже делаешь мне больно, когда говоришь обо мне так, будто я не способен сам понять, чего хочу.</p><p>Я поднимаю глаза. Он смотрит прямо на меня. Без злости, но и без привычной мягкости, которая обычно помогает мне пережить собственные неудачные попытки объясниться.</p><p>— Я не считаю тебя обузой, — продолжает он. — И не думаю, что мне нужен кто-то другой, чтобы быть счастливым. Ты постоянно говоришь о том, чего я заслуживаю, но почему-то ни разу не спросил, чего хочу я. Я хочу быть с тобой. Не с какой-то твоей улучшенной версией, не с человеком, которого ты собираешься из себя сделать. С тобой.</p><p>От этих слов внутри становится почти невыносимо. Я ведь именно этого и хотел услышать. Наверное, ждал подобного ответа всё время, пока убеждал себя, что однажды он разочаруется. Но теперь, когда он говорит это вслух, мне не становится легче. Я не умею принять его слова как достаточное основание. Не умею просто поверить, что он действительно может выбирать меня, зная обо мне всё, что знает.</p><p>— Я люблю тебя, — говорю я тише. — Очень. И именно поэтому не могу перестать об этом думать.</p><p>— Тогда почему ты говоришь о том, чтобы отдалиться?</p><p>Я опускаю голову. Несколько секунд пытаюсь собрать мысли, но они снова рассыпаются на отдельные фрагменты. Мне хочется сказать, что я запутался. Что боюсь. Что не знаю, как перестать видеть в себе угрозу для человека, которого считаю самым дорогим. Но всё это звучит недостаточно убедительно даже для меня самого.</p><p>— Мне нужна пауза.</p><p>Он не отвечает сразу.</p><p>— Пауза?</p><p>— Да. Мне нужно побыть одному. Разобраться с собой, понять, что со мной происходит. Я не хочу продолжать делать вид, будто всё нормально, когда у меня в голове постоянно крутится одно и то же. Я пытаюсь справиться, но не получается. И я не хочу, чтобы ты всё это время находился внутри моих сомнений.</p><p>— Ты хочешь расстаться?</p><p>Вопрос звучит просто. Без обвинения, без попытки подловить меня на слове. И от этого я впервые за весь разговор чувствую, насколько сильно боюсь собственного ответа.</p><p>— Нет.</p><p>Я произношу это почти сразу. Даже не успеваю подумать.</p><p>— Нет, я не хочу расставаться. Я не хочу тебя терять. Я хочу быть с тобой, хочу просыпаться рядом, хочу возвращаться домой и знать, что ты здесь. Ничего из этого не изменилось. Просто я не могу продолжать, пока не разберусь с тем, что происходит у меня внутри.</p><p>Он смотрит на меня, и я не могу понять, что именно сейчас вижу в его лице. Наверное, ему тоже нужно время, чтобы осмыслить услышанное.</p><p>— Но ты понимаешь, что для меня это всё равно будет похоже на расставание? — спрашивает он. — Ты хочешь, чтобы мы перестали жить так, как живём сейчас. Чтобы я больше не мог просто прийти к тебе, лечь рядом, обнять тебя, когда захочу. Я не знаю, как ещё это назвать.</p><p>— Я понимаю.</p><p>— И ты действительно считаешь, что так будет лучше?</p><p>Я молчу. Потому что не знаю. Потому что если бы речь шла только о том, чего я хочу, никакой паузы не было бы. Я бы попросил его остаться, придвинулся ближе и попытался забыть обо всём хотя бы на один вечер. Но я слишком долго убеждал себя, что моё желание не может быть единственным критерием правильного решения.</p><p>— Я считаю, что мне нужно это сделать, — отвечаю наконец.</p><p>— Это не одно и то же.</p><p>— Знаю.</p><p>Он отводит взгляд. На какое-то время между нами повисает тишина. Музыка продолжает играть, совершенно неуместная в этом разговоре. Я думаю о том, что ещё недавно мы могли провести целый вечер вот так, рядом, не испытывая необходимости что-либо объяснять. Теперь каждое слово приходится вытаскивать из себя отдельно.</p><p>— Я не хочу, чтобы ты решал за меня, чего я достоин, — произносит он. — Ты можешь считать себя недостаточно хорошим, можешь злиться на себя, можешь думать обо мне что угодно. Но ты не можешь просто назначить себя человеком, который обязательно причинит мне боль, и на этом основании решить, что мне будет лучше без тебя. Я сам способен понять, хочу ли быть рядом. И я уже понял.</p><p>Мне хочется возразить. Сказать, что он не видит всей картины, что однажды поймёт, что я пытался его предупредить. Но это было бы нечестно. Он не обязан доказывать мне, что его любовь настоящая. Не обязан бесконечно убеждать меня в том, что я имею право её принимать.</p><p>— Я не прошу тебя перестать меня любить, — говорю я. — И не хочу, чтобы ты думал, будто я просто устал от наших отношений. Мне нужно время. Пожалуйста.</p><p>Он долго смотрит на меня. Потом спрашивает:</p><p>— А если ты не сможешь разобраться? Если через какое-то время всё останется так же?</p><p>Я не нахожу ответа. Мне хочется пообещать, что всё обязательно изменится, что я вернусь другим человеком, что больше никогда не заставлю его проходить через подобное. Но я не могу дать ему обещание, в котором сам не уверен.</p><p>— Тогда хотя бы буду знать, что пытался.</p><p>Он едва заметно кивает. Не потому, что согласен со мной, скорее потому, что понимает: сейчас я уже не услышу ничего, что могло бы заставить меня передумать.</p><p>— Хорошо, — говорит он после долгой паузы. — Если тебе действительно нужно побыть одному, я не стану удерживать тебя. Но я хочу, чтобы ты понимал одну вещь: я ухожу не потому, что перестал тебя любить. И не считаю, что ты должен сначала стать кем-то другим, чтобы иметь право быть со мной.</p><p>Я киваю, хотя горло неприятно сжимается.</p><p>— Я знаю.</p><p>Но, наверное, не знаю. Не до конца. Не так, как должен был бы.</p><p>В тот вечер мы ещё какое-то время сидим рядом. Ничего не решаем окончательно, не обсуждаем будущие отношения с другими людьми и не пытаемся придумать правила для того, что даже не хочется называть расставанием. Между нами остаётся слишком много недосказанного.</p><p>Я смотрю на него и думаю, что сам попросил об этом. Сам произнёс слова, которые так долго боялся произнести. И всё равно не могу понять, как теперь жить с тем, что человек, которого я люблю, больше не будет рядом со мной так, как раньше.</p><p>Я хотел защитить его.</p><p>Почему тогда это так похоже на потерю?</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Долго смотрю на пустую страницу, перебирая в голове всё, что накопилось за последние месяцы. Мысли не складываются во что-то цельное. Они наслаиваются друг на друга, возвращаются к одним и тем же событиям, цепляются за случайные слова и жесты, пока первоначальная причина окончательно не теряется среди последствий. Мне нужно с чем-то работать. Нужна последовательность, правила, какая-то понятная структура, которая не позволит всему этому бесконечно ходить по кругу.</p><p>Я начинаю записывать.</p><p>ТИС.</p><p>Три буквы появляются на экране почти случайно. Я пока не знаю, как именно будет выглядеть весь список, сколько в нём окажется пунктов и к чему в конечном итоге приведёт эта затея. Но мне нравится сама идея. Превратить собственную вину во что-то определённое. Разделить её на части, дать каждой название, установить порядок. Если у происходящего есть структура, значит, у него должны быть и причины. А если есть причины, возможно, найдётся и способ с ними разобраться.</p><p>Мотив. Преступление. Вина. Наказание.</p><p>Я записываю эти слова одно за другим, а затем возвращаюсь к началу.</p><p>Если я действительно хочу стать лучше, придётся наконец перестать ограничиваться обещаниями. Придётся разобраться с тем, что я сделал неправильно, перестать искать оправдания и признать последствия. Я слишком долго пытался понять, почему чувствую себя виноватым, не задаваясь вопросом, что именно должен с этой виной сделать. Возможно, теперь у меня получится хотя бы это. Возможно, тогда я пойму, почему мне досталось столько хорошего, если я сам не способен сохранить это.</p><p>Я смотрю на пустое пространство под заголовком.</p><p>Кажется, у меня появилась работа.</p><p>Суть ТИС проста — тело, недостойное божественности, погрязшее во грехе, больше не имеет права считаться храмом. По крайней мере, до тех пор, пока не будет достигнуто определённое количество прихожан. Их число должно зависеть от степени грехопадения: чем тяжелее проступок, тем больше требуется тех, кто сможет засвидетельствовать искупление.</p><p>В этой системе тело перестаёт быть местом обитания души. Оно становится обвиняемым. Храмом, осквернённым собственным существованием, который должен пройти через суд и искупление, прежде чем снова получит право называться священным.</p><p>Всё должно иметь меру. Грех — свою тяжесть, вина — своё основание, наказание — своё соответствие. Никаких случайностей, никаких поблажек, никаких решений, принятых под влиянием минутной слабости. Если божество разгневано, значит, для гнева есть причина. Если есть причина, должно существовать и возмездие.</p><p>Я не хочу больше оставлять всё на волю чувств. Они слишком ненадёжны. Сегодня мне кажется, что я заслуживаю прощения, завтра — что само это желание уже является очередным преступлением. Я устал зависеть от того, какая версия меня проснётся утром и какую правду она решит считать единственно верной.</p><p>Поэтому теперь будет порядок.</p><p>Я сам его установлю.</p><p class=\"subtitle\">Пункт I. Наказание</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"6\" aria-label=\"Включить Rammstein — Deutschland\">Включить Rammstein — Deutschland</button></div><p>Я отказываюсь от собственной воли и передаю право распоряжаться собой внешней власти.</p><p>Участник — человек в военной форме нацистской Германии. Он представляет земную власть, построенную на иерархии, дисциплине и безусловном подчинении. В системе ТИС ему отведена роль судьи и обвинителя. Не спасителя, не посредника между мной и Богом, не того, кто способен даровать отпущение грехов. Его полномочия ограничены земным судом, но именно эту власть я добровольно признаю над собой.</p><p>Мне больше не нужно быть собственным судьёй. Не нужно самостоятельно определять степень своей вины, пересматривать приговор, искать смягчающие обстоятельства или придумывать оправдания. Человек не может одновременно находиться на скамье обвиняемых и решать, заслуживает ли он прощения. Особенно если этот человек давно перестал доверять самому себе.</p><p>Я хочу избавиться от необходимости выбирать. От бесконечного внутреннего разбирательства, в котором каждый новый довод отменяет предыдущий, а любое решение спустя несколько часов кажется ошибочным. Внешняя власть избавляет меня от этой неопределённости. Она не обязана понимать меня, сочувствовать или соглашаться. Ей достаточно вынести решение. А мне останется только признать его.</p><p>В религиозном смысле этот пункт становится актом отречения. Я отказываюсь от права распоряжаться собственным телом как храмом, который, согласно моим убеждениям, уже оказался осквернён грехом. Передаю земному судье то, что не вправе присваивать себе ни один человек, — право судить другого. Впрочем, в моём случае это даже не совсем другой человек. Я добровольно превращаю себя в объект чужого разбирательства, словно собственное мнение обо мне больше не имеет никакого значения.</p><p>В этом и заключается главное противоречие пункта: признавая высшую власть Бога, я создаю её человеческое подобие. Я понимаю, что это не божественная воля и не священный порядок. Это моя конструкция, попытка придать вине форму закона, а собственному отвращению к себе — видимость справедливого приговора.</p><p>Напоминание о том, что происходит, когда человеческая власть объявляет себя абсолютной. Историческая память о нацистском режиме не позволяет мне воспринимать этот образ как невинную символику порядка, дисциплины или военной строгости. За ним стоят преступления, массовое насилие и уничтожение людей, которым невозможно найти оправдание. Я не могу не знать, что именно выбираю в качестве символа земного суда.</p><p>И, возможно, это тоже часть моего замысла. Мне недостаточно власти, которая просто устанавливает правила. Я выбираю образ власти, не признающей права на возражение, и добровольно ставлю себя перед ней. Не потому, что считаю её справедливой. А потому, что больше не хочу оставлять справедливость на собственное усмотрение.</p><p>Он заставляет меня встать на колени. Смотрит сверху вниз. Как на унтерменш. Как на грязь.</p><p>Жалкий. Я ужасно жалкий.</p><p>Он сжимает мои щёки. Пальцы впиваются в кожу, вдавливают её внутрь, к зубам. Рот открывается сам, нехотя, с влажным звуком. Я чувствую, как его слюна попадает на мой язык. Тёплая, густая, чужая. Она растекается по языку, по нёбу, стекает к горлу. Я не сглатываю. Не могу. Он держит. Она остаётся во рту, и я чувствую её вкус — солоноватый, тяжёлый, как вкус унижения, которое уже не нужно объяснять.</p><p>Он бьёт меня по щеке. Ладонь плоская, тяжёлая, звук сухой и короткий. Голова дёргается в сторону. Щека горит, кожа на ней натягивается и пульсирует. Он заставляет, в соответствии с писанием, подставить вторую. И я подчиняюсь. Поворачиваю голову. Подставляю. Второй удар — сильнее. В ушах звенит. Во рту появляется привкус металла, тонкий, как нитка. Я подставляю вторую — потому что так написано, потому что так правильно, потому что тело, которое не имеет права считаться храмом, обязано принять всё, что ему положено.</p><p>Он не говорит ни слова. Только смотрит. В этом взгляде больше приговора, чем в любом суде.</p><p>Он входит в меня жёстко, без подготовки, без предупреждения. Так, как входят в вещь, а не в человека. Я давлюсь собственным стоном. Звук выходит некрасивым, сдавленным, мокрым. Я слышу его со стороны и почти не узнаю. Тело сжимается, сопротивляется, пытается вытолкнуть, но он не даёт. Он входит до конца. Я чувствую, как внутри всё растягивается, как ткань тела подаётся, как боль становится плотной, осязаемой, почти твёрдой.</p><p>Он в форме немецкого генерала. Чёрная кожа слабо блестит под красным светом. Этот блеск — единственное, что я могу видеть. Лица нет. Оно и не нужно. Власть не должна иметь лицо. У неё есть кое-что важнее: форма, погоны, тяжёлые сапоги и право.</p><p>Он сжимает мои волосы в плотный хват. Резко, до боли в корнях. Тянет назад, заставляя запрокинуть голову. Шея натягивается. Горло открывается. Я чувствую, как воздух входит в меня вместе с унижением. Я не могу опустить голову. Не могу отвернуться. Не могу даже закрыться. Слюна, которую я так и не сглотнул, стекает по подбородку, тянется ниткой, капает на грудь.</p><p>Mein Herz in Flammen.</p><p>Толчок. Ещё. Ещё. Он не спрашивает, удобно ли мне. Не проверяет. Не ждёт, пока я привыкну. Он просто берёт. Каждый толчок отдаётся во мне тупой, тяжёлой болью. Она не проходит. Складывается. Накапливается. Становится чем-то, чему я не могу сопротивляться. Я слышу звук — влажный, ритмичный, чужой. Слышу, как кожа шлёпает по коже. Слышу, как кровать скрипит под нами.</p><p>Тело недостойно храма. Тело получает то, что заслужило.</p><p>Меня возбуждает форма. Возбуждает его грубость. Возбуждает моё подчинение. Я не должен этого хотеть. И хочу. Это хуже всего. Хотеть наказания значит признать, что оно заслужено. Я чувствую, как во мне поднимается жар, как он собирается внизу живота, тяжёлый, стыдный, и от этого становится ещё хуже, ещё грязнее.</p><p>Он наклоняется. Я слышу дыхание у самого уха. Тяжёлое, ровное, без эмоций. Его вторая рука ложится мне на затылок, вдавливая лицо в подушку. Я задыхаюсь. Ткань пахнет пылью и чужим домом. Она мокрая от слюны и слёз, и этот запах смешивается с запахом кожи, пота и пыли. Я не могу вдохнуть полной грудью. От этого всё становится острее. Боль, толчки, хват, красный свет сквозь закрытые веки.</p><p>Суд. Обвинение. Приговор.</p><p>Ещё толчок. Ещё. Ритм сбивается, становится злым. Я чувствую, как во мне поднимается что-то, чему я не должен позволить подняться. Тело предаёт. Оно отвечает. Оно хочет.</p><p>Meine Liebe.</p><p>Хват на волосах становится жёстче. Он тянет сильнее. Я выгибаюсь. Голова запрокидывается так, что я вижу красный свет. Весь, целиком. Он заливает комнату. В этом свете нет ничего, кроме формы, боли и моего тела, которое наконец получает то, чего стоило.</p><p>Я почти…</p><p class=\"subtitle\">Пункт II. Идолопоклонничество</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"7\" aria-label=\"Включить Marie Madeleine — Swimming Pool\">Включить Marie Madeleine — Swimming Pool</button></div><p>Сопровождающий трек: Marie Madeleine — Swimming Pool.</p><p>Я признаю за собой грех идолопоклонничества. Возведение человеческого образа в ранг святыни, поклонение красоте и добровольное отречение от собственной воли перед тем, кого я считаю совершенным.</p><p>Человек не может занимать место Бога. Никакая красота, никакое совершенство тела и никакое чувство не дают другому человеку права становиться предметом безусловного поклонения. И всё же я неоднократно пытался найти божественное в человеческом облике. Я смотрел на людей не как на равных мне существ, а как на идолов, перед которыми следовало склоняться.</p><p>Она была почти идеальной.</p><p>Её аккуратные длинные ноги манили меня — так, как манит то, чему хочется подчиняться. Я смотрел на них и думал, что мог бы опуститься. Не перед ней — перед ними. Перед этой линией от бедра до щиколотки, перед этой гладкостью, перед этой правильностью, которая не требовала от меня ничего, кроме взгляда. Мне казалось, я мог подчиняться им. Я припадал к ним, как припадают к иконам в самые трудные моменты жизни, — губами, лбом, всей тяжестью своего недостойного тела, — и ждал, что что-то произойдёт. Что меня отпустит. Что я получу то, за чем пришёл.</p><p>Она была моей первой девушкой. Она была прекрасна. От неё пахло чем-то невесомым, слишком правильной чистотой — так пахнет
