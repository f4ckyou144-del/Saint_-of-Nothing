маю, насколько всё выглядит со стороны, что я не собираюсь делать из него человека, который должен постоянно меня вытаскивать. Однако все эти объяснения упирались в одну неприятную вещь: сейчас я действительно не мог справляться самостоятельно. И никакое количество слов не делало это менее правдивым.</p><p>— Я просто не знаю, как теперь... — начал я и снова остановился.</p><p>Он ждал продолжения, но не торопил.</p><p>— Не знаю, как теперь всё должно быть.</p><p>Я ожидал, что он скажет что-нибудь ободряющее. Что-нибудь про то, что со временем всё наладится, что я постепенно вернусь к обычной жизни. Но он не стал обещать того, чего не мог знать.</p><p>— Думаю, сейчас не обязательно знать, — ответил он. — Можно хотя бы сегодня не пытаться решить всё сразу.</p><p>Я отвернулся к окну.</p><p>Сегодня.</p><p>Почему-то это слово показалось мне почти неприлично маленьким. Я привык искать причины, выстраивать последовательности, пытаться понять, что произошло и к чему всё должно привести. А он предлагал мне ограничиться одним днём. Не искать окончательный ответ, не составлять план, не пытаться предсказать, каким человеком я стану после всего этого.</p><p>Просто пережить сегодня.</p><p>Я не был уверен, что умею так жить.</p><p>Но спорить не стал.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Некоторое время мы ещё молчали. Я чувствовал себя немного спокойнее, но это спокойствие было непрочным. Стоило мне отвлечься от присутствия ангела, как мысли снова начинали возвращаться к тому, что произошло. Я не мог просто перестать думать об этом по собственному желанию.</p><p>— Ты помнишь всё? — спросил он.</p><p>Я не сразу понял, что именно он имеет в виду.</p><p>— Что?</p><p>— То, что с тобой произошло. Ты помнишь всё, что было там?</p><p>Я посмотрел на него. Вопрос оказался гораздо сложнее, чем мог показаться. Я попытался мысленно восстановить последовательность событий, но вместо неё снова получил набор разрозненных фрагментов.</p><p>— Не знаю, — ответил я. — Что-то помню. Что-то нет.</p><p>— Можешь рассказать?</p><p>Я хотел сказать, что могу. Что ничего страшного, что это просто вопрос времени, что мне нужно немного собраться. Но в голове уже начали всплывать отдельные образы, и я почувствовал, как напряглись плечи.</p><p>— Я не очень понимаю, с чего начать. Там всё... — Я замолчал, пытаясь найти подходящее слово. — Не так, как я помню.</p><p>Он нахмурился.</p><p>— В смысле?</p><p>— Я помню отдельные вещи. Но не могу нормально соединить их. Иногда мне кажется, что прошло несколько часов, а потом я вспоминаю что-то, из-за чего понимаю, что это было гораздо позже. Или раньше. Я не знаю. У меня нет нормальной последовательности.</p><p>Я провёл ладонью по лицу и тут же поморщился, задев болезненное место.</p><p>— И ещё я не уверен, что помню всё правильно. Некоторые вещи будто провалились. Я пытаюсь восстановить их, но чем больше думаю, тем меньше понимаю, что действительно помню, а что просто додумываю.</p><p>Он слушал внимательно. Не перебивал, не пытался закончить за меня предложения.</p><p>— Ты хочешь об этом говорить сейчас?</p><p>Я задумался.</p><p>Хотел ли я? Не особенно. Но одновременно мне казалось, что если я не расскажу ему, то всё произошедшее останется внутри в том виде, в котором существовало до сих пор. Без названия, без последовательности, без возможности хотя бы однажды посмотреть на это со стороны.</p><p>— Не знаю. Наверное, должен.</p><p>— Кому должен?</p><p>Я поднял на него глаза.</p><p>Вопрос застал меня врасплох. Я уже приготовился объяснять, что ему необходимо знать, что я не хочу ничего скрывать, что он имеет право понимать, с чем теперь имеет дело. Но не мог найти ответа на более простую часть его вопроса.</p><p>Кому я должен?</p><p>Ему? Себе? Кому-то ещё?</p><p>— Не знаю, — повторил я.</p><p>Он немного помолчал.</p><p>— Тогда не надо заставлять себя.</p><p>Я отвернулся. Мне было трудно принимать эту мысль. Не потому, что я не хотел рассказывать, а потому, что всё ещё воспринимал молчание как очередную форму избегания. Если я не произнесу произошедшее вслух, оно останется чем-то незавершённым. А незавершённые вещи я переносил особенно плохо.</p><p>— Я не хочу, чтобы ты думал, будто я что-то скрываю.</p><p>— Я так не думаю.</p><p>— Просто... я сам не понимаю, что именно произошло. И мне кажется, что если я начну рассказывать, то буду выглядеть так, будто придумываю.</p><p>Он посмотрел на меня чуть внимательнее.</p><p>— Я не думаю, что ты придумываешь.</p><p>Я кивнул. Не потому, что его слова полностью меня успокоили, а потому, что больше ничего не мог ответить.</p><p>Мне хотелось рассказать ему про подвал. Про человека, который приходил, про воду, про ожидание, про то, как постепенно перестал понимать, сколько времени прошло. Но стоило приблизиться к этим воспоминаниям, как они начинали расползаться. Я не мог решить, с какого момента история становилась достаточно настоящей, чтобы её можно было произнести.</p><p>И ещё я боялся его реакции.</p><p>Не того, что он испугается или отвернётся. Скорее того, что впервые увижу в его лице настоящее понимание того, насколько сильно всё изменилось. Пока он просто находился рядом, я мог делать вид, что между нами ничего не произошло. Что я всё тот же человек, которого он знал до этого. Но если начать рассказывать, придётся признать, что прежняя жизнь закончилась не только для меня.</p><p>— Я не знаю, что мне теперь делать, — сказал я.</p><p>— Необязательно решать это прямо сейчас.</p><p>— А если я не смогу вернуться к тому, как было?</p><p>Он не ответил сразу.</p><p>Я смотрел на него и ждал. В какой-то степени мне хотелось услышать обещание. Что он не уйдёт, что всё будет как раньше, что ничего не изменится. Я понимал, что не имею права требовать от него таких слов, но всё равно хотел их услышать.</p><p>— Я не знаю, как всё будет, — наконец сказал он. — Но тебе не обязательно делать вид, что всё нормально. По крайней мере, со мной.</p><p>Я опустил глаза.</p><p>Это не было обещанием, что всё останется прежним. И, наверное, именно поэтому я смог ему поверить.</p><p>Я не знал, что будет дальше. Не знал, сколько времени понадобится, чтобы перестать вздрагивать от каждого звука, чтобы снова доверять собственным воспоминаниям, чтобы научиться спокойно оставаться одному. Не знал, смогу ли когда-нибудь рассказать ему всё без ощущения, будто заново переживаю произошедшее.</p><p>Но впервые за долгое время мне не нужно было немедленно находить ответы на все эти вопросы.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Когда он снова уснул, я ещё долго лежал рядом и смотрел в потолок.</p><p>Разговор не принёс облегчения. Скорее, наоборот: некоторые вещи, которые до этого существовали где-то на периферии сознания, теперь обрели более чёткие очертания. Я всё ещё не мог восстановить последовательность событий, но уже понимал, что не хочу возвращаться к ним снова и снова. По крайней мере, не сейчас.</p><p>Я повернулся к телефону, лежавшему неподалёку.</p><p>Несколько секунд смотрел на него, прежде чем взять в руки. Экран загорелся, и я машинально открыл список приложений. Палец остановился над тем, которое давно стало для меня чем-то вроде личного архива — заметки.</p><p>ТИС.</p><p>Я не открывал его с тех пор, как всё произошло. Не потому, что забыл о существовании документа. Скорее, не хотел видеть его название. Оно слишком тесно связывалось с тем, что я пытался сделать со своей жизнью, и теперь мне было трудно понять, как вообще относиться к этой связи.</p><p>Я всё-таки нажал.</p><p>На экране появился знакомый текст. Заголовок, пункты, названия треков, короткие формулировки, которые когда-то казались мне настолько точными, что я почти не сомневался в их справедливости. Я перечитал первые строки, потом пролистал ниже.</p><p>Мотив. Преступление. Вина. Наказание.</p><p>Четыре слова, которые должны были объяснить всё.</p><p>Я долго смотрел на них.</p><p>Когда-то мне казалось, что я наконец нашёл подходящий способ разобраться с собой. Не просто бесконечно обвинять себя, а придать этому обвинению форму. Разделить происходящее на части, назвать каждую из них, определить последовательность и в конце получить какой-то результат. Я хотел, чтобы вина перестала быть чем-то бесконечным и бесформенным. Чтобы у неё появились границы, а у наказания — смысл.</p><p>Я думал, что если смогу достаточно точно определить собственные проступки, то смогу понять, чего заслуживаю.</p><p>Теперь эта логика выглядела странно.</p><p>Я прокрутил документ до последних пунктов. Некоторые формулировки уже не вызывали прежнего отклика. Другие, наоборот, заставляли задерживаться дольше, чем хотелось бы. Я пытался читать их глазами человека, которым был до похищения, но не мог полностью отделить себя нынешнего от того, кто когда-то всё это писал.</p><p>Тогда я ещё верил, что происходящее можно контролировать.</p><p>Я сам выбирал правила, сам определял наказание, сам решал, когда очередной этап будет считаться завершённым. Даже если мне становилось страшно, я мог убеждать себя, что это часть процесса. Что я понимаю, зачем всё делаю. Что в конце обязательно будет какой-то смысл.</p><p>Но похищение не имело отношения к моим правилам.</p><p>Человек, который держал меня там, ничего не знал о ТИС. Не знал, за что я себя обвиняю, чего пытаюсь добиться и какое значение придаю собственным страданиям. Ему не требовалось моё признание. Он не собирался устанавливать справедливость, помогать мне искупить вину или приближать к Богу.</p><p>У него были собственные намерения.</p><p>И от этой мысли становилось особенно неприятно.</p><p>Я так долго пытался воспринимать всё через собственную систему координат, что даже чужую жестокость умудрился сначала принять за продолжение своего наказания. Мне было проще поверить, что происходящее имеет отношение ко мне, что в нём есть какой-то смысл, пусть даже отвратительный, чем признать, что всё это могло случиться просто потому, что кто-то решил использовать другого человека.</p><p>Без высшего замысла. Без справедливости. Без необходимости.</p><p>Я посмотрел на свои руки.</p><p>В какой-то момент мне стало ясно, что человек в подвале не знал обо мне практически ничего. Он не знал, какие мысли я записывал в этот документ, какие поступки считал непростительными и сколько времени потратил на то, чтобы убедить себя в собственной виновности. Он видел перед собой только человека, которого можно было использовать.</p><p>Я не был для него грешником. Не был обвиняемым. Не был человеком, которому полагалось пройти через определённое испытание.</p><p>Я был просто человеком, оказавшимся в чужих руках.</p><p>И почему-то именно это оказалось труднее всего принять.</p><p>Если произошедшее не было наказанием, значит, оно ничего не искупило. Если оно ничего не искупило, значит, всё, что я пытался вложить в собственные страдания, не имело того значения, которое я ему приписывал. Я не приблизился к Богу. Не стал чище. Не получил ответа. Не избавился от вины.</p><p>Я просто пострадал.</p><p>Эта мысль казалась почти оскорбительной. В ней не было ни завершения, ни объяснения, ни даже той жестокой последовательности, за которую я так отчаянно цеплялся. Мне хотелось найти в произошедшем хотя бы какую-то закономерность, но чем дольше я смотрел на документ, тем отчётливее понимал, что он не способен объяснить случившееся.</p><p>ТИС должен был привести меня к определённому результату. Но теперь я не знал, что именно считать результатом.</p><p>Я мог продолжить. Мог снова открыть список, перечитать пункты, попытаться найти новые доказательства собственной вины. Наверное, даже смог бы придумать, как включить похищение в уже существующую систему. Объявить его последним испытанием, высшей формой наказания, ещё одним подтверждением того, что я заслужил всё произошедшее.</p><p>Мой мозг уже предлагал подобные объяснения. Они были знакомыми, удобными, почти успокаивающими.</p><p>И именно поэтому я им не доверял.</p><p>Я закрыл документ.</p><p>Не удалил. Не стал переписывать. Не объявил, что больше никогда к нему не вернусь. Просто закрыл, оставив всё как было.</p><p>Мне было страшно отказаться от этой системы. Не потому, что я действительно верил в её справедливость, а потому, что не знал, чем заменить её в собственной голове. Если я перестану считать себя виновным во всём, что со мной происходит, придётся столкнуться с вопросом, на который у меня пока не было ответа: кто я без постоянного обвинения?</p><p>Я положил телефон обратно и посмотрел на человека рядом.</p><p>Он всё ещё спал. Я осторожно поправил одеяло, стараясь не разбудить его, и снова лёг на спину.</p><p>Впервые за долгое время мне не хотелось придумывать для себя очередное наказание. Но это не означало, что я научился прощать себя. Между этими двумя состояниями оказалось гораздо больше пространства, чем я предполагал.</p><p>Я всё ещё чувствовал вину. Всё ещё не понимал, что делать с собственными убеждениями, с воспоминаниями, с тем, что произошло. И всё ещё не мог избавиться от мысли, что должен был каким-то образом предотвратить случившееся.</p><p>Но теперь я хотя бы знал одну вещь.</p><p>То, что со мной сделали, не было моим искуплением.</p><p>И я не хотел больше пытаться сделать из этого что-то другое.</p>"}]}];
var CH=[];BOOK.forEach(function(p){p.chapters.forEach(function(c){c.part=p.title;CH.push(c)})});
var $=function(i){return document.getElementById(i)},root=document.documentElement,
    stage=$('stage'),view=$('view'),flow=$('flow'),cur=0,page=0,pages=1,GAP=60;

// --- НОВАЯ ЛОГИКА ДЛЯ ОБЩЕГО КОЛИЧЕСТВА СТРАНИЦ ---
var chPages = []; // Массив для хранения количества страниц в каждой главе
var totalBookPages = 1; // Общее количество страниц во всей книге
var currentGlobalPage = 1; // Текущая страница во всей книге
// ------------------------------------------------

function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var S={ff:get('son-4-ff')||'Alegreya,serif',fs:+get('son-4-fs')||(matchMedia('(hover: none) and (pointer: coarse)').matches?16:18),lh:+get('son-4-lh')||1.5,th:get('son-4-th')||'night'};
function applyS(){root.style.setProperty('--ff',S.ff);root.style.setProperty('--fs',S.fs+'px');root.style.setProperty('--lh',S.lh);root.dataset.theme=S.th;
  $('fs').value=S.fs;$('fsVal').textContent=S.fs;$('lh').value=S.lh;$('lhVal').textContent=S.lh.toFixed(1);
  [].forEach.call($('ffSeg').children,function(b){b.classList.toggle('on',b.dataset.v===S.ff)});
  [].forEach.call($('thSeg').children,function(b){b.classList.toggle('on',b.dataset.v===S.th)});
  put('son-4-ff',S.ff);put('son-4-fs',S.fs);put('son-4-lh',S.lh);put('son-4-th',S.th)}

function layout(keepFrac){
  var f=keepFrac==null?(pages>1?page/(pages-1):0):keepFrac;
  var w=Math.min(660,stage.clientWidth-32);root.style.setProperty('--pw',w+'px');root.style.setProperty('--gap',GAP+'px');
  flow.classList.add('noanim');flow.style.transform='none';
  
  pages=Math.max(1,Math.round((flow.scrollWidth+GAP)/(w+GAP)));
  
  measureAll();
  if(chPages[cur]!==pages){totalBookPages+=pages-chPages[cur];chPages[cur]=pages}
  
  page=Math.min(pages-1,Math.max(0,Math.round(f*(pages-1))));show();
  requestAnimationFrame(function(){flow.classList.remove('noanim')})
}

// Подсчет страниц всей книги: каждая глава верстается в невидимой копии
// той же самой области чтения, с теми же стилями и размерами.
function measureAll(){
  var v=document.createElement('div');v.className='view';v.setAttribute('aria-hidden','true');
  v.style.visibility='hidden';v.style.pointerEvents='none';
  var f=document.createElement('div');f.className='flow noanim';v.appendChild(f);stage.appendChild(v);
  var w=view.clientWidth;chPages=[];totalBookPages=0;
  CH.forEach(function(c){f.innerHTML=chapterHtml(c);
    var n=Math.max(1,Math.round((f.scrollWidth+GAP)/(w+GAP)));chPages.push(n);totalBookPages+=n});
  stage.removeChild(v);
}
function calculateGlobalPages(cb){measureAll();if(cb)cb()}

function show(){
  var w=view.clientWidth;flow.style.transform='translateX('+(-page*(w+GAP))+'px)';
  var c=CH[cur];
  
  // Вычисляем глобальную страницу (сумма страниц предыдущих глав + текущая)
  currentGlobalPage = page + 1;
  for(var i=0; i<cur; i++){
    if(chPages[i]) currentGlobalPage += chPages[i];
  }

  var leftCh=pages-1-page;$('meta').textContent='Стр. '+currentGlobalPage+' из '+totalBookPages+' · Осталось: '+leftCh+' стр.';
  $('bar').style.width=(currentGlobalPage / totalBookPages * 100)+'%';
  $('prev').disabled=cur===0&&page===0;$('next').disabled=cur===CH.length-1&&page===pages-1;
  put('son-ch',cur);put('son-pg',pages>1?page/(pages-1):0);
}

function chapterHtml(c){var endHtml = '<div class="end" aria-label="Конец главы"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><line x1="24" y1="8" x2="24" y2="40"></line><line x1="15" y1="17" x2="33" y2="17"></line></svg></div>';
  var epigraph=c.epi?'<div class="epi">'+c.epi+(c.epiBy?'<b>'+c.epiBy+'</b>':'')+'</div>':'';
  var content=c.html;
  return '<div class="ch-head"><div class="ch-num">Глава '+c.n+'</div><h1 class="ch-title">'+c.title+'</h1><div class="track-launch chapter-track"><button type="button" data-play-track="'+(c.n-1)+'">Включить саундтрек главы</button></div>'+epigraph+'</div>'+content+endHtml;}
function render(i,frac){cur=i;var c=CH[i];
  flow.innerHTML=chapterHtml(c);
  $('kick').textContent='SAINT OF NOTHING';document.title=c.title+' · SAINT OF NOTHING';
  [].forEach.call($('toc').querySelectorAll('button.chapter-link'),function(b){b.classList.toggle('on',+b.dataset.i===i)});
  layout(frac==null?0:frac);if(typeof updateTrackButton==='function')updateTrackButton()}

// Перелистывание на соседнюю главу: старая страница уезжает, новая въезжает следом
function crossTo(i,frac,dir){
  var step=view.clientWidth+GAP;
  var oldX=-page*step;
  var ghost=flow.cloneNode(true);ghost.removeAttribute('id');ghost.classList.add('noanim');
  ghost.style.position='absolute';ghost.style.left='0';ghost.style.top='0';ghost.style.width='100%';
  ghost.style.transform='translateX('+oldX+'px)';view.appendChild(ghost);
  render(i,frac);
  var target=-page*step;
  flow.classList.add('noanim');flow.style.transform='translateX('+(target+dir*step)+'px)';
  void flow.offsetWidth;
  flow.classList.remove('noanim');ghost.classList.remove('noanim');
  flow.style.transform='translateX('+target+'px)';
  ghost.style.transform='translateX('+(oldX-dir*step)+'px)';
  setTimeout(function(){if(ghost.parentNode)ghost.parentNode.removeChild(ghost)},400);
}
function go(d){
  if(d>0){if(page<pages-1){page++;show()}else if(cur<CH.length-1)crossTo(cur+1,0,1)}
  else{if(page>0){page--;show()}else if(cur>0)crossTo(cur-1,1,-1)}}

// Переход на конкретную глобальную страницу (для ползунка)
function goToGlobalPage(targetGlobal) {
  targetGlobal = Math.max(1, Math.min(totalBookPages, targetGlobal));
  var targetCh = 0;
  var pageInCh = targetGlobal - 1;
  
  for(var i=0; i<CH.length; i++) {
    if(pageInCh < chPages[i]) {
      targetCh = i;
      break;
    }
    pageInCh -= chPages[i];
  }
  
  if(cur !== targetCh) {
    render(targetCh, 0);
  }
  
  if(page !== pageInCh) {
    page = pageInCh;
    show();
  }
}

// Оглавление: главы открываются отдельно, стрелка раскрывает подглавы.
var last='';BOOK.forEach(function(p){if(p.title){var h=document.createElement('div');h.className='part';h.textContent=p.title;$('toc').appendChild(h)}
  p.chapters.forEach(function(c){
    var holder=document.createElement('div');holder.innerHTML=c.html;
    var subtitles=holder.querySelectorAll('.subtitle');
    var entry=document.createElement('div');entry.className='chapter-entry';
    var b=document.createElement('button');b.type='button';b.className='chapter-link';b.dataset.i=CH.indexOf(c);
    b.innerHTML='<small>Глава '+c.n+'</small>'+c.title;
    b.addEventListener('click',function(){pop(null);render(+b.dataset.i,0)});
    entry.appendChild(b);
    var subList=null;
    if(subtitles.length){
      subList=document.createElement('div');subList.className='subchapter-list';subList.hidden=true;
      subList.id='son-subchapters-'+CH.indexOf(c);
      var toggle=document.createElement('button');toggle.type='button';toggle.className='chapter-toggle';
      toggle.setAttribute('aria-label','Показать подразделы главы '+c.n);
      toggle.setAttribute('aria-controls',subList.id);toggle.setAttribute('aria-expanded','false');
      toggle.innerHTML='<span class="chevron" aria-hidden="true">›</span>';
      toggle.addEventListener('click',function(){
        subList.hidden=!subList.hidden;
        var expanded=!subList.hidden;
        toggle.setAttribute('aria-expanded',String(expanded));
        toggle.setAttribute('aria-label',(expanded?'Скрыть':'Показать')+' подразделы главы '+c.n);
      });
      entry.appendChild(toggle);
    }
    $('toc').appendChild(entry);
    if(subList){
      [].forEach.call(subtitles,function(sub,j){
        var sb=document.createElement('button');sb.type='button';sb.className='subchapter';
        sb.textContent=sub.textContent.trim();sb.dataset.i=CH.indexOf(c);
        sb.addEventListener('click',function(){
          pop(null);
          if(cur!==+sb.dataset.i)render(+sb.dataset.i,0);
          var target=flow.querySelectorAll('.subtitle')[j];
          if(!target)return;
          var columnWidth=view.clientWidth+GAP;
          var column=Math.round((target.getBoundingClientRect().left-flow.getBoundingClientRect().left)/columnWidth);
          page=Math.max(0,Math.min(pages-1,column));show();
        });
        subList.appendChild(sb);
      });
      $('toc').appendChild(subList);
    }
  })});
function pop(which){['toc','set'].forEach(function(id){var on=which===id&&$(id).hidden;$(id).hidden=!on;$(id+'Btn').setAttribute('aria-expanded',String(on))})}
$('tocBtn').addEventListener('click',function(e){e.stopPropagation();pop($('toc').hidden?'toc':null)});
$('setBtn').addEventListener('click',function(e){e.stopPropagation();pop($('set').hidden?'set':null)});
document.addEventListener('click',function(e){if(!e.target.closest('.pop'))pop(null)});
$('ffSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b){S.ff=b.dataset.v;applyS();layout();calculateGlobalPages(show)}});
$('thSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(b){S.th=b.dataset.v;applyS()}});
$('fs').addEventListener('input',function(){S.fs=+this.value;applyS();layout();calculateGlobalPages(show)});
$('lh').addEventListener('input',function(){S.lh=+this.value;applyS();layout();calculateGlobalPages(show)});
$('prev').addEventListener('click',function(){go(-1)});$('next').addEventListener('click',function(){go(1)});
$('tapL').addEventListener('click',function(){go(-1)});$('tapR').addEventListener('click',function(){go(1)});
addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}else if(e.key==='Escape')pop(null)});
var tx=null;stage.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',function(e){if(tx==null)return;var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>45)go(d<0?1:-1);tx=null},{passive:true});
stage.addEventListener('wheel',function(e){if(Math.abs(e.deltaY)<20)return;clearTimeout(stage._w);stage._w=setTimeout(function(){go(e.deltaY>0?1:-1)},60)},{passive:true});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){layout();calculateGlobalPages(show)},120)});

// --- ИНТЕРАКТИВНЫЙ ПОЛЗУНОК ---
var progEl = $('prog');
var isDragging = false;
function seekPage(e) {
  var rect = progEl.getBoundingClientRect();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var x = clientX - rect.left;
  var pct = Math.max(0, Math.min(1, x / rect.width));
  var targetGlobal = Math.round(pct * (totalBookPages - 1)) + 1;
  goToGlobalPage(targetGlobal);
}
progEl.addEventListener('mousedown', function(e) {
  isDragging = true;
  progEl.classList.add('dragging');
  seekPage(e);
  e.preventDefault();
});
window.addEventListener('mousemove', function(e) {
  if (isDragging) seekPage(e);
});
window.addEventListener('mouseup', function() {
  isDragging = false;
  progEl.classList.remove('dragging');
});
progEl.addEventListener('touchstart', function(e) {
  isDragging = true;
  progEl.classList.add('dragging');
  seekPage(e);
}, {passive: false});
window.addEventListener('touchmove', function(e) {
  if (isDragging) {
    seekPage(e);
    e.preventDefault();
  }
}, {passive: false});
window.addEventListener('touchend', function() {
  isDragging = false;
  progEl.classList.remove('dragging');
});

// Плейлист: файлы лежат в папке audio рядом с index.html.
var TRACKS = [
  {section:'Глава I', name:'Radiohead — Everything in Its Right Place', file:'CH1_Everything_In_Its_Right_Place.mp3'},
  {section:'Глава II', name:'Akira Yamaoka — Celestial Dissonance', file:'CH2_Celestial_Dissonance.mp3'},
  {section:'Глава III', name:'Placebo — Every You Every Me', file:'CH3_Every_You_Every_Me.mp3'},

  {section:'Пункт III. Сомнения в Боге', name:"Nine Inch Nails — Me, I'm Not", file:'Me_Im_Not.mp3'},
  {section:'Пункт IV. Милосердие', name:'I Monster — Who Is She?', file:'Who_Is_She.mp3'},
  {section:'Пункт V. Не убий', name:'Seekae — Test & Recognize', file:'Test_and_Recognize.mp3'},

  {section:'Пункт IX. Искупление', name:'Radiohead — Exit Music (For a Film)', file:'Exit_Music.mp3'}
];
var audio=$('musicAudio'), player=$('musicPlayer'), playBtn=$('musicToggle');
var musicSeek=$('musicSeek'), musicTime=$('musicTime'), currentTrack=-1;
function formatTime(t){if(!isFinite(t)||t<0)t=0;return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function updateTrackButton(){
  [].forEach.call(flow.querySelectorAll('[data-play-track]'),function(button){
    var index=+button.getAttribute('data-play-track');
    var active=index===currentTrack&&!player.hidden;
    button.textContent=(active?'Выключить':'Включить')+' '+TRACKS[index].name;
    button.setAttribute('aria-label',button.textContent);
    button.setAttribute('aria-pressed',String(active));
    button.classList.toggle('track-active',active);
  });
}
function musicUI(){
  updateTrackButton();
  playBtn.textContent=audio.paused?'▶':'Ⅱ';
  playBtn.setAttribute('aria-label',audio.paused?'Продолжить песню':'Пауза');
  musicSeek.value=audio.duration?audio.currentTime/audio.duration*100:0;
  musicSeek.style.setProperty('--range-percent',musicSeek.value+'%');
  player.classList.toggle('is-playing',!audio.paused);
  musicTime.textContent=formatTime(audio.currentTime)+' / '+formatTime(audio.duration||0);
}
function updateReaderForPlayer(){
  var fraction=pages>1?page/(pages-1):0;
  requestAnimationFrame(function(){layout(fraction);calculateGlobalPages(show)});
}
function loadTrack(index){
  var track=TRACKS[index];currentTrack=index;audio.pause();
  audio.src='audio/'+track.file;audio.load();
  player.querySelector('.music-eyebrow').textContent='Саундтрек · '+track.section;
  player.querySelector('.music-name').textContent=track.name;
  musicSeek.value=0;musicTime.textContent='0:00 / 0:00';
}
function startMusic(index){
  var wasHidden=player.hidden;
  if(index!==undefined&&index!==currentTrack)loadTrack(index);
  player.hidden=false;if(wasHidden)updateReaderForPlayer();
  var promise=audio.play();
  if(promise&&promise.catch)promise.catch(function(){playBtn.textContent='▶';playBtn.setAttribute('aria-label','Не удалось включить песню — проверьте файл в папке audio')});
  musicUI();
}
function stopMusic(){audio.pause();audio.currentTime=0;player.hidden=true;musicUI();updateReaderForPlayer()}
flow.addEventListener('click',function(e){
  var button=e.target.closest('[data-play-track]');if(!button)return;
  var index=+button.getAttribute('data-play-track');
  if(!player.hidden&&currentTrack===index)stopMusic();else startMusic(index);
});
playBtn.addEventListener('click',function(){if(audio.paused){if(currentTrack<0)startMusic(0);else startMusic()}else audio.pause()});
$('musicClose').addEventListener('click',stopMusic);
musicSeek.addEventListener('input',function(){if(isFinite(audio.duration)&&audio.duration>0)audio.currentTime=(+this.value/100)*audio.duration});
$('musicVolume').addEventListener('input',function(){audio.volume=+this.value;this.style.setProperty('--range-percent',Math.round(+this.value*100)+'%')});
audio.volume=+$('musicVolume').value;
['timeupdate','durationchange','play','pause','ended','loadedmetadata'].forEach(function(event){audio.addEventListener(event,musicUI)});
audio.addEventListener('error',function(){playBtn.textContent='!';playBtn.title='Не удалось загрузить аудио: проверьте имя файла и папку audio'});


applyS();
var si=parseInt(get('son-ch'),10),sp=parseFloat(get('son-pg'));
render(isNaN(si)||si<0||si>=CH.length?0:si,isNaN(sp)?0:sp);

// Фоновый подсчет страниц при запуске
calculateGlobalPages(show);

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){layout();calculateGlobalPages(show)});
})();
