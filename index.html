 то, что никогда не касалось греха и не собирается. Этот запах я помню лучше, чем её лицо. Лицо стёрлось, а запах остался — как остаётся в комнате запах ладана после того, как свечи давно погасли.</p><p>Мне не особо понравилось.</p><p>Я помню её тело. Не лицо, не слова — тело. Гладкое, тёплое, слишком правильное, как всё в ней. Я касался её ног и чувствовал, как под ладонями кожа натягивается, как она дрожит, когда я веду пальцами вверх, от щиколотки к колену. Медленно. Благоговейно. Я хотел опуститься. Хотел припасть губами к внутренней стороне бедра и остаться там дольше, чем нужно. И остался. Она выдохнула — коротко, удивлённо, — и я почувствовал, как этот выдох проходит через её тело, как оно подаётся навстречу. Мне это понравилось. Мне понравилось, что я могу заставить её так выдохнуть.</p><p>А потом всё стало обычным. Я целовал её, и это было правильно. Я входил в неё, и это было правильно. Она двигалась подо мной, и её дыхание сбивалось, и я слышал, как она шепчет что-то, чего я не разбирал. Я старался. Я действительно старался. Я делал всё так, как должно быть: медленно, бережно, без единой лишней мысли. Я смотрел на неё и ждал, что что-то произойдёт. Что меня накроет. Что я почувствую то, что должен чувствовать.</p><p>Я чувствовал только её тело. Тёплое, живое, чужое. Оно было рядом, оно отвечало, оно хотело меня, — а я лежал в нём, как лежат в чужой постели: осторожно, чтобы не смять, и с мыслью, что скоро нужно будет встать.</p><p>Я был недоволен собой, хотя старался. Старался так, как стараются перед иконой: правильно, благоговейно, без единой лишней мысли. Я делал всё, что должен был делать, и ждал, что на меня снизойдёт. Не снизошло. Тело осталось телом — тяжёлым, неловким, чужим, — и я лежал потом и думал: значит, дело во мне. Значит, я недостаточно верую. Значит, я недостаточно подчинился.</p><p>Она же сказала, что секс со мной был самым лучшим в её жизни и она бы всё отдала, чтобы получить его снова.</p><p>Я выслушал это как приговор. Не ей — себе. Если ей было хорошо, а мне нет, значит, я поклонялся неправильно. Значит, идол был не тот. Значит, я припадал не к тому, к чему стоило припадать, и получал не то, чего просил. Она отдала бы всё, чтобы повторить, — а я не мог понять, что именно она хочет повторить. Я был там же, где и она, и я не помню ничего, что стоило бы отдать всё.</p><p>Я пообещал, что однажды повторим.</p><p>И всё же я не смог принять её слова. Она осталась довольна, но я продолжал искать в произошедшем собственную несостоятельность. Даже тогда, когда другой человек не видел во мне ничего плохого, я находил повод для обвинения.</p><p>В этом и заключается моё идолопоклонничество: я возвышаю человеческую красоту до недостижимого совершенства, а себя помещаю у подножия созданного мной алтаря. Я забываю, что передо мной живой человек, и превращаю его в образ, которому сам же назначаю святость.</p><p>Я поклоняюсь не ей. Я поклоняюсь собственному представлению о ней.</p><p>И, вероятно, именно поэтому ни один идол не способен дать мне отпущение грехов.</p><p class=\"subtitle\">Пункт III. Сомнения в Боге</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"8\" aria-label=\"Включить Nine Inch Nails — Me, I'm Not\">Включить Nine Inch Nails — Me, I'm Not</button></div><p>Сопровождающий трек: Nine Inch Nails — Me, I'm Not.</p><p>Я признаю за собой грех сомнения в божественном порядке. Сомнения в собственном происхождении, предназначении и месте относительно Всевышнего. Я не могу определить, кем являюсь после всего произошедшего: тем, кто был низвергнут, тем, кто продолжает сопротивляться падению, или тем, кто всё ещё претендует на место, которого никогда не имел.</p><p>Являюсь ли я Богом после всего того, что испытало моё жалкое тело? Стал ли я ближе к Нему? Или дальше? Или я так и остался падшим, озлобленным на то, как грубо меня лишили статуса лучшего?</p><p>Я часто думаю о Люцифере. О его красоте, гордыне и падении. О существе, которое не пожелало оставаться ниже Всевышнего и предпочло потерять небеса, нежели отказаться от собственного величия. Мне знакомо это чувство. Я тоже не умею смиряться с положением, которое считаю несправедливым. Не умею принимать собственную ничтожность, даже когда сам же называю себя ничтожным.</p><p>«Взойду на небо, выше звезд Божиих, вознесу престол мой и сяду на горе в сонме богов, на краю севера; взойду на высоты облачные, буду подобен Всевышнему».</p><p>Эти слова напоминают мне не столько о чужом падении, сколько о моём собственном желании возвыситься. Я не знаю, когда именно перестал различать поклонение и соперничество. Возможно, никогда и не различал. Я могу преклоняться перед Богом, признавать Его власть, искать Его милости — и одновременно ненавидеть саму мысль о том, что мне отведено место ниже.</p><p>Я держал его у своих ног, как когда-то моего Ангела.</p><p>Я привык считать себя падшим ангелом. Тем, кто когда-то принадлежал чему-то прекрасному, но оказался недостоин остаться рядом с ним. Однако в тот момент я увидел другую возможность. Что, если я не хочу возвращаться на небеса? Что, если мне недостаточно быть прощённым? Что, если я хочу, чтобы передо мной преклонялись так же, как когда-то преклонялся я?</p><p>Это отвратительная мысль. Гордыня, которую невозможно оправдать даже собственной болью.</p><p>Я не знаю, имею ли право сомневаться в Боге. Не знаю, является ли моё стремление к божественности проявлением веры или её отрицанием. Я хочу быть ближе к Нему, но не хочу признавать расстояние между нами. Хочу получить прощение, но не хочу быть тем, кто нуждается в милости.</p><p>Возможно, я сомневаюсь не в существовании Бога. Возможно, я сомневаюсь в том, что способен принять своё место в Его творении.</p><p>Он стоит на коленях у моих ног. Это правильное место для него. Единственное правильное. Он сам это знает, потому что не поднимает головы, пока я не позволю. Я не спрашиваю, хочет ли он. Не жду одобрения. Мне нужно подчинение. И верность. Я беру их так, как берут то, что принадлежит мне по праву.</p><p>И где-то на краю сознания — мысль, от которой холодеет затылок: я уже видел это. Точно так же. Тот же свет, тот же наклон головы, та же готовность принять всё. Тогда это был он. Ангел. И теперь это снова он — но я не могу отделаться от чувства, что стою не там, где стоял, и что место у моих ног занял кто-то другой.</p><p>— Не смотри на меня, — говорю я. Он опускает взгляд. Я вижу, как напрягаются его плечи. — Хорошо. Теперь смотри.</p><p>Он поднимает глаза. Я вижу в них то, что хочу видеть. Не страх. Не покорность. Готовность. Готовность принять всё, что я сделаю, и не отвести взгляд.</p><p>Я беру его за волосы. Коротко, жёстко. Тяну вниз, к себе. Он идёт на коленях, потому что я тяну, и я не думаю о том, удобно ли ему. Это не про удобство. Это про то, что он у моих ног. Он там, где должен быть.</p><p>Я вхожу в него без подготовки, без предупреждения, одним движением. Он вскрикивает. Сдавленно, коротко, мокро. Я чувствую, как его тело сопротивляется — сжимается, пытается вытолкнуть, — и как сдаётся. Подаётся. Пропускает. Это правильно. Я держу его за бёдра, пальцы впиваются так, что останутся следы. Начинаю двигаться. Каждый толчок жёсткий, тяжёлый, без жалости. Я слышу звук — влажный, ритмичный, чужой. Слышу, как кожа шлёпает по коже. Слышу, как он дышит — рвано, через нос, сдавленно. Он горит под моими руками. Я чувствую этот жар — кожей, ладонями, членом. Он возбуждает меня сильнее, чем что-либо ещё. Он горит потому, что я его зажёг. Он горит для меня.</p><p>Я узнаю этот ритм. Узнаю, как он подстраивается, как ловит мой темп. Тогда было так же. Я думал, что делаю это в первый раз. Теперь я знаю, что повторяю — и не знаю, повторяю ли я с ним или вместо него. Может быть, я никогда не делал этого с ним. Может быть, всегда с тем, первым.</p><p>Я наклоняюсь и кусаю его в шею. Сильно. До тёмного следа. Он выдыхает с хрипом. Я зализываю. Кусаю снова — ниже, у плеча. Ещё ниже, у лопатки. Каждый след — подпись. Клеймо. Свидетельство того, что он был у моих ног и что это место теперь отмечено. Кожа под моими губами солёная от пота. Я чувствую её вкус. Он не просит остановиться. Он вообще ничего не просит. Он принимает. В этом принятии есть что-то, от чего у меня срывается дыхание.</p><p>— Ты мой, — говорю я. Это не вопрос. — Скажи это.</p><p>— Я твой, — выдыхает он. Голос сломленный. Это лучшее, что я слышал за долгое время.</p><p>Я ускоряюсь. Он выгибается подо мной. Я чувствую, как он сжимается вокруг меня — раз, другой, — и это уже почти. Я держу его за бёдра. Вбиваюсь так, что кровать скрипит. Красный свет дрожит на стенах. Я думаю: вот оно. Вот то, чего я хотел. Вот то, что я отнял у неба и положил к своим ногам.</p><p>Он кончает первым. Я чувствую это по тому, как он замирает. Как сжимается. Как дыхание срывается на всхлип. Я чувствую, как его тело обмякает подо мной — тяжело, мокро, всё ещё вздрагивая.</p><p class=\"subtitle\">Пункт IV. Милосердие</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"9\" aria-label=\"Включить I Monster — Who Is She?\">Включить I Monster — Who Is She?</button></div><p>Сопровождающий трек: I Monster — Who Is She?.</p><p>Я признаю за собой сомнение в способности к милосердию. Способен ли я совершать поступки, не продиктованные собственной гордыней, страхом или желанием получить что-то взамен? Способен ли я быть ласковым, нежным, осторожным с чужими чувствами? Способен ли я дать хоть кому-нибудь тепло, которое, кажется, давно утратил сам?</p><p>Я не уверен, что милосердие вообще может быть мне свойственно. Иногда мне кажется, что я разучился обращаться с чем-то живым без желания присвоить, изменить или подчинить.</p><p>Я её почти не помню. Только помню, что она была невыносимо красивой. В памяти остались отдельные черты, какие-то движения, ощущение её присутствия. Лицо постепенно стирается, и я уже не могу восстановить его целиком. Странно, что некоторые люди оставляют после себя не воспоминание, а несколько деталей, которые почему-то отказываются исчезать.</p><p>Она хотела, чтобы я был ласковым. Не требовала от меня поклонения, не просила обещаний, не пыталась занять место Бога. Ей хотелось простого человеческого тепла. Я сделал всё, что смог. Целовал её, нежно гладил, старался быть аккуратным в каждом движении. Следил за тем, чтобы не причинить ей дискомфорта, чтобы она чувствовала себя желанной и защищённой. Я пытался не думать о себе, не оценивать происходящее, не искать в собственных действиях очередное подтверждение своей несостоятельности.</p><p>На какое-то время у меня получилось.</p><p>Она умоляла меня остаться.</p><p>Я помню это лучше, чем многое другое. Её просьбу, её голос, то, как она не хотела отпускать меня. И я не смог. Не потому, что она сделала что-то неправильно или что мне было неприятно находиться рядом. Я просто не знал, что должен был сделать дальше. Как остаться после того, как уже отдал всё, что мог предложить.</p><p>Мне казалось, что я не имею права лишать её того, что только что сделал. Не хотел, чтобы моё присутствие испортило это воспоминание. Чтобы нежность, которую я сумел ей дать, превратилась во что-то другое. Возможно, я боялся, что не смогу повторить её. Что одного раза оказалось достаточно, а всё последующее лишь обнаружило бы, насколько мало во мне осталось.</p><p>Я ушёл, оставив её с тем, что она хотела сохранить.</p><p>И до сих пор не знаю, было ли это милосердием или очередной формой бегства. Я могу быть ласковым, пока от меня не требуется оставаться. Могу проявить нежность, пока она не становится обещанием. Могу дать человеку немного тепла, но не уверен, что способен разделить с ним то, что последует за этим.</p><p>Возможно, я ошибочно принимаю собственную неспособность к близости за заботу о другом человеке. Убеждаю себя, что ухожу ради него, хотя на самом деле просто не выдерживаю мысли о том, что кто-то может захотеть от меня большего.</p><p>Но я ведь действительно старался.</p><p>Мне хочется верить, что этот поступок имел значение. Что хотя бы на короткое время я оказался способен не разрушать, не требовать, не присваивать. Что мои руки могут не только удерживать и причинять боль, но и быть осторожными. Что я способен прикоснуться к другому человеку и не превратить это прикосновение в очередное доказательство собственной власти.</p><p>Я не знаю, можно ли считать это милосердием. Не знаю, достаточно ли одного хорошего поступка, чтобы признать за собой хоть какую-то добродетель.</p><p>Но если во мне ещё осталось что-то человеческое, возможно, оно проявляется именно так: в редкие моменты, когда я хотя бы пытаюсь быть добрым, даже если потом всё равно ухожу.</p><p class=\"subtitle\">Пункт V. Не убий</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"10\" aria-label=\"Включить Seekae — Test &amp; Recognize\">Включить Seekae — Test &amp; Recognize</button></div><p>Сопровождающий трек: Seekae — Test & Recognize.</p><p>Я признаю за собой мысли об убийстве. Не как случайную фантазию, не как мимолётный приступ злости, который исчезает вместе с раздражением. Я допускаю саму возможность того, что однажды могу перестать воспринимать этот запрет как нечто непреложное. И меня пугает не только содержание этих мыслей, но и то, с какой настойчивостью я пытаюсь найти им объяснение.</p><p>Способен ли я переступить через черту, если буду убеждён, что за ней скрывается нечто большее? Если смогу представить это не преступлением, а необходимостью? Если сумею убедить себя, что таким образом приближаюсь к Богу, что нарушение запрета откроет мне то, чего я не способен увидеть, пока остаюсь по эту сторону собственной морали?</p><p>Я понимаю, насколько чудовищно звучат эти рассуждения. Но понимание не заставляет их исчезнуть. Напротив, я начинаю разбирать их, искать в них противоречия, проверять каждое слово, словно передо мной очередная задача, которую достаточно правильно сформулировать, чтобы получить ответ. Будто где-то существует исключение, мелким шрифтом вписанное в священный закон. Будто мне просто нужно его обнаружить.</p><p>«Не убий».</p><p>Я знаю эту заповедь. Знаю её значение и не собираюсь притворяться, будто никогда не слышал. Но почему-то именно сейчас мне хочется подвергнуть сомнению не сам запрет, а собственную способность безоговорочно ему подчиняться. Мне хочется найти причину, по которой я мог бы нарушить его и всё ещё считать себя верующим. Сохранить Бога, отказавшись от того, что, казалось бы, должно отделять меня от греха.</p><p>Наверное, мне нужны виновные. Люди, чьи поступки не оставляли бы места для сомнений. Я хочу, чтобы зло наконец приобрело узнаваемое лицо, чтобы его можно было отделить от всего остального, указать на него и не испытывать ни малейшей неуверенности. Чтобы я мог посмотреть на кого-то и без колебаний сказать: вот зло. Вот то, что заслуживает осуждения. Вот то, перед чем мне не придётся искать оправданий для собственного милосердия.</p><p>Мне хочется мира, в котором всё настолько очевидно, что не нужно больше ничего решать самому.</p><p>И, наверное, именно поэтому я так упорно ищу границу между справедливостью и жестокостью. Не потому, что не вижу разницы. А потому, что боюсь однажды обнаружить, насколько легко мне захочется сделать вид, будто её больше нет.</p><p>Их четверо.</p><p>Они все — блядские фанаты Кристиана Бэйла. Они дрочат на психопата Патрика Бэйтмана. Им нравится образ человека, которого они превратили в предмет восхищения, вытащив из него всё, что делает его отвратительным. Им нравится костюм, выражение лица, холодная уверенность, цитаты, эстетика. Они смотрят на чудовище и видят икону.</p><p>Меня раздражает даже не сам фильм. Меня раздражает то, как легко люди способны перепутать изображение зла с самим злом. Как быстро жестокость становится привлекательной, если её достаточно красиво подать. Как человек может смотреть на чужое безумие и видеть в нём образец для подражания.</p><p>Я не знаю, что именно они находят в нём. Не знаю, насколько хорошо они понимают, кем является Патрик Бэйтман за пределами мемов и цитат. Но мне отвратительна сама мысль о поклонении подобному образу. О том, что разрушение можно превратить в аксессуар, а отсутствие совести — в желательное качество.</p><p>И всё же я должен спросить себя: чем я отличаюсь от них?</p><p>Я тоже ищу в жестокости определённую эстетику. Тоже пытаюсь придать разрушению смысл, найти в нём нечто возвышенное. Я осуждаю их за восхищение психопатом, но сам размышляю о преступлении как о возможном пути к Богу. Они делают из него идола. А я пытаюсь сделать из него испытание.</p><p>Разве это не та же самая гордыня, только облачённая в религиозные одежды?</p><p>Я хочу верить, что между нами существует принципиальная разница. Что мои намерения чище. Что я хотя бы понимаю тяжесть того, о чём думаю. Но понимание не делает человека невиновным. И вера не превращает преступление в добродетель.</p><p>Возможно, именно это мне труднее всего принять: я могу сколько угодно искать высший смысл, но не каждое действие становится священным оттого, что я посвящаю его Богу.</p><p>Я пока не знаю, что делать с этой мыслью.</p><p>Но впервые за долгое время мне кажется, что я ищу не прощения.</p><p>Я остаюсь у них на ночь. Не потому, что хочу. Потому что уходить в темноту, зная, что они останутся здесь, со своими цитатами и своей эстетикой, кажется мне неправильным. Я должен видеть. Я должен знать, чем они дышат, когда никто не смотрит.</p><p>Мы играем в «правда или раздевание». Это их идея, и она абсурдна с самого начала. Слишком много смеха. Слишком много позёрства. Слишком много желания казаться теми, кем они не являются. Я смотрю на них и думаю: вы даже в игре не можете быть честными. Вы даже здесь играете роль.</p><p>Всё доходит до абсурда.</p><p>Один из них встаёт передо мной на колени. Просто так, без повода. Может, решил, что так будет смешнее. Смотрит на меня снизу вверх. В этом взгляде есть что-то, от чего у меня внутри всё сжимается. Он не боится. Он ждёт. Он делает из меня идола, сам того не понимая. И я ненавижу его за это сильнее, чем за всё остальное.</p><p>Я ужасно хочу выебать его в рот. Не потому, что хочу его. Потому что хочу вбить в него хоть что-то настоящее. Хочу, чтобы он захлебнулся не цитатой из фильма, а мной. Хочу, чтобы на секунду перестал быть фанатом и стал просто телом, которое получает то, чего стоит.</p><p>Я беру его за волосы. Резко, без предупреждения. Тяну к себе. Он не сопротивляется. Открывает рот — широко, как открывают дверь, которую давно ждали. Я вхожу. Сразу, до конца. Он давится. Слышу, как он давится — коротко, — и как слюна собирается у него под языком и течёт по подбородку. Я двигаюсь жёстко, без жалости. Вижу, как его губы натягиваются, как из уголка рта тянется нитка, как он сглатывает и не успевает. Смотрю на него сверху вниз и думаю: вот твой идол. Вот твой Патрик Бэйтман. Смотри, как он выглядит на самом деле. Смотри, как он выглядит, когда он пользуется.</p><p>Он смотрит. Глаза мокрые. Он не отводит взгляд. И от этого во мне поднимается что-то злое, тяжёлое, чему я не мешаю.</p><p>А потом всё превращается в комок.</p><p>Я не понимаю, как это происходит. Просто в какой-то момент я уже не сверху — я под ними всеми. Их руки на мне. Их тела. Их дыхание. Всё смешивается в одно тяжёлое, горячее, неразличимое. Я тону в боли и наслаждении. Больно — и хорошо. Унизительно — и правильно. Я чувствую, как меня держат, как входят, как берут. Не различаю, кто именно. Чувствую только, как меня наполняют — раз, другой, третий, — как скользит по коже, как собирается подо мной на простыне что-то мокрое и липкое. Чувствую запах — пота, кожи, чужого дыхания и того, что уже нельзя назвать иначе, чем похоть. Это уже неважно. Важно, что я внизу. Важно, что я получаю.</p><p>Я думаю: вот оно. Вот то, чего я хотел. Быть под ними. Быть тем, кого берут. Быть наказанным за то, что сам хотел наказать других.</p><p>Я тону.</p><p class=\"subtitle\">Пункт VI. Избегание</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"11\" aria-label=\"Включить Patrick Wolf — The Libertine\">Включить Patrick Wolf — The Libertine</button></div><p>Сопровождающий трек: Patrick Wolf — The Libertine.</p><p>Я признаю за собой грех избегания. Страх перед воспоминаниями, нежелание возвращаться к событиям, которые вызывают отвращение, стыд или сожаление. Я не хочу видеть их перед собой. Не хочу снова соприкасаться с тем, что однажды уже произошло. Мне проще отвернуться, закрыть глаза и сделать вид, будто некоторые страницы моей жизни никогда не существовали. Будто достаточно не перечитывать их, чтобы написанное постепенно исчезло.</p><p>Но избегание тоже становится формой отрицания. Отрицания прошлого, собственной ответственности и, в конечном счёте, самого себя. Нельзя признать грех, если отказываешься смотреть на обстоятельства, при которых он был совершён. Нельзя покаяться в том, что старательно вычёркиваешь из собственной памяти. Нельзя требовать прощения за то, чему даже не готов дать название.</p><p>Да, Натаниэль?</p><p>Я был на тусовке у знакомого. Обычный вечер, обычная компания, разговоры, музыка, лица, которые я теперь вряд ли смог бы вспомнить. Всё это существовало тогда совершенно естественно, не отличаясь от сотни других вечеров, которым я не придавал никакого значения. В какой-то момент его брат предложил мне быстрый, но, по его словам, лучший секс в моей жизни. На балконе.</p><p>Это был самый хуёвый секс в моей жизни.</p><p>И, пожалуй, на этом воспоминание заканчивается. Я не помню подробностей, не могу восстановить последовательность событий или собственные ощущения. В памяти не осталось почти ничего, за что можно было бы зацепиться. Ни цельного образа, ни особенного момента, ни даже внятного объяснения, почему всё это оставило после себя такое неприятное впечатление.</p><p>Мой мозг его даже не запомнил.</p><p>Это раздражает сильнее, чем должно. Я привык считать воспоминания свидетельствами. Доказательствами того, кем я был, что делал, чего хотел и чего заслуживал. Мне хочется верить, что из них можно собрать последовательную биографию, разобрать её на отдельные признания и наконец получить более или менее достоверное представление о самом себе. Но некоторые события словно не желают становиться частью этой системы. Они остаются за пределами рассказа, бесформенными пятнами там, где я ожидаю найти очередное доказательство.</p><p>Я не могу оценить то, чего не помню. Не могу восстановить обстоятельства, не могу определить собственную роль в них с той уверенностью, которой от себя требую. И, возможно, именно поэтому мне так хочется назвать забывание избеганием. Так проще. Тогда у провала появляется причина, у молчания — виновный, а у меня — ещё один повод обвинить себя.</p><p>Но действительно ли я сознательно отвернулся от прошлого? Или оно просто не осталось со мной?</p><p>Я не знаю.</p><p>Мне хочется верить, что память подчиняется моей воле. Что я могу выбрать, какие события сохранить, а какие оставить за пределами собственного сознания. Но память не заключала со мной никаких соглашений. Она не обязана свидетельствовать в мою пользу, не обязана предоставлять доказательства по первому требованию и уж точно не собирается соблюдать порядок, который я пытаюсь ей навязать. Иногда она удерживает совершенно ненужную мелочь — интонацию, цвет стены, случайную фразу, — а иногда не оставляет ничего от того, что, по моему мнению, должно было иметь значение.</p><p>Я могу сколько угодно сидеть перед пустой страницей, требовать от себя признаний и пытаться восстановить события по обрывкам. Но отсутствие воспоминания не превращается в воспоминание только потому, что мне необходимо заполнить пробел. И всё же я продолжаю смотреть на него, словно однажды там обязательно проступит недостающая часть моей вины.</p><p>Я называю это грехом, потому что не умею назвать иначе.</p><p>Даже собственное забывание я пытаюсь превратить в обвинение.</p><p class=\"subtitle\">Пункт VII. Благосклонность Бога</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"12\" aria-label=\"Включить And One — Military Fashion Show\">Включить And One — Military Fashion Show</button></div><p>Сопровождающий трек: And One — Military Fashion Show.</p><p>Я признаю, что наказание не всегда предполагает боль. Иногда оно принимает другую форму: назидание, наблюдение, направление. Не всякое испытание должно причинять страдание, чтобы чему-то научить. Возможно, я слишком долго считал боль единственным доказательством того, что действительно расплачиваюсь за собственные поступки. Будто всё, что не оставляет после себя повреждений, не может считаться настоящим уроком.</p><p>Иногда человеку достаточно встретить того, кто способен показать ему иной путь.</p><p>Я не знаю, можно ли назвать это благосклонностью Бога. Не знаю, посылает ли Он людей в ответ на наши просьбы или мы сами наделяем случайные встречи значением, которого в них изначально не было. Возможно, никакого знака и вовсе не существует. Просто однажды кто-то оказывается рядом, говорит несколько слов, делает что-то совершенно обыкновенное, а ты уже пытаешься разглядеть в этом движение чужой воли. Но иногда мне хочется верить, что даже я могу получить нечто хорошее без предварительного унижения. Что не всякая протянутая рука должна сначала указать на мои грехи.</p><p>Он был в форме спецназа SWAT.</p><p>Я едва успел подумать, что точно кого-то убил. Заповедь «Не убий» всё ещё помнил так отчётливо, что она, казалось, продолжала дрожать у меня в голове. Забавно, насколько быстро воображение способно превратить незнакомого человека в угрозу, если его внешний вид достаточно убедителен. Ещё забавнее, что спустя мгновение я уже пытался найти в происходящем какой-то высший смысл.</p><p>Его тело было просто охуенным.</p><p>Это я тоже помню совершенно отчётливо. Помню, как он легко поднял меня на плечо, чтобы перенести на кровать. В этом движении не было ни показной грубости, ни необходимости что-либо доказывать. Он просто сделал это, будто не видел причин сомневаться в собственных силах. А я, кажется, впервые за долгое время позволил себе не искать подвох в чужой уверенности.</p><p>И тогда я подумал, что с ним можно найти истину.</p><p>Не потому, что он действительно знал ответы на мои вопросы. Я ничего о нём не знал. Не знал, каким человеком он был за пределами этой встречи, во что верил, что считал правильным и насколько вообще соответствовал образу, который я успел ему придумать. Но мне понравилось ощущение спокойной уверенности, которое от него исходило. На какое-то время мне не требовалось разбираться в чужих намерениях, искать скрытый смысл или заранее готовиться к наказанию.</p><p>Возможно, я просто хотел побыть рядом с человеком, которому не нужно было ничего доказывать.</p><p>Это был лучший секс в моей жизни.</p><p>Он двигался медленно, размеренно, без спешки — так, как будто времени у нас больше, чем есть, и никуда не нужно успевать. И мне не хотелось ничего менять. Я не пытался превратить происходящее в испытание, не искал в нём подтверждения собственной ничтожности, не подбирал названий и не возводил алтарей. Впервые за долгое время мне не казалось, что я обязан заслужить каждое приятное мгновение — выпросить его, отработать, оплатить болью. Оно просто было. Я просто был. И этого оказалось достаточно.</p><p>Я помню, как он касался меня. Не сразу — сначала он долго держал ладони на моих бёдрах, просто держал, как будто ждал, пока я привыкну к тому, что меня держат. Потом провёл пальцами вверх, по внутренней стороне, и я почувствовал, как кожа собирается в мурашки, как она натягивается под его пальцами. Он не торопился. Он входил медленно, и я чувствовал каждый сантиметр — как давление нарастает, как тело подаётся, как оно принимает. Не потому, что должно. Потому что хочет.</p><p>Он двигался ровно. Глубоко. Так, что я чувствовал его где-то под животом, в самой середине, и от каждого толчка это чувство растекалось, тянулось, отпускало и возвращалось. Я слышал своё дыхание — оно было ровным, в такт. Я слышал его дыхание — тяжёлое, близкое. Я слышал, как скользит по коже, как влажно и тихо, и от этого звука во мне поднималось что-то тёплое, тягучее, без стыда.</p><p>Он наклонился и поцеловал меня в шею. Просто поцеловал. Без зубов, без хвата. Губы тёплые, влажные. Я запрокинул голову и позволил ему. Позволил всему. Впервые я не думал о том, как выгляжу, не думал, достаточно ли я хорош, не думал, что будет потом. Я просто был в этом. В его руках. В его ритме.</p><p>Правда, несколько засосов он всё-таки оставил. Особенно один — на ляжке, высоко, почти под самым краем белья. Я заметил его позже, когда остался один, и почему-то долго рассматривал: тёмное пятно на светлой коже, с неровными краями, как след от чужой печати. Маленькое свидетельство встречи, которая не требовала от меня ни покаяния, ни обещаний. Я провёл по нему пальцем — просто чтобы убедиться, что оно настоящее, — и подумал, что не хочу, чтобы оно проходило.</p><p>Может быть, я слишком легко принимаю уверенность за мудрость, физическую силу — за способность защитить, а собственное удовольствие — за знак свыше. Может быть, никакой истины я не нашёл. Просто встретил человека, рядом с которым мне было хорошо.</p><p>Но разве это обязательно должно быть чем-то плохим?</p><p>Я привык искать Бога в страдании, в лишениях, в необходимости расплачиваться. А теперь пытаюсь обнаружить Его благосклонность в чём-то совершенно обыкновенном.</p><p>Возможно, милость не всегда приходит в форме прощения.</p><p>Иногда она просто позволяет тебе ненадолго перестать ждать наказания.</p><p class=\"subtitle\">Пункт VIII. Грех</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"13\" aria-label=\"Включить Soap&amp;Skin — Me and the Devil\">Включить Soap&amp;Skin — Me and the Devil</button></div><p>Сопровождающий трек: Soap&Skin — Me and the Devil.</p><p>Я признаю за собой грех, который больше не могу отделить от собственного существования. Мне всё труднее различать отдельные проступки и ту вину, которую я приписываю себе целиком. Иногда кажется, что я уже не совершаю грехи — я просто существую в состоянии греха. Будто это нечто, что можно унаследовать вместе с телом, вдохнуть с первым воздухом и пронести через всю жизнь, так и не найдя способа избавиться.</p><p>То, что человек верит в Бога, не делает его чистым. Иногда вера даёт ему лишь ощущение собственного превосходства. Возможность смотреть на других сверху вниз, прикрываясь священными словами и убеждением, что ему известна разница между добром и злом. Будто знание этой разницы автоматически освобождает от необходимости ей следовать.</p><p>Я почти ничего не помню.</p><p>Это был священнослужитель. Я помню его руки, тесноту исповедальни, приглушённый свет и странное ощущение, будто пространство вокруг меня постепенно исчезало. Его пальцы касались моего колена. Я не помню, сколько времени прошло, прежде чем я сказал, что больше не могу. Не помню, что именно предшествовало этим словам и что последовало за ними. Остались отдельные детали, не желающие складываться в последовательность. Как будто память вырезала из произошедшего всё, кроме нескольких предметов, и оставила меня разбираться с ними самостоятельно.</p><p>Память снова оставила мне обрывки вместо целой истории.</p><p>Я грешен. И не могу искупить вину.</p><p>Помню его руку на своём подбородке и обещание, что он сможет отмыть меня от греха. Он говорил так уверенно, словно очищение было чем-то вполне осязаемым: достаточно произнести нужные слова, совершить нужный обряд, довериться человеку, который знает, как это делается.</p><p>Не получилось.</p><p>Я долго пытался понять почему. Может быть, я недостаточно верил. Может быть, не сумел правильно покаяться. Может быть, во мне настолько много скверны, что даже человек, посвятивший себя служению Богу, оказался бессилен. Я перебирал эти объяснения одно за другим, словно от правильного ответа зависело, смогу ли я когда-нибудь перестать чувствовать себя испорченным.</p><p>Но ведь он обещал.</p><p>Именно это не даёт мне покоя. Он говорил так, словно знал, что делает. Словно обладал правом определять, что во мне испорчено, а что ещё можно спасти. Я хотел поверить ему. Хотел хотя бы на несколько минут перестать быть собственным обвинителем и позволить кому-нибудь другому вынести решение. Не оправдать меня даже — просто сказать, что со мной всё ещё можно что-то сделать.</p><p>Вместо этого я вышел оттуда с прежней виной и новым отвращением к себе.</p><p>Теперь мне трудно смотреть на исповедальни без мысли о том, насколько легко священное пространство может стать местом, где человек теряет последние остатки доверия. Вещи, которым полагается давать утешение, иногда становятся неотличимы от вещей, внушающих страх. И самое мерзкое, что после этого я всё равно продолжаю искать ошибку в себе. Будто если достаточно долго и внимательно изучать собственную вину, можно однажды обнаружить в ней объяснение всему произошедшему.</p><p>Я не знаю, что именно случилось со мной в тот день. Не могу восстановить всё до последней подробности. Но я помню обещание очистить меня. Помню, что поверил. И помню, что это не помогло.</p><p>Это был священнослужитель. Я помню его руки — сухие, тёплые, с длинными пальцами, — тесноту исповедальни, приглушённый свет и странное ощущение, будто пространство вокруг меня постепенно исчезало. Сначала — стены. Потом — скамья под коленями. Потом — звуки снаружи. Остались только его пальцы, которые касались моего колена. Медленно. Не спрашивая. Как касаются того, что уже принадлежит.</p><p>Пахло ладаном.</p><p>Он не сказал ни слова. Он просто ждал, и я понял, что должен говорить сам. Не о грехах — о теле. О том, что оно делает, чего хочет, чего не должно хотеть. Я говорил шёпотом. Слова падали в тесноту исповедальни. Ладан вбирал их, и мне казалось, что каждое слово становится частью дыма — поднимается вверх и остаётся там, под потолком, как свидетельство.</p><p>Он положил ладонь мне на затылок. Я замолчал. Он не просил продолжать. Он просто держал, и я почувствовал, как меня тянет вниз. Не силой — самим этим жестом. Я опустился на колени на деревянный пол. Дерево было твёрдым. Это было правильно. Тайная вечеря. Тело как хлеб. Кровь как вино. Я не знал, где заканчивается молитва и начинается другое.</p><p>Он поднёс к моим губам хлеб. Пресный, сухой. Я взял его ртом. Он не отпустил сразу, заставив меня взять ещё. И ещё. Пока во рту не стало тесно и сухо. Потом — вино. Тёплое, терпкое, из общей чаши. Он держал чашу у моих губ. Я пил. Капли стекали по подбородку. Он не вытирал их. Он смотрел, как они падают на пол, и в этом взгляде было что-то, от чего я не мог отвести глаз.</p><p>Ладан становился гуще. Он оседал на коже, на волосах, на языке. Я чувствовал его вкус. Горький, смолистый. Смешанный со вкусом вина. Мне казалось, что я весь пропитан им. Что меня готовят. Что я — часть приношения.</p><p>Он коснулся моего лица. Пальцы прошли по щеке, по губам, по шее. Медленно. Как будто пересчитывали. Я закрыл глаза. Я не помню, что было дальше. Помню только его руки. Сухие, тёплые. То, как они держали меня. Как тело переставало быть моим, становилось чем-то, что принимают. Теснота исповедальни. Ладан. Свет, который всё тускнел.</p><p>Я не помню, сколько времени прошло, прежде чем я сказал, что больше не могу.</p><p>Не помню, что именно предшествовало этим словам и что последовало за ними. Остались отдельные детали, не желающие складываться в последовательность. Как будто память вырезала из произошедшего всё, кроме нескольких предметов, и оставила меня разбираться с ними самостоятельно. Запах ладана — он остался дольше всего. И вкус хлеба на языке.</p><p>Возможно, я ошибаюсь, когда считаю себя причиной всего произошедшего. Возможно, не всякая грязь принадлежит тому, на ком она осталась. Иногда её оставляет другой человек, а потом ты годами пытаешься отмыться, не задаваясь вопросом, почему вообще решил, что обязан это делать.</p><p>Но мне пока трудно в это поверить.</p><p>Я искал отпущения грехов и получил ещё одно воспоминание, от которого хочется отвернуться. Ещё одну причину считать себя недостойным прощения, хотя я даже не уверен, за что именно должен просить прощения.</p><p>И если Бог действительно видел меня тогда, я не знаю, почему до сих пор воспринимаю Его молчание как обвинение.</p><p class=\"subtitle\">Пункт IX. Искупление</p><div class=\"track-launch\"><button type=\"button\" data-play-track=\"14\" aria-label=\"Включить Radiohead — Exit Music (For a Film)\">Включить Radiohead — Exit Music (For a Film)</button></div><p>Сопровождающий трек: Radiohead — Exit Music (For a Film).</p><p>Что такое искупление? И чем оно отличается от наказания или самонаказания? Почему искупление должно даваться Богом, а наказание — судом? Кто вообще определяет, когда человек достаточно расплатился за совершённое? Существует ли мера, после которой вина перестаёт иметь значение, или некоторые поступки навсегда остаются с нами, постепенно становясь частью того, кем мы себя считаем?</p><p>Я столько времени пытался найти ответы на эти вопросы, что, кажется, перестал замечать, насколько опасным стало само желание их получить. Мне хотелось найти не просто объяснение, а окончательный вердикт. Что-то, после чего больше не придётся сомневаться, пересматривать собственные решения и возвращаться к одному и тому же вопросу. Я хотел, чтобы у вины была форма, у наказания — срок, а у искупления — понятный конец.</p><p>Наверное, именно поэтому я так легко убедил себя, что могу всё это устроить самостоятельно.</p><p>Всё ведь началось как игра. Как план. Как нечто условное, ограниченное правилами, которые я сам для себя установил. Я убеждал себя, что понимаю происходящее, что способен отличить вымысел от действительности, что в любой момент смогу остановиться и вернуться к собственной жизни. Мне казалось, что я достаточно хорошо знаю собственные границы, чтобы не переступить их по-настоящему.</p><p>Но я снова ошибся.</p><p>И опять моё прошлое едва ли не убивает меня.</p><p>Я слишком долго обращался с собственной жизнью так, словно она была черновиком, который можно переписывать сколько угодно раз. Словно любое решение можно отменить, любое последствие объяснить, а любую вину превратить в очередной пункт системы. Но действительность не обязана следовать правилам, которые я для неё придумал. Она не знает о моих оговорках. Не принимает мои условия. И уж точно не обязана останавливаться только потому, что я решил закончить игру.</p><p>Это больше не игра.</p><p>Это похищение.</p><p>Сырость подвала. Застывший воздух, пропитанный запахом бетона, плесени и чего-то ещё, чему я не могу подобрать название. Холод здесь ощущался иначе — не как температура, а как свойство самого пространства. Он будто въелся в стены, пол, одежду, проникал под кожу и оставался там, даже когда я переставал о нём думать. Воздух казался неподвижным и тяжёлым. Каждый вдох давался с неприятным ощущением, словно лёгкие отказывались принимать то, чем было наполнено это место.</p><p>Я не помню, сколько времени провёл там. В подвале не было ничего, за что можно было бы зацепиться взглядом и определить, сколько прошло минут. Только тусклая лампа, её неровный свет и тени, которые расползались по углам, делая их глубже, чем они могли быть на самом деле. Свет не столько освещал помещение, сколько обозначал границы темноты. За ними ничего не существовало. По крайней мере, моя память ничего туда не помещает.</p><p>Но его я помню.</p><p>Память вырезает многое, оставляет пустоты там, где должны быть последовательность событий, объяснения, причины и следствия. Иногда я пытаюсь восстановить происходящее, но вместо воспоминаний получаю только собственные предположения. И всё же этот образ остаётся удивительно отчётливым.</p><p>Он стоит в маске, освещённый тусклым светом лампы.</p><p>Просто стоит.</p><p>Я не помню, какого цвета была его одежда, видел ли я его руки, мог ли различить хоть какие-нибудь черты под маской. Не помню даже, куда именно был направлен его взгляд. Но помню саму маску. Она скрывала лицо настолько тщательно, что мне оставалось только догадываться, есть ли за ней вообще какое-то выражение. Я не мог понять, смотрит ли он на меня с раздражением, любопытством или полным безразличием. Возможно, он вообще ничего не выражал. Возможно, это я пытался найти в нём хоть какую-то человеческую реакцию, потому что невыносимо находиться перед тем, кого невозможно прочитать.</p><p>Он молчит.</p><p>Ничего не делает. Не говорит. Не приближается. Не объясняет, зачем находится здесь и чего от меня хочет. В этом молчании нет даже очевидной враждебности, за которую можно было бы зацепиться. Я не могу вспомнить угроз, приказов или каких-либо слов. Только неподвижную фигуру напротив и лампу над ней.</p><p>Мне хотелось, чтобы он хотя бы что-нибудь сделал. Произнёс хоть слово, изменил положение тела, дал мне какую-нибудь причину понять, что происходит. Любая реакция была бы лучше этой неопределённости. Но он продолжал стоять, а я продолжал смотреть на него, пытаясь самостоятельно заполнить тишину.</p><p>Наверное, именно это и было самым страшным: мне приходилось придумывать за него всё остальное.</p><p>Я не знал, что он думает. Не знал, чего ожидает. Не знал, сколько ещё собирается стоять передо мной. И чем дольше продолжалось это молчание, тем сильнее мне казалось, что я должен что-то сделать, что-то сказать, каким-то образом нарушить происходящее. Но я не мог найти ни одного подходящего действия. Даже собственные мысли переставали складываться в предложения. Они просто возникали и исчезали, не успевая обрести смысл.</p><p>Подвал оставался таким же холодным. Лампа продолжала гореть. Он продолжал стоять.</p><p>А я всё пытался понять, что именно должен увидеть в человеке, который не показывает мне ничего.</p><p>Потом помню, как он приблизился.</p><p>Не сразу. По крайней мере, мне так кажется. В памяти между его неподвижной фигурой и следующим мгновением есть какой-то провал, а потом он уже рядом. Слишком близко. Настолько, что я перестал воспринимать его как отдельную фигуру в пространстве и начал замечать только отдельные детали: тёмную ткань, складки одежды, движение плеч, приближение рук.</p><p>Я почувствовал себя загнанным зверьком. Тем самым, который забился в угол и уже не пытается искать выход, потому что любое движение только сильнее выдаёт его присутствие. Мне казалось, что я занимаю слишком много места, хотя на самом деле хотел исчезнуть целиком. Стать незаметным, перестать быть объектом его внимания, раствориться в сырости бетонных стен. Но спрятаться было негде. Подвал не оставлял пространства для отступления.</p><p>Сердце колотилось так сильно, что я всерьёз боялся: оно может разорваться. Я чувствовал каждый удар где-то в горле, в висках, под рёбрами. Собственное тело внезапно стало слишком громким. Оно выдавало меня каждым сокращением мышц, каждым судорожным вдохом. Я не мог заставить его успокоиться, как не мог заставить себя перестать бояться.</p><p>Я не смотрел на него. Не хотел.</p><p>Сосредоточился на чём-то перед собой, на неопределённой точке, лишь бы не встречаться с ним взглядом. Мне казалось, что, если я не буду смотреть, он хотя бы на время перестанет существовать в моём сознании. Глупая попытка. Детская, почти постыдная. Но тогда мне было не до достоинства.</p><p>Он заставил меня посмотреть.</p><p>Его пальцы в перчатках сомкнулись на моём лице. Холодные, чужие, лишённые всякой индивидуальности из-за плотной ткани. Он удерживал меня так, чтобы я больше не мог отвернуться. И тогда я наконец заметил то, чего не видел прежде.</p><p>Его глаза.</p><p>Раздражение в них было почти осязаемым. Не ярость, не какое-то театральное безумие — скорее нетерпение человека, которому приходится иметь дело с чем-то неприятным и нежелательным. Я увидел кобуру на его поясе. Увидел, как напряжено его лицо, как в глазах проступает желание ударить меня. Возможно, я ошибался в том, что именно он чувствовал. Возможно, страх заставлял меня читать его выражение так, как было страшнее всего. Но тогда мне не требовалось доказательств. Я уже поверил собственному восприятию.</p><p>Я почти не дышал.</p><p>Даже воздух в подвале будто перестал двигаться. Всё внимание сосредоточилось на его руке, удерживающей моё лицо, и на глазах, из которых я пытался вычитать собственную участь. Мне хотелось спросить, что происходит. Хотелось узнать, чего он от меня хочет, что я должен сделать, что сказать, за что именно отвечаю. Но вопросы застревали где-то внутри. Я не мог заставить себя произнести ни одного.</p><p>Я всё ещё не понимал, что от меня хотят.</p><p>Но уже был готов поверить, что это и есть истинное наказание.</p><p>Не случайность. Не чужое решение. Не событие, которое просто произошло со мной. Наказание. Божий суд, свершённый его руками.</p><p>Наверное, мне было проще принять именно такое объяснение. Если это суд, значит, существует обвинение. Если существует обвинение, значит, есть вина. А если есть вина, то происходящее хотя бы подчиняется какой-то логике. У него есть причина, пусть даже я не знаю, в чём она заключается. Можно искать грех, перебирать собственные поступки, пытаться понять, где именно я перешёл черту.</p><p>Гораздо страшнее было допустить, что никакого суда нет. Что человек передо мной не посланник, не орудие высшей воли и не исполнитель справедливого приговора. Что он просто человек, который может причинить мне боль, потому что решил это сделать.</p><p>Но я тогда ещё не мог отделить одно от другого.</p><p>Я слишком долго искал наказания, чтобы не попытаться узнать его, когда оно наконец оказалось передо мной.</p><p>Потом я помню одиночество.</p><p>Гнетущее, вязкое, растянувшееся на какое-то неопределённое время. Не знаю, сколько оно продолжалось. Сутки? Может, двое. А может, почти неделю. Я не мог определить, сколько прошло часов, сколько раз сменился день и наступила ли вообще ночь. В подвале время переставало быть чем-то измеримым. Оно не двигалось вперёд, а словно оседало вокруг меня вместе с сыростью, становилось частью стен, пола, моего собственного дыхания.</p><p>Я не помню, чем занимался всё это время. Наверное, пытался спать. Наверное, прислушивался к каждому звуку за пределами помещения, пытаясь угадать, кто там и когда откроется дверь. Иногда мне казалось, что я слышу шаги, но не мог понять, действительно ли кто-то приближается или сознание просто пытается заполнить тишину хоть чем-нибудь.</p><p>Помню, что он иногда приходил.</p><p>Открывал дверь, появлялся в проёме, что-то говорил мне. Я не могу восстановить его слова. Не помню, задавал ли он вопросы, требовал ли чего-нибудь или просто произносил несколько фраз, не ожидая ответа. Иногда он приносил бутылку воды. Ставил её рядом и уходил.</p><p>Вот и всё.</p><p>Никаких объяснений. Никаких разговоров, из которых я мог бы понять, зачем нахожусь здесь и что должно произойти дальше. Он появлялся, нарушал тишину, оставлял воду и снова исчезал. Я начинал ждать следующего визита, хотя каждый раз боялся его. Получалось какое-то отвратительное противоречие: единственный человек, от которого я зависел, был тем, чьего появления я опасался больше всего.</p><p>Несколько раз он меня избивал.</p><p>Я не хочу вспоминать подробности. Да и не уверен, что помню их правильно. В голове остались отдельные ощущения, обрывки происходящего и боль, которая потом ещё долго напоминала о себе. Особенно разбитая губа. Она отзывалась сильнее всего, мешала забыть о собственном теле даже тогда, когда я старался не обращать на него внимания. Я мог думать о чём угодно, возвращаться к своим вопросам, пытаться найти объяснение происходящему, но стоило пошевелиться или заговорить, как воспоминание снова становилось физическим.</p><p>Я не понимал, за что именно он это делал. Не знал, чего от меня добивается и чего ждёт в ответ. Но постепенно перестал искать объяснение в его действиях. Вместо этого я начал искать его в себе.</p><p>Может быть, так и должно было быть. Может быть, именно так выглядит наказание, когда оно наконец перестаёт быть абстрактной идеей и приобретает человеческое лицо. Я столько времени рассуждал о вине, суде, расплате, искуплении. Столько времени пытался придумать систему, в которой каждое моё преступление получило бы соответствующее наказание. И теперь, когда я оказался в ситуации, где не мог ничего решать, мне почему-то стало легче поверить, что всё происходящее имеет смысл.</p><p>Я ведь сам этого хотел.</p><p>Не подвал. Не этого человека. Не его молчание и не страх перед каждым открыванием двери. Но я хотел наказания. Хотел, чтобы кто-то наконец вынес приговор, чтобы моя вина перестала быть бесконечным внутренним спором и превратилась во что-то определённое. Хотел перестать быть одновременно обвиняемым, судьёй и исполнителем собственного приговора.</p><p>И теперь мне казалось, что я получил именно это.</p><p>Потом я понял: это оно и есть.</p><p>То, чего я хотел.</p><p>Мне потребовалось совсем немного времени, чтобы перепутать собственное желание быть наказанным с правом другого человека причинять мне боль. Чтобы принять чужую жестокость за справедливость, а беспомощность — за заслуженное положение вещей. Я не знал, что происходит за пределами подвала, не знал, что будет дальше, не мог даже определить, сколько ещё продлится моё заточение. Но у меня уже появилось объяснение.</p><p>И оно было гораздо страшнее отсутствия объяснений.</p><p>Потому что, если это действительно наказание, значит, я сам должен был его заслужить.</p><p>Потом я начал замечать, что что-то изменилось.</p><p>Не сразу. Время здесь вообще перестало быть чем-то надёжным. Я не мог сказать, сколько прошло с момента нашего последнего разговора, сколько раз он появлялся и сколько раз я просто не замечал его отсутствия. Дни слипались в одну бесконечную последовательность, в которой почти ничего не происходило. Но даже в ней постепенно обозначилась разница.</p><p>Он стал приходить реже.</p><p>Поначалу я пытался найти в этом какое-то объяснение. Может быть, он занят. Может быть, что-то происходит снаружи. Может быть, они наконец получили то, чего хотели, и теперь осталось только дождаться, пока всё закончится. Я продолжал искать закономерность, потому что иначе пришлось бы признать, что никакой закономерности может не быть.</p><p>Я помнил его слова о богатых родителях. Он произнёс их так, будто этим уже всё объяснил. Будто моя фамилия, семейное положение и предполагаемое состояние близких автоматически превращали меня в человека, за которого обязательно захотят заплатить. Я не знал, насколько он был уверен в своих предположениях, но теперь мне казалось, что именно на них и держалось его первоначальное отношение ко мне.</p><p>А потом что-то пошло не так.</p><p>Я не знал, что именно. Не знал, пытались ли они связаться с кем-то, получили ли ответ или вообще предпринимали что-нибудь после моего исчезновения. У меня не было доступа к происходящему за пределами этого помещения. Оставалось только замечать перемены в человеке, который иногда появлялся передо мной, и пытаться угадать их причину.</p><p>Он больше не выглядел заинтересованным. Не пытался добиться от меня чего-то, не задавал вопросов с прежним раздражением, не проявлял особенного желания разговаривать. Иногда мне казалось, что он даже забывал о моём присутствии, пока не оказывался рядом. Я перестал быть для него человеком, от которого чего-то ожидали. Скорее, я превратился в неприятную обязанность, которую почему-то всё ещё приходилось выполнять.</p><p>Возможно, они поняли, что никакой пользы от меня не будет. Что за меня не заплатят столько, сколько они рассчитывали, что я не представляю той ценности, которую мне приписали в самом начале. Я не мог знать наверняка, но постепенно эта мысль перестала казаться предположением.</p><p>И тогда возникал другой вопрос: что теперь?</p><p>Я не думал, что они собираются меня отпустить. Но и убивать меня, похоже, не собирались. Это было бы слишком серьёзным последствием для людей, которые изначально рассчитывали получить от моего исчезновения какую-то выгоду. Я не знал, что они собирались делать дальше, и не мог даже представить, сколько ещё времени мне придётся оставаться здесь.</p><p>Странно, но их равнодушие пугало меня не меньше прежней жестокости. Пока они чего-то хотели от меня, у происходящего хотя бы сохранялась какая-то направленность. Я мог пытаться понять их намерения, искать причины, угадывать, что от меня требуется. Теперь же даже это исчезало. Я оказался в положении, в котором от меня больше ничего не зависело и при этом никто особенно не интересовался тем, что со мной будет.</p><p>Я снова пытался найти в происходящем смысл. Наверное, привычка. Даже здесь, даже после всего, что случилось, я продолжал искать объяснение, которое позволило бы собрать отдельные события в последовательную историю. Но чем дольше я думал, тем очевиднее становилось: им не нужно было моё раскаяние. Им не требовалось, чтобы я осознал какую-то истину, признал вину или изменился. Я просто оказался человеком, которого они зачем-то забрали, а теперь не знали, что с ним делать.</p><p>И впервые мне стало по-настоящему противно от мысли, что я так старательно пытался придать этому происходящему значение.</p><p>Я хотел, чтобы кто-нибудь вынес мне приговор. Хотел, чтобы моя жизнь наконец получила окончательную оценку, чтобы вся накопленная вина обрела форму и перестала бесконечно разрастаться внутри меня. Я почти убедил себя, что происходящее имеет отношение ко мне, к моим поступкам, к моей внутренней испорченности. Но для них ничего этого не существовало.</p><p>Моя вина была им безразлична.</p><p>Моя вера была им безразлична.</p><p>Я сам был им безразличен.</p><p>И, наверное, именно тогда я окончательно понял, насколько ошибался. Чужая жестокость не становилась справедливостью только потому, что я заранее согласился считать себя виновным. Я не получал никакого ответа на свои вопросы. Не приближался к Богу. Не искупал ничего. Всё, что происходило со мной, оставалось чужим решением, которому я не мог придать благородный смысл одним лишь собственным желанием.</p><p>Мне было страшно. Я всё ещё не знал, что будет дальше, и не мог заставить себя поверить, что когда-нибудь вернусь домой. Но теперь, когда я думал о возможном конце, мне уже не хотелось искать в нём наказание.</p><p>Я хотел увидеть свою квартиру. Услышать музыку из собственных колонок. Открыть компьютер и обнаружить там тот самый документ с девятью пунктами, который теперь казался чем-то совершенно нелепым и одновременно бесконечно далёким. Хотел закончить картины. Хотел снова разговаривать с людьми, которых любил. Хотел хотя бы один раз проснуться и не пытаться понять, за что мне всё это.</p><p>Я не знал, заслуживаю ли всего перечисленного. Но впервые мне показалось, что этот вопрос вообще не должен иметь значения.</p><p>Я просто хотел жить.</p>"},{"n":6,"title":"CHAPTER VI — AFTER DARK","epi":"Носите бремена друг друга, и таким образом исполните закон Христов.","epiBy":"— Галатам 6:2","html":"<p class=\"first\">Дома было тихо. Ужасно тихо.</p><p>Я долго стоял у самого входа, даже после того, как дверь за моей спиной уже захлопнулась. Смотрел куда-то прямо перед собой, не осматривая квартиру, а словно пытался увидеть что-то сквозь все предметы. Собственная квартира казалась чужой. Вроде бы те же стены, та же мебель, все вещи на своих местах, но я никак не мог распознать знакомое пространство, собрать его в единую картину. Всё выглядело правильным по отдельности, но вместе почему-то не складывалось. Будто кто-то аккуратно воспроизвёл мою жизнь по памяти, не понимая, для чего нужны отдельные предметы и как ими пользоваться.</p><p>Я знал, где нахожусь. Узнавал мебель, обои, знакомые пятна на полу. Но между этим знанием и ощущением дома пролегала какая-то неприятная дистанция. Я вернулся в собственную квартиру, однако чувство возвращения так и не появилось.</p><p>Я снял кофту, оставил её на обувнице и прошёл к кровати. Не помню, зачем. Может, просто хотелось лечь. Ноги почти не слушались, голова казалась каменной, а любое движение требовало столько усилий, что сил на что-либо ещё практически не оставалось. Даже простые действия приходилось сначала обдумывать, словно я заново учился ими пользоваться. Снять обувь. Дойти до комнаты. Сесть. Каждое из них почему-то требовало отдельного решения.</p><p>Опустившись на пол и прислонившись спиной к кровати, я долго смотрел на свои руки.</p><p>Да, они были самыми обычными и точно принадлежали мне. Я мог узнать каждую линию вен, каждую татуировку, каждый волосок, но всё равно испытывал какое-то неприятное отчуждение. В какой-то момент мне даже показалось, что, если я попробую соединить ладони, у меня не получится. Будто между намерением и движением тоже появилось какое-то расстояние. Я смотрел на пальцы и пытался заставить себя пошевелить ими, хотя прекрасно понимал, что они и так находятся под моим контролем. Или должны находиться.</p><p>На коже остались следы, которые я пока не хотел рассматривать. Некоторые места болели даже без прикосновения, другие отзывались только тогда, когда я случайно менял положение. Я не мог определить, где заканчивается обычная усталость и начинается боль. Всё тело казалось одним большим, плохо собранным механизмом, который продолжал работать исключительно по инерции.</p><p>Я слушал гул холодильника, едва различимый шум с улицы, собственное сбитое дыхание. Раньше я никогда не обращал внимания на подобные вещи, но теперь каждый звук существовал отдельно, наслаивался на остальные, становился слишком отчётливым и тяжёлым. Холодильник гудел так, будто находился прямо за моей спиной. Где-то за окном проехала машина, и я невольно напрягся, прежде чем успел понять, что именно услышал.</p><p>Мне не нравилось, как я реагировал на обычные звуки. Не нравилось, что собственная квартира больше не казалась безопасной автоматически. Я должен был знать это место. Должен был чувствовать себя здесь спокойно. Но стоило чему-нибудь скрипнуть или стукнуть, как внимание мгновенно переключалось на источник звука. Я прислушивался, ждал продолжения, пытался понять, что произойдёт дальше.</p><p>Ничего не происходило.</p><p>И от этого легче не становилось.</p><p>Хотелось отвлечься, но сил не было даже на то, чтобы перестать думать. Мысли жужжали в голове, цеплялись одна за другую, возвращались к одному и тому же. Я пытался переключиться, но не мог удержать внимание ни на чём достаточно долго. Начинал думать об одном, внезапно обнаруживал себя посреди совершенно другой мысли, а потом снова возвращался к тому, от чего пытался отвлечься. Иногда я терял саму нить рассуждения и несколько секунд просто смотрел в одну точку, не понимая, о чём думал до этого.</p><p>Это становилось невыносимым.</p><p>Мне ужасно не хотелось оставаться одному.</p><p>Эта мысль показалась мне унизительной. Я всегда считал, что должен справляться со своими проблемами самостоятельно, не перекладывать их на других. Но сейчас даже не мог представить, как проведу остаток вечера — или ночи? — в этой тишине. Не знал, что делать с собой, куда деть собственные мысли и как вообще продержаться до утра. Раньше одиночество было привычным состоянием, иногда даже необходимым. Теперь оно ощущалось иначе. Не как возможность побыть наедине с собой, а как необходимость оставаться один на один с тем, от чего я не мог избавиться.</p><p>Я взял телефон. Какое-то время тупо смотрел на экран, пытаясь вдуплить, сколько времени прошло с последнего момента, который я действительно помнил. Получилось не сразу. Больше недели.</p><p>Я несколько раз перечитал цифры, словно они могли измениться, если посмотреть внимательнее. Время вообще перестало казаться чем-то надёжным. Я не мог уверенно сказать, сколько длились отдельные события, когда именно спал, когда просыпался и сколько раз терял ощущение происходящего. В памяти оставались куски, между которыми зияли провалы. Иногда я пытался заполнить их догадками, но потом уже не мог отличить догадки от воспоминаний.</p><p>Потом я открыл нашу переписку. Он был онлайн.</p><p>Я долго смотрел на поле ввода, пытаясь подобрать слова и составить хотя бы сколько-нибудь внятное сообщение. Хотел объяснить, что со мной происходит, но не понимал, с чего начать. Как уместить всё это в несколько предложений? Да и нужно ли? Я не был уверен, что смогу рассказать ему правду. Не потому, что хотел скрыть произошедшее, а потому, что сам пока не знал, что именно должен рассказывать. Некоторые вещи не складывались даже в моей голове.</p><p>В итоге получилось только:</p><p>«мне очень плохо. ты мог бы приехать? я не знаю, что мне делать».</p><p>Он не стал ничего спрашивать. Просто согласился приехать. Может быть, уже понял, что я не стал бы обращаться к нему с такой просьбой без причины. Что сейчас мне не нужны вопросы и объяснения — мне просто нужно, чтобы он был рядом.</p><p>Я продолжал смотреть на переписку ещё какое-то время, хотя ответ уже получил. Мне хотелось убедиться, что он действительно написал это, что сообщение не исчезнет, если я отведу взгляд. Глупо. Но за последние дни я, кажется, слишком часто обнаруживал, что привычные вещи не гарантируют мне ничего.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Я совсем забыл, что у него остались ключи. Может, это и к лучшему. Когда я услышал, как поворачивается замок, то был благодарен богу хотя бы за то, что мне не придётся вставать.</p><p>Он вошёл так тихо, что на мгновение мне показалось, будто звук открывающейся двери был очередной галлюцинацией. Я даже повернул голову в сторону прихожей, чтобы проверить. Увидев его, невольно расплылся в усталой улыбке.</p><p>Он посмотрел на меня и нахмурился. Не со злости, не с раздражением — скорее так, как смотрят на что-то, что требует особого внимания и сосредоточения. На несколько секунд замер в дверях, словно пытался сопоставить человека, которого видел перед собой, с тем, кого помнил. Потом прикрыл за собой дверь и снял обувь.</p><p>Я следил за каждым его движением. За тем, как он оставил ключи, как оглядел пространство, как наконец направился ко мне. Мне почему-то казалось важным не упустить ни одной детали. Убедиться, что он действительно пришёл, что это не очередная странная игра моего сознания, которое уже несколько дней отказывалось отличать настоящее от воспоминаний.</p><p>Я заметил, что он не торопится. Что смотрит на меня, прежде чем сделать следующий шаг. Наверное, просто не хотел напугать. Но я всё равно следил за ним с каким-то почти болезненным вниманием, будто должен был заранее знать, что он собирается сделать. Даже сейчас, в собственной квартире, мне было трудно перестать ждать следующего движения от другого человека.</p><p>Он остановился рядом и присел передо мной на корточки. Теперь я мог рассмотреть его лицо. Он выглядел обеспокоенным, хотя старался этого не показывать. Взгляд то и дело возвращался к моим рукам, лицу, одежде. Наверное, пытался понять, что именно со мной произошло и насколько сильно я пострадал.</p><p>— Привет, — произнёс он негромко.</p><p>Я хотел ответить что-нибудь нормальное. Спросить, как он добрался, поблагодарить за то, что приехал, сказать, что рад его видеть. В голове даже нашлось несколько подходящих фраз, но ни одна из них так и не добралась до языка.</p><p>Вместо этого я только кивнул.</p><p>Он не стал требовать от меня ответа. Некоторое время просто смотрел на меня, а потом осторожно коснулся моей руки. Я невольно перевёл взгляд на его пальцы. Тёплые. Настоящие. Он был здесь, рядом со мной, и мне не нужно было ничего делать, чтобы удержать его на месте.</p><p>Я вдруг понял, что всё это время ждал именно такого прикосновения. Не потому, что оно могло что-то исправить, а потому, что мне нужно было почувствовать разницу между тем, что происходило тогда, и тем, что происходило сейчас. Но даже знакомая рука не сразу вернула мне ощущение собственного тела. Первые несколько секунд я просто смотрел на его пальцы, пытаясь привыкнуть к тому, что прикосновение может ничего от меня не требовать.</p><p>— Ты давно здесь сидишь?</p><p>Я пожал плечами. Не знал. Время после возвращения домой будто перестало существовать в привычном виде. Могло пройти десять минут, могло несколько часов — я бы не заметил разницы.</p><p>Он, кажется, понял это по моему лицу. Не стал переспрашивать, только немного крепче сжал мою ладонь.</p><p>И почему-то именно тогда я почувствовал, насколько сильно устал.</p><p>До этого я словно держался на чём-то постороннем: на необходимости добраться домой, снять одежду, взять телефон, написать сообщение. Теперь все эти действия закончились, и вместе с ними исчезла последняя причина сохранять хоть какую-то собранность. Я больше не должен был ничего решать. Не должен был объяснять, убеждать, следить за временем. Можно было просто перестать пытаться выглядеть человеком, который способен справиться.</p><p>Он немного подался ко мне, осторожно коснувшись плеча.</p><p>— Давай переберёмся на кровать.</p><p>Я хотел ответить, что справлюсь сам, но даже не был уверен, что смогу подняться без посторонней помощи. Поэтому только кивнул и позволил ему подхватить меня под руку.</p><p>Подняться оказалось сложнее, чем я ожидал. Ноги почти сразу отозвались слабостью, и мне пришлось опереться на его плечо, чтобы не потерять равновесие. Он придержал меня за спину, помогая перенести вес, и не отпускал, пока я наконец не оказался на матрасе.</p><p>Я не любил, когда мне приходилось просить о помощи. Ещё меньше мне нравилось, что сейчас я не мог обойтись без неё даже в такой простой вещи. В голове тут же возникло привычное желание извиниться, сказать, что я просто устал, что скоро приду в себя, что ему не нужно со мной возиться. Но я не произнёс ничего. Даже на оправдания не хватало сил.</p><p>Я медленно устроился на кровати, вытянул ноги и попытался найти положение, в котором тело перестало бы так сильно ныть. Он сел рядом. Некоторое время мы просто молчали, не пытаясь заполнить тишину словами.</p><p>Даже теперь, когда он был рядом, когда мне больше не нужно было сидеть одному на холодном полу, я не мог расслабиться. Слишком многое осталось внутри, слишком многое я пока не мог ни понять, ни объяснить. Я чувствовал напряжение в плечах, замечал, как непроизвольно сжимаются пальцы, и никак не мог заставить себя перестать прислушиваться к квартире.</p><p>Он осторожно коснулся моей щеки. Я прикрыл глаза и чуть повернул голову, невольно прижимаясь к его ладони.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Некоторое время он просто смотрел на меня. Потом его взгляд опустился ниже — к следам на лице, к синякам, которые я успел заметить ещё раньше, но так и не смог заставить себя рассмотреть внимательнее. Он провёл большим пальцем по неповреждённому участку кожи, едва касаясь её, словно боялся причинить мне дополнительную боль.</p><p>Я не двигался. Даже не знал, чего ожидать.</p><p>Наверное, раньше я бы попытался пошутить. Сказал бы что-нибудь едкое о своём внешнем виде, об очередной неудачной попытке стать привлекательнее или о том, что теперь мне придётся заново собирать лицо. Любая глупость, лишь бы не оставлять другому человеку возможность слишком долго смотреть на меня с таким выражением. Но сейчас даже привычная самоирония не пришла на помощь. Я не мог превратить произошедшее в шутку, потому что оно всё ещё находилось слишком близко.</p><p>Он наклонился и оставил короткий поцелуй у моего виска. Потом ещё один — чуть ниже, возле скулы, осторожно обходя болезненные места. В этом не было никакой торопливости. Он будто пытался запомнить, где мне больно, где можно прикоснуться, а где лучше не задерживаться.</p><p>Когда его губы коснулись синяка, я невольно напрягся. Не от боли. Скорее от неожиданности. Я совершенно не представлял, что можно делать с такими вещами. Как на них реагировать. Нужно ли что-то говорить, благодарить, отвечать на эту нежность чем-то равноценным.</p><p>Он продолжил, так же бережно целуя следы на моём лице. Потом опустился чуть ниже, к шее, задержался возле ключицы. Каждый поцелуй был почти невесомым, но я чувствовал их гораздо отчётливее, чем хотел бы. Мне казалось, что вместе с ними наружу проступает что-то, что я слишком долго пытался удерживать внутри.</p><p>Я смотрел на него и не мог понять, почему он так делает.</p><p>Моё тело всё ещё казалось мне чужим. Я видел на нём следы произошедшего и не мог отделить их от воспоминаний. Стоило случайно задеть одно из болезненных мест, как сознание тут же возвращало меня куда-то назад. Иногда достаточно было одного неловкого движения, чтобы на несколько секунд перестать понимать, где я нахожусь. Я знал, что лежу в собственной кровати. Знал, что рядом со мной человек, которому доверяю. Но знание не всегда успевало за ощущениями.</p><p>Сейчас вместо этого прикосновения оставались здесь, в настоящем. Тёплые губы, знакомый запах, его рука на моей щеке.</p><p>Он не пытался ничего исправить. Не говорил, что всё уже позади, не убеждал меня, что скоро станет легче. Просто целовал меня там, где было больно, и от этого почему-то хотелось плакать сильнее, чем от всего остального.</p><p>Возможно, потому, что я слишком привык воспринимать собственное тело как свидетельство своей вины. Как нечто, на чём должны были остаться отметины, подтверждающие, что со мной действительно произошло что-то заслуженное. И теперь мне было трудно понять, почему другой человек смотрит на эти следы не с отвращением, не с осуждением, а с такой осторожностью.</p><p>Я опустил взгляд. Горло неприятно сжалось, а дыхание снова стало неровным. Мне хотелось попросить его не останавливаться, но произнести это вслух оказалось почти невозможно. Я боялся, что если начну говорить, то не смогу закончить.</p><p>Вместо этого я осторожно накрыл его ладонь своей.</p><p>Он поднял голову и посмотрел на меня. Я попытался улыбнуться, но вышло, кажется, довольно жалко. Он ничего не сказал, только снова приблизился и поцеловал меня — теперь уже в губы. Очень мягко, без настойчивости, оставляя мне возможность самому решить, насколько близко я готов его подпустить.</p><p>Я ответил не сразу. Сначала просто лежал, чувствуя его прикосновение, а потом немного подался навстречу.</p><p>Наверное, именно тогда я впервые за весь вечер перестал пытаться понять, что со мной не так. Не потому, что нашёл ответ или вдруг почувствовал себя лучше. Просто на несколько секунд этот вопрос перестал иметь значение.</p><p>Я не знал, заслужил ли такую заботу. Не знал, как принять её и что вообще делать с человеком, который смотрел на меня так, будто я всё ещё оставался кем-то цельным, а не набором повреждений и воспоминаний.</p><p>Но мне хотелось, чтобы он остался.</p><p>И впервые за долгое время я позволил себе не искать для этого никакого оправдания.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Я лежал в темноте комнаты и смотрел в потолок.</p><p>Не знаю, сколько времени прошло с тех пор, как мы перестали целоваться. Может, несколько минут, может, гораздо больше. Он оставался рядом, и я чувствовал его присутствие, но не мог заставить себя повернуться. Мне казалось, что любое движение нарушит хрупкое равновесие, в котором я наконец смог немного полежать спокойно.</p><p>Сон не приходил. Стоило закрыть глаза, как сознание начинало возвращать меня туда, куда я совершенно не хотел возвращаться. Отдельные обрывки воспоминаний возникали без всякой последовательности: чужие голоса, лица, ощущения, собственная беспомощность. Я не всегда мог понять, действительно ли помню происходившее или просто пытаюсь восстановить то, что осталось за пределами памяти. Некоторые моменты расплывались, другие, наоборот, казались до ужаса отчётливыми. И чем сильнее я пытался собрать всё в одну историю, тем больше запутывался.</p><p>Особенно мучительным было то, что я не мог доверять даже собственной памяти. Я помнил отдельные вещи, но не всегда мог определить, в какой последовательности они произошли. Иногда мне казалось, что я что-то забыл, иногда — что придумал недостающий фрагмент, чтобы история наконец обрела хоть какую-то форму. Я хотел знать всё до последней подробности, хотя одновременно боялся узнать больше.</p><p>Я снова и снова прокручивал произошедшее, словно где-то внутри обязательно должна была обнаружиться ошибка. Что-то, что я мог сделать иначе. Что-то, что позволило бы избежать всего этого. Я знал, насколько бессмысленно искать подобные ответы сейчас, но от этого мысли не становились тише.</p><p>В какой-то момент я поймал себя на том, что почти не чувствую собственного тела. Оно лежало на матрасе, тяжёлое и уставшее, но воспринималось как нечто отдельное от меня. Я ощущал ткань под пальцами, одеяло на ногах, неприятную скованность в мышцах, однако всё это будто происходило на некотором расстоянии. Даже боль не всегда казалась настоящей. Иногда я просто замечал, что мне больно, и только потом понимал, где именно.</p><p>Я повернул голову. В темноте едва различался силуэт человека рядом со мной. Этого оказалось достаточно, чтобы вспомнить, что я не один.</p><p>Странное чувство. Ещё несколько часов назад я не мог представить, как переживу вечер в одиночестве, а теперь, когда он приехал, всё равно не знал, как перестать бояться. Его присутствие помогало удерживаться в настоящем, но не могло отменить того, что уже случилось. Я понимал это и, кажется, впервые не пытался требовать от него невозможного.</p><p>При этом мне было страшно даже от мысли, что он может ненадолго отойти. Я не хотел удерживать его рядом, не хотел превращать собственную беспомощность в обязанность другого человека. Но стоило представить, что я снова останусь один в этой комнате, как внутри поднималась почти детская паника. Мне было стыдно за неё. Я уже знал, что не могу рассчитывать на постоянное присутствие другого человека, но пока не представлял, как обходиться без него.</p><p>Я хотел сказать что-нибудь. Поблагодарить за то, что он приехал, за его руки, за поцелуи, за то, что не задавал лишних вопросов. Но все эти слова казались слишком маленькими. Ни одно из них не могло вместить то, насколько сильно я нуждался в нём сейчас.</p><p>Я смотрел в пустоту перед собой, крепче прижимая к себе своего спящего ангела. Он, кажется, уже задремал, устроившись рядом, и я старался лишний раз не шевелиться, чтобы не потревожить его. Вдыхал запах его волос, медленно и почти машинально перебирая их пальцами. Повторял одно и то же движение, снова и снова, словно мог таким образом убедить себя, что всё происходящее сейчас действительно настоящее.</p><p>Но даже здесь, в тепле собственной постели, рядом с человеком, которого я так отчаянно хотел видеть, я всё равно возвращался в тот подвал.</p><p>Стоило мыслям на секунду ослабить хватку, как воспоминания снова занимали всё пространство. Я пытался удержать внимание на его дыхании, на мягкости волос под пальцами, на тяжести его тела рядом со мной. На чём угодно, что принадлежало настоящему. Но прошлое не исчезало. Оно просто ждало, пока я перестану за ним следить.</p><p>И дело было не только в воспоминаниях. Я вдруг обнаружил, что больше не умею просто лежать в темноте. Раньше она была всего лишь отсутствием света, теперь же в ней постоянно что-то мерещилось. Любой шорох заставлял меня прислушиваться, любой случайный звук за окном возвращал внимание к двери. Я не мог заставить себя перестать ждать, хотя прекрасно понимал, что здесь никто не должен появиться.</p><p>Поэтому я продолжал гладить его по голове и смотреть в темноту.</p><p>Ночь тянулась медленно. Я лежал, слушал редкие звуки за окном и пытался не следить за каждым шорохом. Иногда мне казалось, что я начинаю проваливаться в сон, но стоило сознанию немного ослабить хватку, как я снова возвращался к воспоминаниям. Несколько раз я почти засыпал, но каждый раз просыпался с ощущением, что пропустил что-то важное. Будто сон был не отдыхом, а очередной потерей контроля, на которую я пока не мог согласиться.</p><p>Я не знал, сколько ещё продлится это состояние. Не знал, когда смогу спокойно закрывать глаза, не ожидая, что прошлое снова окажется ближе настоящего. Не знал даже, что именно теперь считать нормальной жизнью.</p><p>Но рядом был он. Я чувствовал его дыхание, тепло его тела и продолжал перебирать пальцами волосы, пока ночь медленно не растворялась в предрассветной темноте. Я всё ещё боялся закрыть глаза. Просто теперь мне не приходилось встречать эту ночь одному.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Я не заметил, когда именно начало светать.</p><p>В какой-то момент темнота за окном стала немного прозрачнее, очертания предметов проступили из неё, а на потолке появилось бледное пятно утреннего света. Я всё ещё лежал в той же позе, почти не двигаясь, и продолжал перебирать пальцами волосы человека рядом со мной. Кажется, я несколько раз ненадолго проваливался в сон, но каждый раз возвращался обратно так резко, будто меня кто-то звал.</p><p>Он спал.</p><p>Я повернул голову и посмотрел на него. Во сне его лицо выглядело спокойнее, чем вечером. Не было того напряжённого выражения, с которым он смотрел на меня, когда только вошёл в квартиру. Я вдруг подумал, что он, наверное, устал. Что ему тоже пришлось провести эту ночь не так, как хотелось бы. И что, возможно, он вообще не собирался оставаться до утра, но я даже не спросил.</p><p>Мне стало неловко.</p><p>Я осторожно убрал руку, стараясь не потревожить его, и попытался устроиться удобнее. Тело тут же напомнило о себе. Боль не была одинаковой: где-то тянуло, где-то неприятно отзывалось даже небольшое движение. Я медленно выдохнул и снова замер, ожидая, пока ощущения немного утихнут.</p><p>Сон всё равно не возвращался.</p><p>Я смотрел на потолок и пытался вспомнить, каким было моё последнее нормальное утро. Не просто утро до похищения, а именно то состояние, когда просыпаешься и не нуждаешься в нескольких минутах, чтобы понять, где находишься. Когда можно потянуться, встать, пройти на кухню, включить чайник и не задумываться над тем, что сейчас произойдёт. Мне казалось, что я должен помнить такие вещи. Но чем дольше пытался, тем сильнее они превращались в какую-то чужую картинку.</p><p>Раньше я не замечал, насколько много в жизни происходит автоматически. Теперь каждое действие требовало моего участия, а я не всегда мог его обеспечить.</p><p>Он пошевелился рядом, и я сразу повернул голову.</p><p>— Ты не спал?</p><p>Голос спросонья прозвучал хрипло. Я не сразу ответил, потому что сам не знал, что именно сказать.</p><p>— Немного.</p><p>Это было не совсем ложью. Скорее, попыткой назвать сном то, что на него походило меньше всего.</p><p>Он приподнялся, посмотрел на меня, потом перевёл взгляд на окно. Несколько секунд молчал, окончательно просыпаясь.</p><p>— Ты всю ночь так лежал?</p><p>Я пожал плечами.</p><p>— Не знаю. Наверное.</p><p>Он снова посмотрел на меня. Я заметил, что его взгляд задержался на моём лице, потом опустился к рукам. Наверное, он пытался понять, насколько мне сейчас плохо. Я бы и сам хотел это знать.</p><p>— Ты вообще спал?</p><p>— Я же сказал, немного.</p><p>Мне не понравилось, как резко прозвучал ответ. Я отвёл глаза, чувствуя знакомое раздражение, которое обычно появлялось, когда меня спрашивали о чём-то, на что я не мог дать нормального ответа. Он не сделал ничего плохого. Просто спросил. Но мне уже хотелось закрыть эту тему, прежде чем она успела стать разговором.</p><p>Он не стал спорить.</p><p>Некоторое время мы лежали молча. Я слышал, как он дышит, как шевелится одеяло, когда он устраивается поудобнее. Всё это было настолько обычным, что почти казалось неправильным. Слишком много вещей продолжало происходить так, будто ничего не изменилось.</p><p>— Прости, что разбудил, — наконец произнёс я.</p><p>Он повернулся ко мне.</p><p>— Ты меня не разбудил.</p><p>— Всё равно. Ты, наверное, хотел поспать дома.</p><p>— Я сам решил остаться.</p><p>Я кивнул, но этого оказалось недостаточно, чтобы избавиться от ощущения, что я доставил ему неудобства. Мне хотелось объяснить, что я не собирался просить его проводить со мной всю ночь, что просто не знал, к кому ещё обратиться. Но чем больше я об этом думал, тем отчётливее понимал, насколько жалко это прозвучит.</p><p>— Я не хотел, чтобы тебе приходилось...</p><p>Я замолчал. Не смог подобрать окончание.</p><p>Он немного приподнялся на локте.</p><p>— Тебе сейчас не нужно извиняться за то, что тебе плохо.</p><p>Я посмотрел на него. Вроде бы простая фраза, ничего особенного. Но я не знал, что с ней делать.</p><p>Мне хотелось возразить. Сказать, что дело не в этом, что я прекрасно пони
