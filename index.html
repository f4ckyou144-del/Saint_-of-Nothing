<!doctype html>
<html lang="ru" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAINT OF NOTHING</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Forum&family=Alegreya:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;1,400&family=PT+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#111821;--panel:#1a2430;--line:rgba(151,164,178,.28);--gold:#b56a61;--gold2:#d8b5ab;--txt:#e2e4e2;--dim:#9aa8b5;--red:#ad514c;--glow:radial-gradient(ellipse 85% 65% at 50% 0,#1d2b36,transparent 70%);
  --fs:18px;--lh:1.5;--ff:Alegreya,serif}
html[data-theme="sepia"]{--bg:#e9e6e1;--panel:#dad8d4;--line:rgba(76,82,90,.26);--gold:#96524d;--gold2:#713c3b;--txt:#29323b;--dim:#65717d;--red:#923d42;--glow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tap:focus,.btn:focus,.seg button:focus,.toc button:focus{outline:none}
.btn:focus-visible,.seg button:focus-visible,.toc button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--glow),var(--bg);color:var(--txt);font-family:"Alegreya Sans",sans-serif;display:flex;flex-direction:column;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
.bar{flex:none;position:relative;border-bottom:1px solid var(--line);z-index:5}
.head{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:10px 16px}
.kick{font:12px Forum,serif;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.btn{height:34px;min-width:34px;border:1px solid var(--line);background:var(--panel);color:var(--gold);font:13px Forum,serif;letter-spacing:.18em;text-transform:uppercase;padding:0 12px;cursor:pointer;flex:none}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.pop{position:absolute;top:100%;right:max(16px,calc(50% - 364px));margin-top:8px;width:290px;max-width:calc(100vw - 32px);max-height:75vh;overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.45);padding:10px 0;z-index:20}
.pop[hidden]{display:none}
.toc .part{font:11px Forum,serif;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);padding:10px 18px 4px}

.toc button{
  display:block;width:100%;text-align:left;background:none;border:0;padding:7px 18px;cursor:pointer;
  font-family: var(--ff); 
  font-size: 16px;
  line-height: 1.3;
}
.toc button small{display:block;font:11px Forum,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.toc button:hover,.toc button.on{color:var(--gold2);background:rgba(181,106,97,.11)}

.set{padding:6px 18px 10px}
.set .row{margin:10px 0}
.set .lab{font:11px Forum,serif;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;border:1px solid var(--line);background:transparent;padding:6px 8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
.seg button.on{border-color:var(--gold);color:var(--gold2);background:rgba(181,106,97,.12)}

.seg button svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  transition: transform 0.3s;
}
.seg button:hover svg {
  transform: scale(1.1) rotate(10deg);
}

.set input[type=range]{width:100%;accent-color:var(--gold)}
.stage{flex:1;position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:28px 0 0 0;margin:0 auto;overflow:hidden;width:var(--pw)}
.flow{height:100%;column-width:var(--pw);column-gap:var(--gap);column-fill:auto;transition:transform .35s ease;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);color:var(--txt)}
.flow.noanim{transition:none}
.flow p{margin:0;text-indent:1.6em;hyphens:auto;text-align:justify;orphans:2;widows:2}
.flow p.first{text-indent:0}
.flow p.first::first-letter{float:left;font-family:Prata,serif;font-size:3.3em;line-height:.8;padding:.07em .14em 0 0;color:var(--red)}
.ch-head{break-inside:avoid;break-after:column;height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;margin:0;padding-bottom:6vh}
.ch-num{font:13px Forum,serif;letter-spacing:.35em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.ch-title{font-family:Prata,serif;font-weight:400;font-size:clamp(36px,6vw,54px);line-height:1.15;color:var(--gold2);margin:0 0 26px}
.ch-title::after{content:"";display:block;width:120px;height:1px;margin:26px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.epi{max-width:420px;margin:0 auto 26px;font-family:Alegreya,serif;font-style:italic;font-size:.92em;line-height:1.6;color:var(--txt);opacity:.85}
.epi b{display:block;font-weight:400;font-style:normal;font-family:Alegreya,serif;font-size:.95em;text-align:right;color:var(--dim);margin-top:6px}
.note{margin:.8em 0 1em 1.6em;padding-left:16px;border-left:1px solid var(--line);font-style:italic;break-inside:avoid}

/* --- Декоративный разделитель в конце главы --- */
.end{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:2.9em 0 2em;
  break-inside:avoid;
}
.end .mark{
  width:44px;
  height:44px;
  display:block;
  color:var(--gold2);
  opacity:.72;
  transform-origin:center;
  animation: crossBlink 6s infinite ease-in-out;
  filter:drop-shadow(0 0 2px rgba(181,106,97,.18));
}
.end .mark line{
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
}
@keyframes crossBlink{
  0%,100%{opacity:.24;transform:scale(.97);filter:drop-shadow(0 0 0 rgba(181,106,97,0))}
  48%,52%{opacity:1;transform:scale(1.035);filter:drop-shadow(0 0 11px rgba(181,106,97,.63)) brightness(1.26)}
}

.tap{position:absolute;top:0;bottom:0;width:22%;z-index:2;cursor:pointer;background:none;border:0;padding:0}
.tap.l{left:0}.tap.r{right:0}
.foot{flex:none;display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto;padding:10px 16px 14px}
.foot .btn{font-size:18px;letter-spacing:0;padding:0}
.meta{flex:1;text-align:center;font:12px Forum,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- ИНТЕРАКТИВНАЯ ПОЛОСА ПРОГРЕССА --- */
.prog{
  height:14px;
  background:linear-gradient(transparent 6px, var(--line) 6px, var(--line) 8px, transparent 8px);
  position:relative;
  margin-top:0px;
  cursor: pointer;
  touch-action: none;
}
.prog i{
  position:absolute; 
  left:0; 
  top:6px; 
  height:2px; 
  background:var(--gold); 
  width:0; 
  pointer-events: none;
  z-index:2;
}
.prog i::after {
  content: "";
  position: absolute;
  right: -4px; 
  top: 1px;
  transform: translateY(-50%) rotate(45deg);
  width: 6px;
  height: 6px;
  background: var(--gold2);
  border: 1px solid var(--gold);
  box-shadow: 0 0 4px var(--gold);
  transition: box-shadow 0.3s, background 0.3s;
}
.prog:hover i::after, .prog.dragging i::after {
  box-shadow: 0 0 8px var(--gold2), 0 0 12px var(--gold);
  background: #fff;
}
.ill{margin:0;height:100%;break-inside:avoid;break-after:column;display:flex;align-items:center;justify-content:center}.ill .frame{position:relative;display:inline-block;padding:14px}.ill .frame::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--gold),var(--gold)) left 0 top 0/34px 2px,linear-gradient(var(--gold),var(--gold)) left 0 top 0/2px 34px,linear-gradient(var(--gold),var(--gold)) right 0 top 0/34px 2px,linear-gradient(var(--gold),var(--gold)) right 0 top 0/2px 34px,linear-gradient(var(--gold),var(--gold)) left 0 bottom 0/34px 2px,linear-gradient(var(--gold),var(--gold)) left 0 bottom 0/2px 34px,linear-gradient(var(--gold),var(--gold)) right 0 bottom 0/34px 2px,linear-gradient(var(--gold),var(--gold)) right 0 bottom 0/2px 34px,radial-gradient(circle,var(--gold2) 0 2px,transparent 3px) left -2px top -2px/8px 8px,radial-gradient(circle,var(--gold2) 0 2px,transparent 3px) right -2px top -2px/8px 8px,radial-gradient(circle,var(--gold2) 0 2px,transparent 3px) left -2px bottom -2px/8px 8px,radial-gradient(circle,var(--gold2) 0 2px,transparent 3px) right -2px bottom -2px/8px 8px;background-repeat:no-repeat}.ill img{display:block;margin:0 auto;max-width:100%;width:auto;height:auto;max-height:calc(100vh - 220px);box-shadow:0 0 0 1px var(--line)}
.ill.inline{height:auto;display:block;text-align:center;break-after:auto;margin:1em 0 1.1em}
.ill.inline img{max-height:calc((100vh - 220px) * .5)}

.scene-break{display:flex;align-items:center;justify-content:center;margin:1.3em 0 1.5em;color:var(--gold2);font-family:Georgia,serif;font-size:30px;line-height:1;break-inside:avoid}
.scene-break span{letter-spacing:.34em;font-weight:bold;white-space:nowrap}
.ch-title{font-size:clamp(25px,4vw,39px);overflow-wrap:anywhere;padding:0 8px}

.subtitle{
  font-family:Prata,serif;
  font-size:1.15em;
  letter-spacing:.06em;
  color:var(--gold2);
  margin:1.8em 0 .6em;
  text-indent:0;
  break-after:avoid;
  text-align:left;
}
.subtitle::before{
  content:"";
  display:block;
  width:48px;height:1px;
  margin-bottom:.5em;
  background:linear-gradient(90deg,var(--gold),transparent);
}
.toc button.subchapter{padding:5px 18px 5px 34px;font-size:14px;color:var(--dim);border-left:1px solid var(--line);margin-left:18px;width:calc(100% - 18px)}
.toc button.subchapter:hover{color:var(--gold2)}
.toc .chapter-entry{display:flex;align-items:stretch;position:relative}
.toc .chapter-entry > button.chapter-link{flex:1;width:auto;min-width:0}
.toc .chapter-toggle{flex:none;width:38px;display:flex;align-items:center;justify-content:center;padding:0;border-left:1px solid var(--line);color:var(--gold2);font-size:18px;letter-spacing:0}
.toc .chapter-toggle .chevron{display:inline-block;transition:transform .2s ease}
.toc .chapter-toggle[aria-expanded="true"] .chevron{transform:rotate(90deg)}
.toc .subchapter-list[hidden]{display:none}



/* Атмосферная звуковая панель: тёмная, сдержанная, в цветах читалки */
.music-player[hidden]{display:none!important}
.music-player{position:relative;flex:none;width:min(calc(100% - 24px),728px);margin:0 auto 3px;padding:12px 16px 11px;display:flex;align-items:center;gap:13px;z-index:4;background:linear-gradient(122deg,rgba(181,106,97,.10),transparent 44%),var(--panel);border:1px solid var(--line);box-shadow:0 7px 28px rgba(0,0,0,.18)}
.music-player::before{content:"";position:absolute;left:13px;right:13px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8;pointer-events:none}
.music-player button{appearance:none;flex:none;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s}
.music-player button:focus-visible,.music-player input:focus-visible,.track-launch button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
#musicToggle{width:43px;height:43px;border:1px solid var(--gold);border-radius:50%;background:rgba(181,106,97,.10);color:var(--gold2);font-size:19px;line-height:1;box-shadow:inset 0 0 0 4px rgba(181,106,97,.045)}
#musicToggle:hover{background:rgba(181,106,97,.22);transform:scale(1.04)}
.music-details{min-width:0;flex:1;display:flex;flex-direction:column;gap:7px}
.music-info{display:flex;align-items:center;gap:10px;min-width:0}
.music-ident{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.music-eyebrow{font:10px Forum,serif;letter-spacing:.23em;color:var(--dim);text-transform:uppercase}
.music-name{font:15px Forum,serif;letter-spacing:.025em;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-wave{height:22px;display:flex;align-items:center;gap:3px;opacity:.65;flex:none}
.music-wave i{display:block;width:2px;height:6px;background:var(--gold);border-radius:2px}
.music-wave i:nth-child(2),.music-wave i:nth-child(6){height:13px}
.music-wave i:nth-child(3),.music-wave i:nth-child(5){height:19px}
.music-wave i:nth-child(4){height:9px}
.music-player.is-playing .music-wave i{animation:sonWave .85s ease-in-out infinite alternate}
.music-player.is-playing .music-wave i:nth-child(2n){animation-delay:-.43s}
.music-player.is-playing .music-wave i:nth-child(3n){animation-delay:-.2s}
@keyframes sonWave{from{transform:scaleY(.42)}to{transform:scaleY(1.15)}}
@media(prefers-reduced-motion:reduce){.music-player.is-playing .music-wave i{animation:none}}
.music-progress-row{display:flex;align-items:center;gap:12px;min-width:0}
.music-clock{flex:none;font:11px Forum,serif;letter-spacing:.025em;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.music-player input[type=range]{appearance:none;-webkit-appearance:none;height:16px;background:transparent;cursor:pointer;min-width:0;margin:0}
.music-player input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--gold) 0%,var(--gold) var(--range-percent,0%),var(--line) var(--range-percent,0%),var(--line) 100%)}
.music-player input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
.music-player input[type=range]::-moz-range-progress{height:3px;background:var(--gold);border-radius:3px}
.music-player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-3.5px;border-radius:50%;border:1px solid var(--gold2);background:var(--gold);box-shadow:0 0 0 3px rgba(181,106,97,.13)}
.music-player input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold2);background:var(--gold)}
#musicSeek{width:100%;flex:1}
.music-volume{display:flex;align-items:center;gap:7px;flex:none;border-left:1px solid var(--line);padding-left:12px;color:var(--dim)}
.music-volume svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#musicVolume{width:64px;--range-percent:65%}
#musicClose{border:0;background:transparent;width:27px;height:29px;color:var(--dim);font:24px Forum,serif;align-self:flex-start;margin:-5px -7px 0 0}
#musicClose:hover{color:var(--gold2)}
.track-launch{margin:.65em 0 1.15em;text-indent:0!important;text-align:left!important;break-inside:avoid}
.track-launch button{display:inline-flex;align-items:center;gap:10px;padding:9px 13px 9px 11px;border:1px solid var(--line);border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(181,106,97,.13),transparent),var(--panel);color:var(--gold2);cursor:pointer;font:14px Forum,serif;letter-spacing:.04em;text-align:left}
.track-launch button::before{content:"♫";font-size:20px;line-height:1;color:var(--gold)}
.track-launch button:hover{border-color:var(--gold);background:rgba(181,106,97,.14)}
.track-launch button.track-active{border-color:var(--gold);background:rgba(181,106,97,.19);color:var(--gold2)}
.track-launch button.track-active::before{content:"■";font-size:13px}
@media(max-width:540px){.music-player{width:calc(100% - 16px);padding:10px 11px;gap:9px}#musicToggle{width:37px;height:37px;font-size:17px}.music-name{font-size:13px}.music-eyebrow{font-size:9px}.music-wave{display:none}.music-volume{padding-left:8px;gap:3px}#musicVolume{width:37px}.music-progress-row{gap:6px}.music-clock{font-size:10px}#musicClose{margin:-5px -5px 0 0;width:21px}}
@media(max-width:370px){.music-volume{border-left:0;padding-left:0}.music-volume svg{display:none}#musicVolume{width:30px}.music-player{gap:6px}.music-name{font-size:12px}}
html[data-theme=sepia] .music-player{box-shadow:0 5px 16px rgba(54,40,30,.09)}

</style>
</head>
<body>
<div class="bar">
  <div class="head">
    <span class="kick" id="kick">SAINT OF NOTHING</span>
    <button type="button" class="btn" id="tocBtn" aria-expanded="false">Главы</button>
    <button type="button" class="btn" id="setBtn" style="text-transform:none;letter-spacing:.05em;font-size:15px" aria-expanded="false" aria-label="Настройки текста">Аа</button>
  </div>
  <div class="pop toc" id="toc" hidden></div>
  <div class="pop set" id="set" hidden>
    <div class="row"><div class="lab">Шрифт</div><div class="seg" id="ffSeg">
      <button type="button" data-v='"Alegreya Sans",sans-serif'>Без засечек</button>
      <button type="button" data-v='Alegreya,serif'>Книжный</button>
      <button type="button" data-v='"PT Serif",serif'>Строгий</button></div></div>
    <div class="row"><div class="lab"><span>Размер</span><span id="fsVal"></span></div><input type="range" id="fs" min="15" max="28" step="1"></div>
    <div class="row"><div class="lab"><span>Интервал</span><span id="lhVal"></span></div><input type="range" id="lh" min="1.4" max="2.2" step="0.1"></div>
    
    <div class="row"><div class="lab">Тема</div><div class="seg" id="thSeg">
      <button type="button" data-v="night">
        <svg viewBox="0 0 24 24"><path d="M12 2A9.9 9.9 0 0 0 2 12a10 10 0 0 0 17.7 6.2A9.9 9.9 0 0 1 12 2z"/></svg>
        Сумерки
      </button>
      <button type="button" data-v="sepia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path>
        </svg>
        Бумага
      </button>
    </div></div>

  </div>
</div>
<div class="stage" id="stage">
  <div class="view" id="view"><div class="flow" id="flow"></div></div>
  <button type="button" class="tap l" id="tapL" aria-label="Предыдущая страница"></button>
  <button type="button" class="tap r" id="tapR" aria-label="Следующая страница"></button>
</div>
<div class="music-player" id="musicPlayer" hidden aria-label="Музыкальный плеер">
  <button type="button" id="musicToggle" aria-label="Пауза">Ⅱ</button>
  <div class="music-details">
    <div class="music-info"><div class="music-ident"><span class="music-eyebrow">Саундтрек · Пункт I. Наказание</span><span class="music-name">Rammstein — Deutschland</span></div><span class="music-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="music-progress-row"><input type="range" id="musicSeek" min="0" max="100" value="0" step="0.1" aria-label="Перемотка песни"><span class="music-clock" id="musicTime">0:00 / 5:22</span></div>
  </div>
  <label class="music-volume" aria-label="Громкость"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/></svg><input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.65" aria-label="Громкость"></label>
  <button type="button" id="musicClose" aria-label="Закрыть и остановить песню">×</button>
</div>
<audio id="musicAudio" preload="metadata"></audio>
<div class="foot">
  <button type="button" class="btn" id="prev" aria-label="Назад">‹</button>
  <div class="meta">
    <span id="meta"></span>
    <div class="prog" id="prog"><i id="bar"></i></div>
  </div>
  <button type="button" class="btn" id="next" aria-label="Дальше">›</button>
</div>
<script>
(function(){
var BOOK=[{"title":"","chapters":[{"n":1,"title":"CHAPTER I — EVERYTHING IN ITS RIGHT PLACE","epi":"И сказал Господь Бог: вот, Адам стал как один из Нас, зная добро и зло; и теперь как бы не простер он руки своей, и не взял также от дерева жизни, и не вкусил, и не стал жить вечно.","epiBy":"— Бытие 3:22","html":"<p class=\"first\">Это была ночь. Холодная, влажная, какая-то до неприличия противная. Слишком противная, чтобы быть настоящей. В такие ночи у мира появляется дурная привычка напоминать о собственном существовании через самые незначительные вещи: сырость, осевшую на коже; неприятный привкус во рту; одежду, которая вдруг начинает казаться совершенно чужой; собственное тело, от которого невозможно отделаться, хотя временами очень хочется хотя бы на несколько минут перестать его замечать. Желудок сводило, к горлу подкатывала тошнота. Я бы, наверное, даже обрадовался, если бы меня вырвало, но организм, кажется, не располагал достаточным количеством сил для столь выразительного жеста.</p><p>Я выдохнул в открытое окно облако сигаретного дыма. Оно на мгновение задержалось перед лицом, смешалось с холодным воздухом и исчезло. Удивительно, как легко некоторые вещи перестают существовать. Ни следа, ни свидетельства, ни даже особенного повода вспоминать о них. Дым, например. Человек, который только что прошёл по улице. Чужая мысль, случайно услышанная фраза. Всё это происходит, занимает какое-то место в мире, а затем освобождает его для чего-нибудь другого. И никто не обязан объяснять, почему именно так. Возможно, в этом и заключается одно из самых неприятных свойств реальности: ей совершенно безразлично, что именно она уничтожает, пока на освободившемся месте продолжает происходить что-нибудь ещё.</p><p>Я сглотнул. Слюна показалась густой, почти инородной. Горло неприятно сжалось, и я на несколько секунд задержал дыхание, прислушиваясь к собственному организму с тем раздражением, с каким обычно прислушиваются к неисправному бытовому прибору. Нельзя сказать, что я особенно хорошо понимал, что со мной происходит. Впрочем, понимание давно перестало быть обязательным условием для происходящего.</p><p>По телу скользнула дрожь — едва ощутимая, почти призрачная, но всё же оставившая после себя странное, неприятно отчётливое ощущение. Я не мог понять, чем она была вызвана: обыкновенным холодом или чем-то другим, происходившим где-то глубже, за пределами привычного восприятия. Будто внутри меня с оглушительным треском разошлось что-то прежде цельное, разломилось на несколько частей, которые теперь никак не могли найти прежнего положения. Или, нет, всё было совершенно наоборот. Может быть, что-то наконец соединялось, связывалось тонкими, почти невидимыми нитями в подобие правильной сети, где каждая отдельная линия должна была однажды привести к другой. Почти разгаданный финал. Почти готовая система мировоззрения. Почти цельная структура, которой оставалось совсем немного, чтобы обрести окончательную форму.</p><p>Структура мира ускользала от меня именно тогда, когда я пытался удержать её на бумаге. Я выводил в тетради одно правило за другим, возвращался к уже написанному, перечёркивал, дополнял, снова начинал сначала, но стоило мне приблизиться к какой-нибудь закономерности, как она распадалась на отдельные фрагменты, переставала складываться в нечто осмысленное. И всё же я снова и снова возвращался к одной и той же мысли: поиск собственной личности подстроит весь мир под меня, заставит его принять мои очертания и едва ли не превратит меня в Бога. Я повторял это с каким-то почти религиозным упорством, словно истина могла возникнуть из самого факта многократного произнесения, словно достаточно подобрать правильные слова, расставить их в нужном порядке и записать на бумаге, чтобы они перестали быть просто словами. Чтобы однажды написанное правило обрело вес закона, а закон — силу, которой невозможно противостоять.</p><p>В Бога?</p><p>Я смотрел вниз и ничего не чувствовал. Ни страха, ни желания, ни даже привычного беспокойства, которое обычно сопровождает столкновение с чем-то непонятным. Только пустоту — странную, вязкую, лишённую каких-либо очертаний. Она не подчинялась правилам, не признавала границ и совершенно не интересовалась тем, сколько усилий я потратил на попытки её объяснить. Её нельзя было разложить на составляющие, обнаружить в ней закономерность, перенести на бумагу и тем самым хотя бы условно сделать частью собственной системы. Она оставалась чем-то посторонним, существующим вопреки всему, что я пытался о ней думать. Пустотой, которую невозможно было заставить принять нужную мне форму.</p><p>Очередная мысль ускользнула. На несколько мгновений в голове образовалась почти абсолютная тишина — непривычная, неестественная, словно кто-то внезапно оборвал звук посреди длинной, давно заученной мелодии. Я даже не успел толком осознать, о чём именно думал. Только почувствовал, как что-то оборвалось на полуслове, оставив после себя неприятное ощущение незавершённости. Будто где-то внутри продолжала существовать невысказанная часть фразы, её невидимое продолжение, до которого я никак не мог добраться. И сколько бы ни пытался восстановить потерянную последовательность, оставалось лишь смутное чувство, что совсем недавно я находился гораздо ближе к чему-то действительно важному. Мне снова не хватило нескольких секунд.</p><p>Телефон отвлёк меня уведомлением. Взаимный лайк от какого-то парня в приложении для знакомств. Хм. А я уже и забыл, что вообще кого-то там лайкал. Кажется, ещё несколько дней назад. Или вчера? Неважно. Я вообще не очень хорошо помнил, зачем открыл это приложение в последний раз и что именно искал. Наверное, ничего конкретного. Просто смотрел чужие фотографии, читал короткие описания, иногда задерживался на чём-то интересном, а потом без особых раздумий ставил лайки. Очередное бессмысленное действие, которое можно совершить, даже не особенно присутствуя в собственной жизни.</p><p>Я открыл его профиль.</p><p>Некоторое время просто смотрел на фотографию, не особенно понимая, что именно привлекло моё внимание. Внутри что-то болезненно сжалось, а мысли, ещё недавно с такой настойчивостью пытавшиеся выстроить из окружающего мира подобие стройной системы, вдруг потеряли всякое значение. В голове осталось только одно слово.</p><p>Ангел.</p><p>Странное, усталое выражение лица. Смоляные волосы, резко выделяющиеся на фоне почти неестественной бледности кожи. В его внешности было что-то непривычно хрупкое, хотя я не мог бы объяснить, что именно заставило меня так подумать. Я продолжал смотреть на экран, будто фотография могла измениться, если задержать на ней взгляд ещё на несколько секунд. Лишь спустя какое-то время я заметил, что напряжённо сжимаю телефон в руках.</p><p>Странное чувство. Почти забытое. Я даже не сразу понял, что именно происходит, пока не поймал себя на том, что всё ещё рассматриваю его фотографии и почему-то не хочу закрывать приложение. Внутри будто что-то сдвинулось с места — не резко, не болезненно, а с каким-то непривычным теплом, от которого становилось одновременно тревожно и немного неловко. Мне хочется написать. Узнать, чем он занимается, что слушает, во что играет, как проводит время. Хочется получить ответ. Не просто уведомление о совпадении, не очередное подтверждение того, что кому-то понравилась моя фотография, а именно ответ — от другого человека, который пока совершенно ничего обо мне не знает.</p><p>Я почти хочу…</p><p>Хочу найти в себе силы на общение с ним. Не ограничиться несколькими сообщениями, не исчезнуть через десять минут после первого ответа, не потерять интерес сразу же, как только разговор перестанет требовать от меня каких-либо усилий. Хочу хотя бы попробовать. Так будет правильнее. Наверное.</p><p>Пальцы дрожали, пока я набирал ему сообщение. Несколько раз стирал уже написанное, менял порядок слов, возвращался к первоначальному варианту. В конце концов отправил: «о, ты тоже играешь в киберпанк? и как тебе?»</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Наше общение скользит по всему, что только можно. Мы говорим о болезнях — ещё одно совпадение, БАР. О том, как глуп и несправедлив мир. О человеческой природе, бессмысленности существования, о том, насколько случайным и несправедливым может быть распределение страданий. Даже о том, может ли самоубийство быть праведным поступком. Мы не пытаемся обходить неудобные темы, не ищем безопасных формулировок, не делаем вид, будто некоторые вопросы слишком неприличны для разговора с человеком, чьего лица мы ещё толком не знаем. В конце концов, что может быть неприличнее человеческой души, если рассматривать её достаточно долго и не отворачиваться в тот момент, когда становится противно?</p><p>Эти темы постепенно разрастаются в настоящую эпопею. Мы возвращаемся к ним, спорим, перескакиваем с одного на другое, снова возвращаемся, словно ни одна мысль не может остаться незаконченной, пока мы оба не выскажемся до конца. Разговор не прекращается даже с восходом солнца. За окном меняется освещение, ночь постепенно теряет свои права, но переписка продолжается, будто время суток вообще не имеет к нам отношения. И мне почему-то нравится эта непрерывность. Нравится, что между одним сообщением и другим не приходится выстраивать привычные мосты из дежурных вопросов. Что можно сразу переходить к чему-то важному, не тратя силы на доказательство собственного права говорить. Будто мы пропустили все положенные церемонии знакомства и сразу оказались в какой-то грязной исповедальне, где вместо священника — такой же грешник, а вместо молитвенника — экран телефона, заляпанный отпечатками пальцев.</p><p>В какой-то момент разговор перестаёт быть разговором в привычном понимании. Всё сводится к почти прямой трансляции происходящего у нас в головах. Мы отправляем друг другу всё, что видим, слышим, чувствуем: случайные мысли, наблюдения, реакции, воспоминания. Я пишу ему одно сообщение, потом другое, иногда даже не дожидаясь ответа на предыдущее. Он делает то же самое. Мы будто открываем друг перед другом двери, которые обычно держат запертыми, и совершенно не интересуемся, что находится за ними. Не спрашиваем разрешения войти. Не проверяем, насколько безопасно оставаться внутри. Просто переступаем порог, оставляя грязные следы на чужом полу.</p><p>В этом есть что-то от исповеди. Только у исповеди обычно есть священник, а у нас нет даже определённого порядка признаний. Мы одновременно исповедуемся и принимаем чужую исповедь, не имея ни права отпускать грехи, ни возможности назначать за них наказание. Два человека, которые почему-то решили, что могут вывалить друг перед другом всё самое неприглядное, а потом продолжить разговор так, словно ничего особенного не произошло. Хотя, возможно, именно это мне и нравится. Отсутствие заранее установленной иерархии. Возможность говорить о собственной вине, не получая в ответ готового приговора. Возможность хотя бы на несколько часов оказаться перед кем-то, кто не требует от меня немедленно объяснить, почему я такой. Кто не торопится перекрестить меня, прочитать над головой молитву или хотя бы сделать вид, что знает, как именно следует спасать таких, как я.</p><p>Я пишу ему, как сильно устал. Как долго искал ответ, но так ничего и не нашёл. Как не понимаю, почему обречён верить в собственную вину. Почему мне недостаточно знать, что я мог ничего плохого не сделать. Почему отсутствие доказательств не становится оправданием, а лишь оставляет место для новых обвинений. Я пытаюсь объяснить ему всё это, но слова всё равно получаются какими-то неправильными. Слишком маленькими. Будто я пытаюсь уместить целую процедуру суда в несколько сообщений, а потом ещё и вынести окончательный приговор самому себе. Иногда мне кажется, что я уже давно произнёс признание, просто никто не удосужился сообщить мне, за что именно меня осудили.</p><p>Я не знаю, когда именно начал воспринимать собственное существование как бесконечное покаяние. Не помню первого греха, первого обвинения, первого момента, когда решил, что обязан расплачиваться за сам факт своего присутствия. Может быть, никакого первого момента и не было. Может быть, я просто однажды обнаружил себя уже стоящим перед алтарём, с опущенной головой и заранее приготовленным признанием. Камень под коленями холодный, воздух пропитан старым воском, пылью и чем-то затхлым. Где-то передо мной стоит образ святого, которому давно следовало бы заменить лицо, но я всё равно продолжаю на него смотреть. Оставалось только придумать, в чём именно я виноват. Наверное, я всегда был достаточно изобретателен, чтобы найти повод для очередного покаяния.</p><p>Позже я говорю, что едва ли когда-нибудь смогу обрести контроль. Само слово кажется мне чужим, почти неприличным. Контроль над собой, над собственными мыслями, над тем, что происходит вокруг. Я привык считать его чем-то недоступным, естественным продолжением чужой личности, которое почему-то обошло меня стороной. Другие люди могут выбирать, решать, отказываться, соглашаться. А я всё время пытаюсь догнать собственные решения, успевшие принять окончательную форму ещё до того, как я замечаю их появление. Иногда мне кажется, что я не управляю даже собственной исповедью: слова уже произнесены, вина уже признана, а я всё ещё пытаюсь понять, кто именно говорил моим голосом.</p><p>Он пишет, что хочет отдать контроль над собой.</p><p>И это почти звучит правильно.</p><p>Я перечитываю сообщение. Один раз. Потом ещё. Мне кажется, что я должен что-то ответить, но мысли на несколько секунд совершенно теряют привычный порядок. Внутри всё сжимается, и одновременно разливается какое-то странное, почти невыносимое удовольствие. Не знаю, как назвать это чувство. Возможно, мне просто приятно услышать, что кто-то способен добровольно предложить то, чего я сам никогда не мог у себя обнаружить. Возможно, дело в самом доверии. Или в том, что на несколько мгновений я перестаю чувствовать себя человеком, который бесконечно просит прощения за собственное существование.</p><p>Есть что-то почти священное в добровольной жертве. Не в самом лишении или утрате, а в моменте, когда человек самостоятельно решает положить что-то ценное на алтарь. Когда он не ждёт, пока у него отнимут, а предлагает это сам. В этом есть что-то от причастия, только вместо хлеба и вина — чужое доверие, а вместо благодати — странное, почти неприличное чувство собственной значимости. Я понимаю, что он, вероятно, не вкладывает в свои слова ничего подобного. Может быть, для него это всего лишь способ описать собственное желание, не более того. Но я уже успеваю придать этой фразе совершенно другой вес. Мне почти стыдно за то, как охотно я это делаю, хотя стыд, кажется, давно перестал быть достаточной причиной, чтобы остановиться.</p><p>Я почти чувствую себя тем, кому можно доверить такую вещь. Тем, кто не обязан просить, потому что ему предлагают. Тем, перед кем не нужно доказывать право принимать чужое признание. И это странным образом соседствует с другим желанием — самому оказаться на алтаре, самому стать тем, кого выбирают, кому поклоняются, кого считают достаточно важным, чтобы добровольно отказаться от чего-то ради него. Мне хочется быть достойным чужого поклонения и одновременно получить возможность преклониться самому. Не знаю, какое из этих желаний унизительнее. Возможно, оба. Возможно, именно поэтому они так хорошо уживаются во мне.</p><p>Я хочу быть и жертвой, и тем, кто принимает жертву. И мне совершенно не кажется, что между этими желаниями есть противоречие.</p><p>Это ощущается как-то почти горячо. Почти желанно. И почти заставляет дрожать всем телом, жадно хватая прохладный воздух комнаты. Вес одеяла увеличивается стократ. Теперь оно давит на оголённую кожу, и от каждого прикосновения по телу проходит электрический разряд. Я пытаюсь устроиться удобнее, но любое движение только сильнее напоминает о том, насколько остро я чувствую собственное тело. Будто оно вдруг перестало быть просто оболочкой, чем-то привычным и почти незаметным, и теперь требует внимания к каждой мелочи.</p><p>Я перечитываю вновь. Медленно, потом ещё раз, возвращаясь к отдельным словам, словно между ними можно обнаружить что-то, чего я не заметил с первого раза. И, кажется, на долю секунды ловлю его губами. Чувствую прикосновение его тёплых рук поверх моих. Представляю, как близко он мог бы оказаться, как легко было бы сократить это расстояние, если бы оно вообще существовало не только в моей голове.</p><p>Я почти верю в происходящее. Не потому, что действительно принимаю фантазию за реальность, а потому, что на несколько мгновений мне совершенно не хочется их различать. Мне достаточно этого ощущения. Достаточно возможности представить, что кто-то может прикоснуться ко мне не случайно, не по ошибке, не из вежливости. Что за этим движением есть какое-то намерение. Что меня действительно хотят видеть рядом.</p><p>Но момент заканчивается. Всё быстро пропадает, словно кто-то вырубил свет. И я снова остаюсь один в собственной комнате, с телефоном в руках и совершенно нелепым ощущением, будто у меня только что что-то отняли. Хотя никто ничего не обещал. Никто ничего не давал. Я сам придумал это расстояние, сам сократил его, сам позволил себе на секунду поверить в чужое тепло.</p><p>Это лишь фантазии. Грязные и мерзкие, как бычок в мусорке. И почему-то именно сейчас мне хочется перечитать всё ещё раз.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Чем дольше мы говорим о религии, о подчинении, о контроле и его передаче, о том, как властвовать, как ловить едва ли не праведные оргазмы, тем чаще я ловлю себя на мысли, что он послан мне богом. Не знаю, в какой именно момент эта мысль впервые появилась в моей голове. Возможно, она возникла где-то между очередным рассуждением о грехе и совершенно непристойной шуткой, затерялась среди сообщений, а потом незаметно укоренилась, как что-то давно ожидавшее подходящего случая. Впрочем, разве обязательно искать приличное объяснение тому, что кажется чудом?</p><p>Он прекрасен во всём, что только возможно. В том, как формулирует мысли, как отвечает на мои бесконечные сообщения, как не теряет нить разговора, даже когда я успеваю перескочить с одной темы на другую несколько раз за минуту. Мне хочется находить в каждом его слове что-то особенное. Искать скрытые смыслы, знаки, подтверждения. Я разбираю его фразы почти так же, как прежде пытался разобрать устройство мира: ищу закономерности, сопоставляю детали, придаю случайным совпадениям значение, которого, возможно, в них никогда не было. Будто я наконец получил доступ к чему-то, чего прежде был лишён. Будто мне позволили прикоснуться к чужому совершенству, пусть даже через экран телефона. И я готов довольствоваться этим крошечным подобием близости, разглядывая его сообщения так, словно между буквами можно обнаружить отпечатки чего-то божественного.</p><p>Но я даже не смею просить о встрече.</p><p>Мне кажется, что само желание увидеть его вживую уже слишком большое. Почти неприличное. Я ведь и так получаю гораздо больше, чем мог рассчитывать. Его сообщения, его внимание, его готовность говорить со мной обо всём этом. Разве этого недостаточно? Разве я не должен быть благодарен хотя бы за то, что он вообще появился в моей жизни? Иногда мне кажется, что я уже веду себя как попрошайка у церковных дверей: получил несколько монет, зажал их в грязной ладони и теперь боюсь даже поднять глаза, чтобы не показаться слишком жадным. Хотя мне хочется гораздо большего. Конечно, хочется. Просто некоторые желания настолько отвратительно откровенны, что их проще объявить недостойными, чем признать своими.</p><p>И тогда он просто предлагает встретиться сам.</p><p>Я перечитываю сообщение. Раз. Другой. Не сразу понимаю, что именно он написал, хотя слова совершенно простые. Он зовёт меня к себе. Хочет увидеться. Не потому, что я попросил, не потому, что вынудил его обратить на меня внимание. Сам. На несколько секунд я словно перестаю понимать, что делать с собственным лицом, руками, дыханием. Всё это кажется каким-то нелепым избытком человеческого тела, которое вдруг оказалось свидетелем события, слишком важного для него самого.</p><p>Мой ангел сам зовёт меня к нему.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>Красный свет. Давит — своей пошлой надменностью, своей уверенностью, что ему позволено всё. Он будто читает мои мысли и совершенно открыто оповещает о подлинном назначении этой встречи: не более чем грехопадение, не менее чем искупление самых страшных грехов. Впрочем, я уже не уверен, где заканчивается одно и начинается другое. Возможно, это вообще одно и то же. Возможно, я просто слишком долго пытался найти между ними разницу — искал шов, линию, место, где можно поставить палец и сказать: вот здесь кончается падение и начинается прощение. Никакого шва нет. Есть только красный свет и то, что он освещает.</p><p>Слишком много. </p><p>Он сидит на коленях возле небольшого дивана с чёрной кожаной обивкой. Руки аккуратно лежат на бёдрах. Оголённое тело выглядит необычайно… необычайно. Я не могу подобрать слово. Нежное? Хрупкое? Словно статуя, которую почему-то оставили здесь без постамента, среди дешёвого красного освещения и чужих голосов за стенами. В этой неподвижности есть что-то почти неправильное. Он кажется настолько беззащитным, что мне на секунду становится неловко от собственного присутствия. Нет… Не статуя. Как икона. Да, как икона.  </p><p>Я закрываю за собой дверь.</p><p>Звук получается коротким, почти незначительным, но после него пространство словно отделяется от всего остального мира. Теперь здесь только мы. Он и я. Два человека, которые ещё совсем недавно существовали друг для друга исключительно в переписке, а теперь почему-то оказались по разные стороны одного и того же взгляда. И я не знаю, что делать с этой внезапной близостью. В сообщениях между нами всегда оставалось расстояние — несколько сантиметров стекла, буквы на экране, возможность не отвечать сразу. Теперь его больше нет.</p><p>Подхожу близко. Почти вплотную.</p><p>Его зеленые глаза встречаются с моими. Я успеваю заметить, как он рассматривает меня, пытается задержать взгляд на моём лице, но уже через мгновение собирается отвернуться. Совершенно естественное движение. Ничего особенного. Наверное, я бы даже не обратил на него внимания, если бы не был настолько сосредоточен на каждой мелочи.</p><p>Я чуть качаю головой и, взяв его за подбородок, не позволяю отвернуться.</p><p>Мне хочется рассмотреть его. Не фотографию, не изображение на экране, не очередную удачно пойманную интонацию в сообщении — эти жалкие свидетельства, которые я собирал, как собирают реликвии: обрывок голоса, уголок улыбки, тень, которую можно принять за присутствие. Его самого. Убедиться, что он действительно существует именно таким, каким я его представлял. Что у него действительно такие глаза. Что расстояние между нами и правда настолько маленькое, что мне больше не нужно пытаться вообразить его присутствие, достраивать его из ничего, из обрывков, из собственного голода.</p><p>Мне хочется найти грань. Грань дозволенного в принятии контроля над кем-то. Понять, в какой момент чужое доверие перестаёт быть разрешением, а моё желание управлять — перестаёт быть просто желанием. Есть ли вообще точка, за которой одно превращается в другое? Или я снова пытаюсь придумать правило для того, что не желает ему подчиняться?</p><p>Провожу большим пальцем по его губам — чувствуя совсем недавнюю влажность, ещё не остывшую, — запускаю внутрь, оттягиваю в сторону. Наклоняюсь так близко, что он может почувствовать, как моё горячее дыхание обжигает его кожу, оседает на ней, остаётся. Он позволяет. Не отстраняется, не сжимает губы, не отводит взгляд — просто позволяет, и от этого позволения у меня внутри разливается горячая волна, тяжёлая, медленная. Чувствую, как она расходится по телу, до самых пальцев.</p><p>Музыка всё это время играла где-то на фоне. Я даже не замечал её — или просто не считал чем-то достойным внимания. Но теперь включается Angel от Massive Attack.</p><p>И я почему-то сразу слышу.</p><p>Запускаю пальцы в его тёмные, почти как смола, волосы — тяжёлые, густые, они не проскальзывают, а остаются в руке, — сжимаю, заставляя ещё больше поднять лицо. Он поднимает. Шея натягивается, горло открывается, и я чувствую, как под моими пальцами кожа натягивается вместе с ней.</p><p>А потом начинается это. «Love you, love you, love you, love you…». Одно и то же, снова и снова, без развития, без выхода. Как мантра. Как молитва, которую повторяют, пока слова не сотрутся и не останется только ритм. Я стою и слушаю, как голос повторяет это — не мне, не ему, а самой песне, воздуху, красному свету, — и понимаю, что это и есть причастие. Песня становится причастием. Её принимают, не спрашивая, что в ней растворено, и после неё уже нельзя стать прежним.</p><p>Я стою и принимаю. Смотрю на него, на своего ангела, и думаю, что он должен быть выше меня. Чище. Целее. Иначе какой смысл во всём этом? Зачем мне вообще понадобился ангел, если я могу увидеть в нём те же трещины, что и в себе? Но я ведь не хочу, чтобы он был недосягаемым. Я хочу, чтобы он был рядом. Чтобы отвечал на мои сообщения, запоминал мои слова, возвращался ко мне. Чтобы у него было тело, голос, привычки, плохое настроение и собственные желания. Чтобы он был человеком — и всё-таки чем-то большим. Я понимаю, что это несправедливо. Даже почти испытываю стыд. Но отказываться от этой мысли не собираюсь.</p><p>Мы оба здесь не случайно: падший и ниспосланный, грех и искупление. Хотя я не уверен, кто из нас кем должен быть. Может, я просто назначил ему роль, потому что мне необходимо, чтобы хоть кто-нибудь в этой комнате знал, зачем мы сюда пришли. У этой встречи нет шва, который можно было бы нащупать и разорвать. Есть только красный свет и то, что он освещает.</p><p>Тяну за поводок — за собой, — опускаясь спиной на диван. Жест получается почти грубым, небрежным, как будто мне всё равно, как будто я не сомневаюсь ни на секунду, — и именно поэтому он работает. Я знаю, что он подчинится. Я знаю это раньше, чем он сам успевает решить. Он последует за мной — потому что уже следует, потому что не может иначе, потому что поводок натянут, и он это чувствует.</p><p>И я думаю: вот он. Тот, кого мне ниспослали. Не в утешение — в назидание. Ангелы не всегда приходят с благими вестями. Иногда они приходят, чтобы ты увидел, чем стал сам, и больше не смог отвести взгляд.</p><p>А я — я падший. Это не жалость к себе и не поза. Просто факт, такой же очевидный, как цвет глаз или трещина на потолке. Хотя, если честно, мне нравится быть падшим. В этом есть что-то почти величественное. Гораздо приятнее считать себя существом, утратившим божественное начало, чем человеком, который, возможно, никогда им не обладал. Падение предполагает высоту. Предполагает, что когда-то ты был достоин света. Что у тебя вообще было, что терять.</p><p>Я не знаю, правда ли это. Не знаю, существовал ли тот свет или я придумал его задним числом, чтобы придать собственной пустоте хоть какую-то историю. Но мне хочется верить. Мне необходимо верить, что я не всегда был таким.</p><p>Падший ангел знает цену света лучше, чем кто-либо другой: он видел его вблизи, помнит, каково это — стоять в нём, и помнит, как звучит падение. Поэтому он и тянется к тому, кто ещё светится. Не чтобы согреться. Чтобы подтвердить: свет ещё где-то есть. Чтобы убедиться, что он не выдумал его окончательно.</p><p>И, может быть, чтобы однажды забрать себе.</p><p>Он устраивается рядом, кладёт голову мне на бедро — и я на несколько секунд перестаю понимать, что происходит. Вот так просто. Без долгих объяснений, без необходимости подбирать слова, без очередного сообщения, которое можно перечитывать до тех пор, пока оно не потеряет первоначальный смысл и не станет просто набором букв. Он здесь. Его голова лежит на мне. Я могу ощутить вес этого присутствия — тяжёлый, тёплый, настоящий — и больше не должен ничего додумывать. Не должен достраивать его из чужих интонаций и собственного голода.</p><p>От этого внутри всё болезненно сжимается — так, как сжимается горло перед тем, что вот-вот вырвется наружу, — и я не сразу понимаю, что это не боль. Мне хочется назвать происходящее чудом, хотя я прекрасно понимаю, насколько нелепо звучит подобное определение. Но я ведь столько времени ждал именно этого — не обязательно самого жеста, скорее возможности оказаться для кого-то настолько близко. Быть тем, к кому можно прийти. Тем, на ком можно остановиться, хотя бы ненадолго. Тем, чьё бедро становится подушкой, а не алтарём.</p><p>Смотрю на него. Его взгляд просит. Нет, даже умоляет. Умоляет сделать что-то такое, что окончательно поставит нас на позиции — контроль и подчинение. Я тяну его ближе, так, чтобы его лицо было не просто на бедре, а у паха.</p><p>— Давай. Сделай мне приятно…</p><p>Он не отвечает. Опускает голову — и я чувствую его дыхание там, где ещё секунду назад ничего не было. Тёплое, неровное, влажное. Оно оседает на коже, я напрягаюсь всем телом ещё до того, как он касается.</p><p>Касается. Сначала губами. Осторожно, почти робко. Они приоткрываются, скользят по ткани — почти невыносимо, потому что мало, потому что я хочу больше, и он это знает. Он поднимает глаза, снизу, не отрываясь. Я вижу в них вопрос. Киваю. Он убирает ткань, и теперь его дыхание обжигает голую кожу.</p><p>Он берёт. Медленно, насколько может. Губы натягиваются, язык ложится снизу, он старается. Старается так, как стараются перед иконой: благоговейно, без спешки, вкладывая всё, что у него есть. Я запускаю пальцы в его волосы. Не тяну, просто держу. Он от этого становится смелее, глубже. Я слышу, как он дышит через нос — тяжело, размеренно, в такт.</p><p>Он поднимает голову на секунду, вдохнуть. Слюна тянется от его губы к моей коже. Я смотрю на это и думаю: вот оно. Вот то, что я хотел. Он на коленях, он у моего паха, и он делает это потому, что сам попросил, потому что сам умолял. От этого всё внутри меня натягивается туже.</p><p>— Ещё, — говорю я. Голос выходит ниже, чем я ожидал.</p><p>Он возвращается. Теперь быстрее, увереннее. Ритм меняется, он подстраивается под меня, его рука ложится мне на бедро, чтобы удержаться. Я направляю его — ладонью на затылке. Он принимает направление. Это правильно, это именно то, что должно быть. Моё дыхание сбивается. Я смотрю на него сверху вниз, на его волосы в моих пальцах, на его губы, и думаю, что не хочу, чтобы это заканчивалось. И что оно всё равно закончится. И что, может быть, именно поэтому оно так хорошо.</p><p>— Не останавливайся, — говорю я. — Не смей останавливаться.</p><p>Он не останавливается.</p><p>Я не могу сказать, в какой момент мы перестаём следить за часами. Не могу вспомнить, сколько раз музыка успевает смениться тишиной и сколько раз тишина снова заполняется музыкой снова.</p><p>Всё, что прежде приходилось воображать, теперь существует непосредственно рядом.</p><p>И оно рядом — не только голосом, не только лицом. Оно рядом кожей, и кожа оказывается горячее, чем я думал, и бледнее, чем я думал, — настолько бледнее, что любая моя отметка на ней держится, как печать на воске.</p><p>Я нависаю над ним. Чувствую, как его тело кажется ещё более хрупким. Веду языком по яремной вене — медленно, вдоль, — затем замираю и втягиваю. Долго, упрямо. Пока под губами не становится горячо и тесно. Отстраняюсь — на бледном остаётся тёмное пятно, как клеймо. Моё.</p><p>Он выдыхает. Коротко, сдавленно. Это звучит как согласие.</p><p>Я кусаю. Ниже, у основания шеи, — так, чтобы остался зубчатый след. Кожа подаётся, наливается красным, и я вижу, как оно проступает изнутри, медленно, как проступает вино сквозь ткань. Он вздрагивает. Я зализываю след и спускаюсь ниже.</p><p>Ключицы. Я провожу по ним губами, нахожу впадинку и втягиваю — коротко, резко. Оставляю метку. Рядом — вторую. Они ложатся парой, как две печати на одном документе, и я думаю, что этого мало.</p><p>Грудь. Я кусаю там, где кожа тоньше всего, у самого соска, и он выгибается. Его дыхание меняется — становится короче, рванее, — и я чувствую, как под моими губами бьётся сердце. Быстро. Быстрее, чем должно. Я оставляю след прямо над ним, чтобы отметить место, где оно бьётся.</p><p>Живот. Я спускаюсь по нему дорожкой — губы, зубы, снова губы, — и оставляю за собой цепочку тёмных пятен. Они идут вниз, ровно, как по линейке, и я на секунду задерживаюсь, чтобы посмотреть на них. Моя работа. Моя карта.</p><p>Бёдра. Здесь кожа особенно бледная, и следы держатся крепче. Я впиваюсь пальцами, чтобы удержать его на месте, и одновременно кусаю — высоко, у самого края белья. Он вскрикивает. Коротко, сдавленно. Я не отпускаю, пока не чувствую, что отметина села глубоко.</p><p>Внутренняя сторона бедра. Самое нежное место. Я втягиваю кожу медленно, долго, и он начинает дрожать. Дрожь идёт от колена вверх, к бедру, и я чувствую её губами. Когда я отстраняюсь, там темнеет — большое, неровное пятно, которое он будет видеть каждый раз, когда останется один.</p><p>Мои руки на его запястьях, моё дыхание у его виска. Он весь подо мной — в отметинах, в следах, в моих печатях, — и я смотрю на него и думаю: вот оно. Вот как выглядит то, что принадлежит мне. Не слово, не обещание. Тело, на котором я оставил подпись.</p><p>Во рту всё ещё привкус железа. Но это настолько праведно, что едва ли я сомневаюсь в действиях.</p><p>Прижимаю к дивану. Чёрная кожа под ним скользкая от пота. Вдавливаю бёдрами — он выгибается навстречу. Под моими руками, под моим весом он весь становится моим. Целиком. Без остатка. Без права отказаться.</p><p>Я хотел стать для него кем-то особенным. Хотел, чтобы он выбрал меня, признал, приблизил к себе. Но теперь, когда между нами почти не остаётся расстояния, я вдруг обнаруживаю: мне недостаточно просто быть выбранным. Мне хочется исчезнуть в этом выборе. Перестать существовать отдельно. Хотя бы на время. Не потому, что я невыносим сам по себе, — нет, конечно, не поэтому. Просто рядом с ним мне впервые за долгое время не приходится постоянно доказывать собственное существование.</p><p>И всё же где-то внутри остаётся неприятный вопрос. Если я растворюсь в нём окончательно, кто тогда будет любить его? Кто будет смотреть на него снизу вверх, возводить алтари, называть ангелом? Кому достанется роль падшего, если мы оба перестанем быть отдельными?</p><p>Я не нахожу ответа. Да и не особенно ищу.</p><p>Толчок внутрь. Медленный, но властный — не тот, что берёт силой, а тот, что берёт правом. Я вхожу до конца и замираю, давая ему почувствовать всё сразу: давление, наполненность, мой вес над ним. Он подо мной напрягается — я чувствую это каждым сантиметром, каждой точкой, где я его касаюсь, — и медленно отпускает, сдаётся, принимает. Я чувствую, как его тело сжимается вокруг меня, как оно привыкает, как оно подстраивается под форму, которую я ему задал.</p><p>Он смотрит снизу. Глаза тёмные, зрачки расширены, и в них нет ни страха, ни сомнения — только готовность. Он ждёт. Он весь в этом ожидании, и я держу его на нём дольше, чем нужно, — просто чтобы увидеть, как он выдержит.</p><p>Выдерживает.</p><p>Я начинаю двигаться. Медленно, размеренно, каждый толчок — как удар пульса, который задаю я. Он выгибается подо мной, и его пальцы впиваются мне в предплечья, и я чувствую, как под моими ладонями на его бёдрах дрожит кожа.</p><p>— Мой ангел… — говорю я, и голос выходит низким, тяжёлым, почти чужим.</p><p>Он не отвечает. Только дышит — коротко, рвано, в такт, — и от этого дыхания у меня внутри всё натягивается туже. Он мой. Он весь мой, в эту секунду, в этом движении, в этой точке, где мы соединены.</p>"},{"n":2,"title":"CHAPTER II — CELESTIAL DISSONANCE","epi":"Скажу ли: может быть, тьма скроет меня, и свет вокруг меня сделается ночью. Но и тьма не затмит от Тебя, и ночь светла, как день.","epiBy":"— Псалтирь 138:11-12","html":"<p class=\"first\">Впустить кого-то в квартиру оказалось почему-то сложнее, чем я представлял. До этого момента всё происходило вне моего пространства. Мы могли уйти, разойтись, раствориться в ночи, оставив друг другу только воспоминания и несколько случайных следов. Но теперь он переступал порог. Оказывался среди моих вещей, в месте, куда я возвращался каждый день и где не существовало необходимости изображать кого-то другого.</p><p>Я прикрыл дверь.</p><p>— Только не обращай внимания на бардак, — произнёс я, хотя сам прекрасно понимал, насколько бесполезно это замечание. На бардак невозможно было не обратить внимания. Он не прятался по углам и не пытался казаться частью интерьера. Он просто существовал.</p><p>Квартира была небольшой студией, в которой всем моим занятиям приходилось соседствовать друг с другом. Кровать стояла у стены. Рядом — тумбочка, на которой вперемешку лежали телефон, украшения, несколько книг и какие-то мелочи, которые я собирался убрать, но так и не убрал. Над кроватью висел крест. Не особенно большой, но заметный даже в полумраке. На противоположной стороне комнаты — рабочий стол: компьютер, монитор, провода, блокноты, исписанные листы, ручки, зарядные устройства и ещё несколько предметов, давно потерявших определённое место. Рядом стоял стул, почти полностью скрытый под одеждой.</p><p>Вдоль стены тянулись полки. Книги стояли не по алфавиту и не по размеру. Некоторые лежали горизонтально поверх других, между страницами торчали закладки и случайные бумажки. Среди художественной литературы попадались религиозные тексты, сборники мифов, книги по искусству и несколько изданий, которые я открывал настолько часто, что корешки уже начали расходиться. На одной из полок соседствовали небольшие статуэтки, украшения, коробки с какими-то вещами и предметы, которые для постороннего человека, вероятно, выглядели бы совершенно случайными.</p><p>Некоторые вещи я покупал, потому что они мне нравились. Другие оставались после каких-то периодов, людей, увлечений. Третьи появлялись почти случайно и почему-то никогда не уходили. Я не любил избавляться от вещей без причины. Иногда мне казалось, что вместе с ними придётся выбросить и ту версию себя, которая когда-то решила их сохранить.</p><p>В дальнем углу находилось место, которое я не называл алтарём, хотя, наверное, именно им оно и было. Небольшая поверхность, занятая распятием, изображениями святых, свечами, чётками и несколькими религиозными книгами. Там всё выглядело чуть более собранным, чем в остальной квартире, но даже этот порядок был скорее личным, чем правильным. Я знал, где лежит каждая вещь, даже если со стороны казалось, что они просто нагромождены друг на друга.</p><p>Мне хотелось, чтобы ему здесь понравилось.</p><p>Мысль возникла так просто, что я даже не сразу понял, насколько сильно она меня задела. Не хотелось произвести впечатление. Не хотелось казаться интереснее, умнее или загадочнее. Я просто хотел, чтобы он мог находиться здесь и не чувствовать себя чужим. Чтобы ему не пришлось подбирать слова, искать удобное положение, думать, куда деть руки. Чтобы он мог смотреть на мои вещи, задавать вопросы, трогать книги, если захочет, — и не ощущать, что вторгается туда, куда его не приглашали.</p><p>Хотя, наверное, именно это я и сделал. Пригласил его туда, куда обычно никого не впускал.</p><p>Я проследил за его взглядом.</p><p>Кровать. Тумбочка. Крест над изголовьем. Рабочий стол, на котором монитор отражал слабый уличный свет. Полки, заставленные книгами и мелкими предметами, чьё присутствие давно перестало требовать объяснений. Он рассматривал всё это без спешки, и я почему-то чувствовал себя так, словно он читал текст, написанный на языке, который я сам когда-то придумал, а потом забыл.</p><p>Мне хотелось рассказать ему обо всём. И одновременно — ничего.</p><p>На стене возле рабочего стола висели постеры, фотографии и несколько моих рисунков. Бумага местами выцвела, края некоторых листов загнулись, один постер держался на таком количестве скотча, что давно превратился в самостоятельную архитектурную конструкцию. Рядом стояли колонки. Под ними лежали диски, а на полу возле шкафа громоздилась коробка с вещами, до которых у меня всё никак не доходили руки. Весь этот маленький хаос был похож на археологические раскопки. Только вместо костей и черепков здесь находились мои прежние увлечения, незаконченные проекты и попытки однажды стать человеком, у которого всё получается.</p><p>Я никогда не умел окончательно расставаться с вещами. Они задерживались у меня дольше, чем люди. Иногда — дольше, чем воспоминания о них. Я мог забыть, зачем купил какую-нибудь безделушку, но всё равно продолжал обходить её стороной, чтобы случайно не задеть. Возможно, мне просто нравилось, когда прошлое занимало физическое пространство. Когда его можно было потрогать, переставить, спрятать в ящик. Но не уничтожить.</p><p>Он остановился возле стены.</p><p>Я проследил за направлением его взгляда и почти сразу понял, что именно привлекло его внимание.</p><p>«Падший ангел» Кабанеля.</p><p>Картина висела здесь давно. Я настолько привык к ней, что иногда переставал замечать. Хотя, наверное, именно она первой должна была бросаться в глаза среди всего остального. Огромное тело, погружённое в темноту. Сложенные руки. Напряжённые мышцы. Крылья, почти растворяющиеся в сумраке. И лицо. Особенно лицо.</p><p>В нём не было покорности. Ни смирения, ни той красивой печали, которую так любят приписывать падшим существам. Только глухая, неподвижная ярость. Будто сам факт изгнания ещё не стал для него окончательной истиной. Будто он всё ещё помнил небо и ненавидел его за то, что оно продолжало существовать без него.</p><p>Я всегда думал, что в этом и заключалось самое страшное падение: не потерять небеса, а продолжать помнить, что когда-то они были твоими.</p><p>Мне нравилась эта картина. Наверное, даже больше, чем следовало бы.</p><p>Чуть дальше находился другой холст.</p><p>Мой.</p><p>Ангел смотрел прямо на себя. И теперь, когда рядом с холстом находился он, мне казалось, будто картина наконец обрела того, для кого была написана.</p><p>Я помнил, как писал его. Несколько вечеров, испачканные краской пальцы, бессмысленно исписанные листы с набросками, попытки найти правильное положение головы. Мне хотелось изобразить нечто прекрасное, но не безупречное. Не ту открытку с золотыми крыльями и безмятежной улыбкой, которую можно повесить над кроватью и забыть через неделю. Мне нужен был кто-то живой. Кто-то, в чьём лице оставалось бы что-то человеческое, даже если всё остальное принадлежало бы небесам.</p><p>Я не знал, откуда взялось это лицо.</p><p>В тот момент у меня не было модели. Ни фотографии, ни знакомого человека, ни даже смутного воспоминания, за которое можно было бы зацепиться. Сначала было лицо. Оно появилось почти сразу — раньше крыльев, раньше складок ткани, раньше слабого золотого круга над головой. Я не искал конкретных черт, не пытался кого-то вспомнить. Просто смотрел на чистый холст и постепенно понимал, что уже знаю, каким должен быть этот человек. Или не человек. Ангел. Что-то, чему я тогда ещё не мог подобрать имени.</p><p>А потом встретил его.</p><p>Иногда мне казалось, что это сходство было случайностью. Удобной, почти смешной случайностью, которую мой мозг, как обычно, превратил во что-то гораздо большее. Но стоило мне снова посмотреть на холст, а затем на человека рядом, как все разумные объяснения начинали казаться до смешного маленькими. Неубедительными. Будто я пытался измерить расстояние между землёй и небом обычной линейкой.</p><p>Я не собирался рассказывать ему об этом. По крайней мере, не сейчас.</p><p>Он мог заметить сходство сам. Мог пройти мимо. Мог решить, что это просто очередное изображение из моей коллекции, ещё одна странная вещь среди десятков других. Я не знал, какой вариант предпочёл бы. Наверное, хотел и того и другого: чтобы он увидел, но не спросил. Чтобы понял, но не слишком. Чтобы задержался перед картиной и хотя бы на мгновение почувствовал то же необъяснимое беспокойство, которое каждый раз возникало у меня.</p><p>Я опустил глаза на собственные руки. На пальцах ещё оставались мелкие следы краски, которые я никак не мог окончательно отмыть.</p><p>Сначала он просто смотрел. Потом чуть наклонил голову, словно пытался рассмотреть какую-то деталь, которую не удавалось разобрать с первого раза. Его взгляд скользнул по лицу ангела, задержался на глазах, опустился к линии рта. Он отступил на полшага, снова посмотрел на холст и нахмурился.</p><p>Я почувствовал, как внутри что-то неприятно и одновременно сладко сжалось.</p><p>Он узнал себя.</p><p>Не сразу. Не так, чтобы это можно было прочитать по одному движению или выражению лица. Но я видел, как постепенно меняется его взгляд. Как первоначальное любопытство уступает место недоумению. Он снова посмотрел на картину, потом на меня, будто пытался сопоставить два изображения и найти между ними хоть какое-нибудь разумное объяснение.</p><p>— Это ты нарисовал? — спросил он.</p><p>Я кивнул.</p><p>Он не ответил сразу. Ещё раз посмотрел на холст, теперь уже внимательнее.</p><p>— Красиво, — произнёс он наконец.</p><p>Обычное слово. Почти случайное. Но в его голосе мне послышалось что-то ещё. Не только оценка работы — скорее попытка выиграть немного времени, пока он разбирался с собственным впечатлением.</p><p>— Только… — Он замолчал, снова посмотрел на изображение. — Он очень похож на меня.</p><p>Я не знал, что ответить.</p><p>Конечно, похож. Я видел это каждый раз, когда смотрел на картину. Иногда сходство казалось настолько очевидным, что мне становилось не по себе. В другие дни я убеждал себя, что просто запомнил его лицо и теперь невольно находил знакомые черты там, где их могло и не быть. Но сейчас он сам произнёс это вслух. И от этого совпадение перестало принадлежать только мне.</p><p>— Да? — спросил я, хотя прекрасно знал ответ.</p><p>Он повернулся ко мне. На его лице появилось выражение, которого я раньше не видел: смесь удивления и настороженности, будто он наткнулся на что-то слишком личное, даже не подозревая, что оно вообще существует.</p><p>— Ты серьёзно? — Он снова кивнул на картину. — Когда ты её нарисовал?</p><p>Я выдержал небольшую паузу.</p><p>— За несколько дней до нашего знакомства.</p><p>Он посмотрел на меня ещё внимательнее.</p><p>В комнате стало как-то особенно тихо. Даже уличный шум, казалось, отступил куда-то за стены. Я вдруг осознал, насколько странно всё это должно выглядеть со стороны: человек приходит в чужую квартиру, видит собственное лицо на изображении ангела, а художник сообщает ему, что написал картину ещё до их знакомства.</p><p>Я мог бы рассмеяться. Сказать, что это совпадение, что у меня просто такое воображение, что похожие лица встречаются чаще, чем кажется. Мог бы предложить ему самому найти отличия. Но почему-то не захотел.</p><p>— Кто это? — спросил он.</p><p>Я не ответил сразу. Вопрос вдруг оказался гораздо проще, чем всё, что происходило у меня внутри, и от этого почти смешным. Можно было сказать, что это вымышленный образ. Что я просто рисовал ангела. Что мне понравилась композиция, что я хотел попробовать поработать с крыльями, светом и человеческим лицом.</p><p>Всё это было бы правдой.</p><p>Но не всей.</p><p>— Мой ангел.</p><p>Между нами повисло что-то третье — нечто, чему ещё не нашлось места ни в его представлении обо мне, ни в моём представлении о нём. Оно было почти невесомым, но уже различимым. Как пыль в полосе света.</p><p>Я не стал ничего добавлять.</p><div class=\"scene-break\" aria-label=\"Разделитель сцены\"><span>. . .</span></div><p>В воздухе ещё держалась лёгкая дымка от блантов. Она медленно поднималась к потолку, расползалась по комнате тонкими полупрозрачными слоями, смешиваясь с запахом благовоний, пыли и чего-то сладковатого, оставшегося от недавно потушенных свечей. Приглушённый свет растекался по стенам, цеплялся за края мебели, за разбросанные вещи, за наши лица. Он делал всё мягче, размывал границы между предметами и тенями. Даже беспорядок казался частью какого-то тщательно продуманного замысла. Хотя я прекрасно знал, что это не так.</p><p>Мы сидели рядом. Достаточно близко, чтобы чувствовать тепло друг друга, но всё ещё оставляя между собой небольшое расстояние. Я то смотрел на него, то отвлекался на собственные руки, лежащие где-то между нами. Не знал, куда их деть. Не знал, куда деть себя.</p><p>На фоне заиграла I Monster — Heaven.</p><p>Сначала я почти не замечаю музыку. Несколько звуков возникают где-то за пределами внимания, будто доносятся из соседней комнаты. Потом мелодия постепенно проступает сквозь тишину: тягучая, немного отстранённая, с этой странной, почти невесомой интонацией, которая одновременно успокаивает и оставляет после себя лёгкое беспокойство. Она не заполняет паузу целиком, а будто обволакивает её, позволяя нам ничего не говорить. Звуки ложатся поверх приглушённого света, поверх едва различимого дыхания, поверх всего, что мы пока не решаемся произнести.</p><p>Я всегда любил такие моменты в музыке. Когда она не требует внимания, но всё равно незаметно меняет пространство вокруг. Когда комната перестаёт быть просто комнатой, а время — последовательностью минут, которые нужно как-то провести. Можно просто сидеть. Слушать. Смотреть на человека рядом и не искать оправдания тому, почему тебе хочется продолжать это делать.</p><p>Я поворачиваю голову. Он смотрит куда-то перед собой, кажется, прислушивается к мелодии. На его лице нет ни напряжения, ни той вежливой заинтересованности, которую люди иногда изображают, когда оказываются в непривычном месте. Он выглядит спокойно. По-настоящему спокойно. И от этого внутри что-то неприятно и сладко сжимается.</p><p>Наши руки соприкасаются. Сначала едва заметно — боковой стороной ладони, почти случайным движением. Я чувствую тепло его кожи и почему-то сразу обращаю на это слишком много внимания. Пальцы лежат неподвижно, но я уже успеваю придумать несколько причин отстраниться. Освободить место. Сделать вид, что ничего не произошло. Вернуть себе привычную дистанцию, за которой можно спрятаться.</p><p>Не делаю ничего из этого.</p><p>Он тоже не отстраняется. Его пальцы чуть смещаются, касаются моих. Между нами остаётся совсем небольшое расстояние, которое постепенно перестаёт иметь значение. Я позволяю своей руке расслабиться, и наши пальцы почти сплетаются.</p><p>Он нащупывает пальцем татуировку на моей кисти. Медленно проводит по чёрным линиям, словно пытается прочитать их на ощупь, затем чуть наклоняется, рассматривая изображение внимательнее. Его взгляд задерживается на мелких деталях, на пересечениях штрихов, на тенях, которые я уже давно перестал замечать.</p><p>Я наблюдаю за ним, почти не двигаясь. Забавно. Для меня эти рисунки давно стали привычной частью собственного тела — чем-то вроде родинок, шрамов или старых воспоминаний, к которым больше не возвращаешься без особой причины. Но сейчас чужие пальцы касаются одной из них с таким любопытством, будто перед ним не просто очередная картинка на коже, а что-то, заслуживающее отдельного внимания.</p><p>— Сколько их у тебя? Кажется, очень много.</p><p>— Семьдесят четыре. Хочешь экскурсию?</p><p>Я бросаю футболку куда-то рядом и поворачиваюсь к нему. Он придвигается ближе, сначала просто оглядывает меня целиком, словно пытается понять, с чего вообще начать. На коже действительно трудно найти свободное место. Чёрные линии, изображения, надписи, отдельные символы — всё перемешано, наслаивается друг на друга, но каким-то образом умещается в одной довольно хаотичной системе. Я привык к этому настолько, что порой забываю о существовании большинства рисунков. Они давно перестали казаться мне чем-то отдельным от тела.</p><p>Его взгляд останавливается на правом плече.</p><p>— Это Пирамидоголовый? Из Silent Hill?</p><p>Я поворачиваю голову, пытаясь посмотреть на собственное плечо, хотя, разумеется, ничего толком не вижу.</p><p>— Ага. Вторая часть.</p><p>Он наклоняется ближе. Рассматривает массивную фигуру, острые очертания металлической конструкции, тяжёлый силуэт, который занимает почти всю поверхность плеча. Я помню, как долго выбирал эскиз. Хотелось, чтобы он выглядел именно так: не просто чудовищем из игры, а чем-то неотвратимым. Почти религиозным в своей жестокости.</p><p>— Он ведь не совсем обычный монстр, да? — спрашивает он. — Насколько я помню, у него есть какое-то отношение к главному герою.</p><p>— К Джеймсу. Да. Но мне всегда казалось, что самое интересное в нём — не то, что он делает, а зачем вообще появляется. Пирамидоголовый не просто преследует Джеймса. Он воплощает его вину, его потребность в наказании. По крайней мере, так я это воспринимаю.</p><p>Я провожу пальцами по собственному плечу, останавливаясь у края рисунка.</p><p>— Джеймс совершает ужасную вещь, а потом оказывается в городе, который будто бы вытаскивает наружу всё, от чего он пытался спрятаться. Сайлент Хилл не даёт ему просто забыть. Он превращает его внутреннее состояние в нечто материальное. В кошмар, от которого нельзя отвернуться. И Пирамидоголовый — часть этого кошмара. Он нужен Джеймсу не только как палач. Он нужен ему как наказание, которого тот сам для себя хочет.</p><p>— То есть он сам его создаёт?</p><p>— Не совсем. Я бы не стал сводить всё к тому, что Джеймс просто выдумал себе монстра. Но его появление очень тесно связано с тем, что происходит у Джеймса в голове. Он хочет расплаты, даже если не может признаться себе в этом. И пока не сталкивается с собственной виной, не может от него избавиться.</p><p>Он снова смотрит на татуировку. Кажется, теперь рассматривает её немного иначе.</p><p>— Поэтому ты выбрал именно его?</p><p>Я пожимаю плечами.</p><p>— Наверное. Мне нравится сама идея наказания, которое становится отдельной фигурой. Когда вина перестаёт быть абстрактным чувством и получает лицо. Или, в данном случае, огромную металлическую башку.</p><p>Он тихо смеётся. Я тоже, хотя последняя фраза прозвучала не так уж весело.</p><p>— А на другом плече?</p><p>Я поворачиваюсь, показывая левую сторону. Там расположилась медсестра из той же игры, окружённая острыми элементами киберсигилизма. Он узнаёт её не сразу, но потом выражение лица меняется.</p><p>— У тебя действительно целая коллекция.</p><p>— Пока не вся.</p><p>— Ты очень любишь Silent Hill.</p><p>— Я обожаю вторую часть. Там вообще удивительно много всего, что можно разбирать бесконечно. И дело даже не в монстрах. Мне нравится, как игра обращается с человеческой психикой. Как показывает, что человек способен одновременно хотеть правды и бояться её, искать прощения и считать себя недостойным, желать освобождения, но продолжать держаться за собственное наказание.</p><p>Я замолкаю, глядя на медсестру.</p><p>— Наверное, поэтому она мне так близка. Там никто не получает простого ответа на вопрос, что с ним не так. И никто не выходит из собственного ада только потому, что очень этого хочет.</p><p>Он некоторое время молчит. Потом осторожно касается пальцами свободного участка кожи рядом с татуировкой.</p><p>— Похоже, ты довольно много в неё вложил.</p><p>— Возможно, больше, чем следовало бы.</p><p>Он не пытается развить эту мысль. Просто продолжает рассматривать рисунок, а потом его внимание перемещается ниже, на грудь. Там он замечает Мэй Боровски и, кажется, немного удивляется.</p><p>— А это уже совсем другая история.</p><p>— Мэй хорошая.</p><p>— Она выглядит довольно безобидно на фоне твоих предыдущих знакомых.</p><p>— Не обижай её. У неё тоже хватает проблем.</p><p>Я улыбаюсь. Здесь действительно нечего объяснять. Просто любимый персонаж, которого однажды захотелось оставить на коже. Не каждая вещь обязана быть символом моего внутреннего распада. Иногда мне просто нравится картинка. Иногда я вижу рисунок и понимаю, что хочу носить его с собой. Этого достаточно.</p><p>Его взгляд поднимается выше и останавливается на изображении Серафима под грудью. Он рассматривает его внимательнее, чем некоторые предыдущие татуировки.</p><p>— А это уже религиозная тема?</p><p>— Да. Серафим.</p><p>— В честь кого-нибудь?</p><p>— Нет. Скорее, в честь идеи.</p><p>Он чуть приподнимает брови, ожидая продолжения.</p><p>— Серафимы описаны в книге пророка Исаии. Они находятся рядом с Божьим престолом, у каждого по шесть крыльев. Двумя закрывают лицо, двумя — ноги, а двумя летают. И всё время повторяют: «Свят, Свят, Свят Господь Саваоф».</p><p>— Почему закрывают лицо?</p><p>— Потому что даже они не могут просто смотреть на Бога. По крайней мере, я так это понимаю. Они находятся ближе к Нему, чем остальные небесные существа, но всё равно признают, насколько Он выше их. Мне нравится эта мысль. Что даже нечто настолько прекрасное и совершенное способно осознавать собственную ограниченность.</p><p>Он снова переводит взгляд на татуировку.</p><p>— А при чём здесь уголь?</p><p>— В том же видении один из серафимов касается уст Исаии горящим углём с жертвенника. И говорит, что его беззаконие удалено, а грех очищен. Исаия 6:7.</p><p>— То есть очищение?</p><p>— Да. Но не в смысле, что человек никогда не совершал ничего плохого. Скорее, что его прошлое не обязательно должно навсегда определять то, кем он может стать.</p><p>Я ненадолго замолкаю, разглядывая собственную работу. Мне всегда казалось, что в этом эпизоде есть что-то особенно важное. Не оправдание, не прощение по умолчанию, а возможность измениться. Хотя я до сих пор не уверен, что сам в неё верю.</p><p>— Поэтому ты выбрал именно его?</p><p>— Наверное. Мне хотелось иметь на себе напоминание о святости, до которой я никогда не смогу дотянуться. И об очищении, которого, возможно, всё ещё хочу.</p><p>Его взгляд перемещается к шее. Колючая проволока обвивает её почти замкнутым кольцом. Он замечает рисунок не сразу, зато потом долго рассматривает, прослеживая взглядом каждый изгиб.</p><p>— Это тоже связано с религией?</p><p>— Да. Сразу с несколькими вещами. Терновый венец, распятие, наказание, жертва. И ещё петля. Мне нравится, как эти образы пересекаются друг с другом.</p><p>— Ты воспринимаешь их скорее как символы или буквально?</p><p>— По-разному. Я не думаю, что обязательно нужно выбирать между верой и символическим прочтением. Для меня история Христа — это не только история о спасении. Это ещё и история о страдании невиновного, о добровольной жертве, о том, как люди могут требовать наказания даже от того, кто не заслужил его.</p><p>Я замечаю, что он снова смотрит на проволоку.</p><p>— Но есть разница между жертвой и наказанием, — добавляю я. — По крайней мере, должна быть. Иногда я думаю, что люди слишком легко смешивают эти понятия. Будто если тебе больно, значит, ты обязательно за что-то расплачиваешься. Будто страдание само по себе способно сделать человека чище.</p><p>— А ты так думаешь?</p><p>Я отвожу взгляд.</p><p>— Не знаю. Наверное, мне хотелось бы, чтобы всё было настолько просто.</p><p>Он ничего не отвечает. И это, пожалуй, лучше любого поспешного возражения.</p><p>Я вдруг понимаю, что почти не думаю о том, как выгляжу со стороны. Не пытаюсь прикрыть особенно странные изображения, не тороплюсь оправдываться за надписи, которые могут показаться ему нелепыми или противоречивыми. Просто стою перед ним с голым торсом, позволяю рассматривать себя и рассказываю о совершенно разных кусках собственной жизни.</p><p>Семьдесят четыре маленьких свидетельства того, что я когда-то что-то любил, ненавидел, боялся, помнил или хотел забыть.</p><p>И он рассматривает их так внимательно, будто ни одно из них не кажется ему лишним.</p>"},{"n":3,"title":"CHAPTER III — EVERY YOU EVERY ME","epi":"Теперь мы видим как бы сквозь тусклое стекло, гадательно, тогда же лицом к лицу; теперь знаю я отчасти, а тогда познаю, подобно как я познан.","epiBy":"— Первое послание к Коринфянам 13:12","html":"<p class=\"first\">Закат разливался по стенам длинными полосами. Снаружи — густой, почти непрозрачный красный; внутри — приглушённый жёлтый свет, оставшийся от ламп. Они встречались где-то посередине, смешивались, перетекали друг в друга, постепенно теряя первоначальные очертания. Я смотрел на это смешение и думал, что даже цвета умеют находить общий язык лучше, чем люди. Им не нужно было объяснять, почему они тянутся друг к другу, оправдывать собственное желание или доказывать, что они заслуживают находиться рядом.</p><p>Мне безумно хотелось быть с ним. Не просто сидеть рядом, делить одно пространство, случайно соприкасаться плечами. Хотелось чувствовать его близость, касаться его тела, снова и снова возвращаться мыслями к той красной комнате — к тому вечеру, к тому, каким
